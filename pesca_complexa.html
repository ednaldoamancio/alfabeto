<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pescaria das Sílabas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        agua: '#165DFF',
                        marProfundo: '#003C9E',
                        aguaClara: '#4080FF',
                        areia: '#FFD166',
                        sucesso: '#06D6A0',
                        erro: '#EF476F',
                        alerta: '#FFBE0B',
                    },
                    fontFamily: {
                        principal: ['Comic Neue', 'cursive', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .conteudo-texto {
                @apply font-bold text-[clamp(1.8rem,5vw,3rem)];
            }
            .texto-piscando {
                @apply animate-pulse;
            }
            .sem-selecao {
                user-select: none;
                -webkit-user-select: none;
            }
        }

        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Neue', cursive;
        }

        body {
            overflow: hidden;
            background: linear-gradient(180deg, #165DFF 0%, #003C9E 100%);
        }

        /* Animações do jogo */
        @keyframes nadar-direita {
            0% { transform: translateX(-10vw) translateY(0); }
            25% { transform: translateX(25vw) translateY(-15px); }
            50% { transform: translateX(60vw) translateY(0); }
            75% { transform: translateX(85vw) translateY(15px); }
            100% { transform: translateX(110vw) translateY(0); }
        }

        @keyframes nadar-esquerda {
            0% { transform: translateX(110vw) translateY(0); }
            25% { transform: translateX(85vw) translateY(15px); }
            50% { transform: translateX(60vw) translateY(0); }
            75% { transform: translateX(25vw) translateY(-15px); }
            100% { transform: translateX(-10vw) translateY(0); }
        }

        @keyframes piscar {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        @keyframes pescar {
            0% { transform: scale(1) rotate(0deg); }
            20% { transform: scale(1.3) rotate(-5deg); }
            100% { transform: translateY(-120vh) scale(0.5) rotate(10deg); opacity: 0; }
        }

        @keyframes erro-anim {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        @keyframes onda-expansiva {
            0% { box-shadow: 0 0 0 0px rgba(255,255,255,0.6); }
            100% { box-shadow: 0 0 0 30px rgba(255,255,255,0); }
        }

        @keyframes brilho-suave {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.9; }
        }

        @keyframes subir-bolha {
            0% { transform: translateY(100vh); opacity: 0.7; }
            100% { transform: translateY(-20px); opacity: 0.1; }
        }

        .modo-maiusculo { text-transform: uppercase; }
        .modo-minusculo { text-transform: lowercase; }
        .modo-negrito { font-weight: bold; font-size: 1.2em; }

        .creature {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 10;
            touch-action: none;
        }

        .creature-icon {
            font-size: clamp(2.2rem, 6vw, 3.5rem);
            filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.2));
            transition: transform 0.3s ease;
        }

        .silaba-creature {
            background: rgba(255, 255, 255, 0.92);
            color: #003C9E;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: clamp(1.1rem, 3vw, 1.6rem);
            font-weight: bold;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
            border: 2px solid #fff;
        }

        .creature:hover .creature-icon { transform: scale(1.18); }
        .creature.pescado { animation: pescar 0.8s forwards ease-out; pointer-events: none; }
        .creature.erro-anim { animation: erro-anim 0.4s ease; }

        #silabaAlvo {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        #silabaAlvo.pulsando { animation: piscar 0.3s ease; }

        .feedback-correto {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: white;
            padding: 14px 28px;
            border-radius: 16px;
            font-size: 1.4rem;
            font-weight: bold;
            z-index: 999;
            animation: aparecer 0.8s ease forwards;
            pointer-events: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        @keyframes aparecer {
            0% { opacity: 0; transform: translate(-50%, -40%) scale(0.7); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .tesouro-particula {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #FFD166;
            animation: voar 0.8s forwards ease-out;
            opacity: 0.9;
        }

        @keyframes voar {
            0% { transform: scale(1); }
            100% { transform: translateY(-60px) translateX(var(--x-dir)) scale(0); opacity: 0; }
        }

        .onda {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            animation: onda-expansiva 0.6s ease-out forwards;
            z-index: 5;
        }

        .light-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: brilho-suave 4s infinite alternate;
        }

        .bolha {
            position: absolute;
            bottom: 0;
            background: rgba(255,255,255,0.7);
            border-radius: 50%;
            animation: subir-bolha 3s linear forwards;
            z-index: 2;
        }

        .custom-cursor {
            position: absolute;
            width: 45px;
            height: 45px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23FFD166" stroke="%23333" stroke-width="2"><path d="M12 2L15 9L22 9L17 14L19 21L12 17L5 21L7 14L2 9L9 9L12 2Z"/></svg>') no-repeat center;
            background-size: contain;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-12px, -12px);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .modal-fundo {
            backdrop-filter: blur(6px);
            background: rgba(0, 60, 158, 0.45);
        }
    </style>
</head>
<body class="sem-selecao">
    <!-- Partículas de luz -->
    <div id="lightParticles" class="fixed inset-0 z-0 pointer-events-none overflow-hidden"></div>

    <!-- Área principal do jogo -->
    <div class="relative w-full h-screen overflow-hidden z-10">
        <!-- Cabeçalho -->
        <header class="game-header absolute top-0 left-0 right-0 z-30 p-3 flex justify-between items-center bg-gradient-to-b from-marProfundo/80 to-transparent">
            <div id="progressHint" class="text-white font-bold text-lg md:text-xl bg-aguaClara/70 px-4 py-2 rounded-full shadow-md">
                🏆 Carregando...
            </div>
            <div class="flex gap-2">
                <button id="btnEscolherCategoria" class="bg-alerta hover:bg-alerta/90 text-white font-bold p-3 rounded-full shadow-lg transition-transform hover:scale-105 active:scale-95" title="Escolher Família">
                    <i class="fa fa-th-list text-lg"></i>
                </button>
                <button id="btnRepetirSilaba" class="bg-aguaClara hover:bg-aguaClara/90 text-white font-bold p-3 rounded-full shadow-lg transition-transform hover:scale-105 active:scale-95" title="Ouvir Novamente">
                    <i class="fa fa-volume-up text-lg"></i>
                </button>
                <button id="btn-audio" class="bg-aguaClara hover:bg-aguaClara/90 text-white font-bold p-3 rounded-full shadow-lg transition-transform hover:scale-105 active:scale-95" title="Ligar/Desligar Som">
                    🔊
                </button>
                <button id="btnMenuPrincipal" class="bg-erro hover:bg-erro/90 text-white font-bold p-3 rounded-full shadow-lg transition-transform hover:scale-105 active:scale-95" title="Menu Principal">
                    <i class="fa fa-home text-lg"></i>
                </button>
                <button id="btnFullscreen" class="bg-aguaClara hover:bg-aguaClara/90 text-white font-bold p-3 rounded-full shadow-lg transition-transform hover:scale-105 active:scale-95" title="Tela Cheia">
                    <i class="fa fa-expand text-lg"></i>
                </button>
            </div>
        </header>

        <!-- Instrução e Sílabas Alvo -->
        <div class="instrucao-wrapper absolute top-[70px] left-0 right-0 z-20 text-center px-4">
            <p class="text-white/90 text-lg md:text-xl mb-2 drop-shadow-md">Toque no peixe que tem a sílaba:</p>
            <div id="silabaAlvo" class="bg-white/95 text-marProfundo conteudo-texto inline-block px-8 py-3 rounded-2xl shadow-2xl border-4 border-white">
                -
            </div>
        </div>

        <!-- Aquário / Área de jogo -->
        <div id="aquario" class="absolute inset-0 z-5 overflow-hidden"></div>
    </div>

    <!-- MODAL: Seleção de Categorias -->
    <div id="modal-categorias" class="modal-fundo fixed inset-0 z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg max-h-[80vh] overflow-hidden transform scale-95 transition-all">
            <div class="bg-agua text-white p-5 flex justify-between items-center">
                <h2 class="text-2xl font-bold">📚 Escolha a Família</h2>
                <button id="btnFecharCategorias" class="text-white/80 hover:text-white text-2xl font-bold">×</button>
            </div>
            <div id="listaCategorias" class="p-4 grid grid-cols-2 sm:grid-cols-3 gap-3 overflow-y-auto max-h-[60vh]"></div>
        </div>
    </div>

    <!-- MODAL: Vitória / Conclusão -->
    <div id="modal-vitoria" class="modal-fundo fixed inset-0 z-[200] hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl text-center p-8 max-w-md w-full transform scale-95 transition-all">
            <div class="text-6xl mb-4">🎉</div>
            <h2 id="vitoria-msg-topo" class="text-[clamp(1.8rem,4vw,2.5rem)] font-bold text-marProfundo mb-3"></h2>
            <p id="scoreFinalModal" class="text-xl text-gray-700 mb-4 font-semibold"></p>
            <p id="vitoria-msg-sub" class="text-lg text-aguaClara font-medium"></p>
        </div>
    </div>

    <!-- MODAL: Navegação / Voltar -->
    <div id="modal-navegacao" class="modal-fundo fixed inset-0 z-[150] hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl text-center p-8 max-w-sm w-full">
            <h2 class="text-2xl font-bold text-marProfundo mb-4">Tem certeza?</h2>
            <p class="text-gray-600 mb-6">Você deseja voltar para o menu principal? Seu progresso atual será perdido.</p>
            <div class="flex gap-4 justify-center">
                <button id="btnCancelarVolta" class="bg-gray-300 hover:bg-gray-400 text-white font-bold py-3 px-6 rounded-xl transition-colors">
                    Cancelar
                </button>
                <button id="btnConfirmarVolta" class="bg-erro hover:bg-erro/90 text-white font-bold py-3 px-6 rounded-xl transition-colors">
                    Sim, Voltar
                </button>
            </div>
        </div>
    </div>

    <!-- Áudio -->
    <audio id="bg-audio" loop volume="0.2">
        <source src="https://assets.mixkit.co/music/preview/mixkit-games-melody-1156.mp3" type="audio/mpeg">
    
    <audio id="sfx-pescado" volume="0.7">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3" type="audio/mpeg">
    
    <audio id="sfx-erro" volume="0.5">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3" type="audio/mpeg">
    

    <script>
        // ========== CONFIGURAÇÕES E DADOS ==========
        const categorias = [
            { nome: "Família B", silabas: [ {texto:"BA", audio:"ba.mp3"}, {texto:"BE", audio:"be.mp3"}, {texto:"BI", audio:"bi.mp3"}, {texto:"BO", audio:"bo.mp3"}, {texto:"BU", audio:"bu.mp3"} ] },
            { nome: "Família C", silabas: [ {texto:"CA", audio:"ca.mp3"}, {texto:"CE", audio:"ce.mp3"}, {texto:"CI", audio:"ci.mp3"}, {texto:"CO", audio:"co.mp3"}, {texto:"CU", audio:"cu.mp3"} ] },
            { nome: "Família D", silabas: [ {texto:"DA", audio:"da.mp3"}, {texto:"DE", audio:"de.mp3"}, {texto:"DI", audio:"di.mp3"}, {texto:"DO", audio:"do.mp3"}, {texto:"DU", audio:"du.mp3"} ] },
            { nome: "Família F", silabas: [ {texto:"FA", audio:"fa.mp3"}, {texto:"FE", audio:"fe.mp3"}, {texto:"FI", audio:"fi.mp3"}, {texto:"FO", audio:"fo.mp3"}, {texto:"FU", audio:"fu.mp3"} ] },
            { nome: "Família G", silabas: [ {texto:"GA", audio:"ga.mp3"}, {texto:"GE", audio:"ge.mp3"}, {texto:"GI", audio:"gi.mp3"}, {texto:"GO", audio:"go.mp3"}, {texto:"GU", audio:"gu.mp3"} ] },
            { nome: "Família J", silabas: [ {texto:"JA", audio:"ja.mp3"}, {texto:"JE", audio:"je.mp3"}, {texto:"JI", audio:"ji.mp3"}, {texto:"JO", audio:"jo.mp3"}, {texto:"JU", audio:"ju.mp3"} ] },
            { nome: "Família L", silabas: [ {texto:"LA", audio:"la.mp3"}, {texto:"LE", audio:"le.mp3"}, {texto:"LI", audio:"li.mp3"}, {texto:"LO", audio:"lo.mp3"}, {texto:"LU", audio:"lu.mp3"} ] },
            { nome: "Família M", silabas: [ {texto:"MA", audio:"ma.mp3"}, {texto:"ME", audio:"me.mp3"}, {texto:"MI", audio:"mi.mp3"}, {texto:"MO", audio:"mo.mp3"}, {texto:"MU", audio:"mu.mp3"} ] },
            { nome: "Família N", silabas: [ {texto:"NA", audio:"na.mp3"}, {texto:"NE", audio:"ne.mp3"}, {texto:"NI", audio:"ni.mp3"}, {texto:"NO", audio:"no.mp3"}, {texto:"NU", audio:"nu.mp3"} ] },
            { nome: "Família P", silabas: [ {texto:"PA", audio:"pa.mp3"}, {texto:"PE", audio:"pe.mp3"}, {texto:"PI", audio:"pi.mp3"}, {texto:"PO", audio:"po.mp3"}, {texto:"PU", audio:"pu.mp3"} ] },
            { nome: "Família R", silabas: [ {texto:"RA", audio:"ra.mp3"}, {texto:"RE", audio:"re.mp3"}, {texto:"RI", audio:"ri.mp3"}, {texto:"RO", audio:"ro.mp3"}, {texto:"RU", audio:"ru.mp3"} ] },
            { nome: "Família S", silabas: [ {texto:"SA", audio:"sa.mp3"}, {texto:"SE", audio:"se.mp3"}, {texto:"SI", audio:"si.mp3"}, {texto:"SO", audio:"so.mp3"}, {texto:"SU", audio:"su.mp3"} ] },
            { nome: "Família T", silabas: [ {texto:"TA", audio:"ta.mp3"}, {texto:"TE", audio:"te.mp3"}, {texto:"TI", audio:"ti.mp3"}, {texto:"TO", audio:"to.mp3"}, {texto:"TU", audio:"tu.mp3"} ] },
            { nome: "Família V", silabas: [ {texto:"VA", audio:"va.mp3"}, {texto:"VE", audio:"ve.mp3"}, {texto:"VI", audio:"vi.mp3"}, {texto:"VO", audio:"vo.mp3"}, {texto:"VU", audio:"vu.mp3"} ] },
            { nome: "Família CH", silabas: [ {texto:"CHA", audio:"cha.mp3"}, {texto:"CHE", audio:"che.mp3"}, {texto:"CHI", audio:"chi.mp3"}, {texto:"CHO", audio:"cho.mp3"}, {texto:"CHU", audio:"chu.mp3"} ] },
            { nome: "Família LH", silabas: [ {texto:"LHA", audio:"lha.mp3"}, {texto:"LHE", audio:"lhe.mp3"}, {texto:"LHI", audio:"lhi.mp3"}, {texto:"LHO", audio:"lho.mp3"}, {texto:"LHU", audio:"lhu.mp3"} ] },
            { nome: "Família NH", silabas: [ {texto:"NHA", audio:"nha.mp3"}, {texto:"NHE", audio:"nhe.mp3"}, {texto:"NHI", audio:"nhi.mp3"}, {texto:"NHO", audio:"nho.mp3"}, {texto:"NHU", audio:"nhu.mp3"} ] },
        ];

        const criaturas = ['🐟','🐠','🐡','🦈','🐬','🦑','🐙','🦀','🦐','🐳'];
        let modoGrafia = 'maiusculo';
        let jogoAtivo = true;
        let aguardandoProxima = false;
        let transicaoCategoria = false;
        let indiceCategoriaAtual = 0;
        let indiceSilabaAtual = 0;
        let silabasAtuais = [];
        let pontuacaoTotal = 0;
        let acertosNaEtapa = 0;
        let criaturasNaTela = window.innerWidth < 768 ? 3 : (window.innerWidth < 1024 ? 4 : 5);
        let audioEnabled = true;
        let tempoInicio, intervaloRelogio;

        // Elementos DOM
        const aquario = document.getElementById("aquario");
        const modalVitoria = document.getElementById("modal-vitoria");
        const modalCategorias = document.getElementById("modal-categorias");
        const modalNavegacao = document.getElementById("modal-navegacao");

        // ========== FUNÇÕES AUXILIARES ==========
        function getTextoTransformado(texto) {
            if(modoGrafia === 'maiusculo') return texto.toUpperCase();
            if(modoGrafia === 'minusculo') return texto.toLowerCase();
            return texto;
        }

        function tocarSilaba(silabaObj, callback) {
            if(!audioEnabled) { if(callback) callback(); return; }
            // Simulação de áudio para demonstração
            setTimeout(() => { if(callback) callback(); }, 350);
        }

        function criarTesouro(x, y) {
            for(let i=0; i<8; i++) {
                const p = document.createElement("div");
                p.className = "tesouro-particula";
                p.style.left = x + "px";
                p.style.top = y + "px";
                p.style.setProperty('--x-dir', (Math.random()-0.5)*60 + 'px');
                aquario.appendChild(p);
                setTimeout(()=>p.remove(), 800);
            }
        }

        function criarOndaChoque(x, y) {
            const onda = document.createElement("div");
            onda.className = "onda";
            onda.style.left = (x - 20) + "px";
            onda.style.top = (y - 20) + "px";
            onda.style.width = "40px";
            onda.style.height = "40px";
            aquario.appendChild(onda);
            setTimeout(()=>onda.remove(), 600);
        }

        function iniciarCronometro() {
            tempoInicio = Date.now();
            if(intervaloRelogio) clearInterval(intervaloRelogio);
            intervaloRelogio = setInterval(()=>{}, 1000);
        }

        function pararCronometro() {
            if(intervaloRelogio) clearInterval(intervaloRelogio);
        }

        function mostrarFeedback(texto, acerto, x, y){
            const d=document.createElement("div"); 
            d.className="feedback-correto"; 
            d.style.background=acerto?"#2e7d32ee":"#c62828ee";
            d.innerText=acerto?`🎣✨ +15 ⭐ ${texto} ✨`:`❌ ${texto}`; 
            document.body.appendChild(d); 
            setTimeout(()=>d.remove(),850);
            if(acerto && x){ criarTesouro(x,y); criarOndaChoque(x,y); }
        }

        function atualizarUI(){ 
            document.getElementById("progressHint").innerHTML = `🏆 ${categorias[indiceCategoriaAtual].nome.substring(0,22)} | ${acertosNaEtapa}/${silabasAtuais.length}`; 
        }

        function repetirSilabaAlvo() {
            const silabaObj = silabasAtuais[indiceSilabaAtual];
            if (!silabaObj) return;
            document.getElementById("silabaAlvo").classList.add("pulsando");
            setTimeout(() => document.getElementById("silabaAlvo").classList.remove("pulsando"), 300);
            tocarSilaba(silabaObj);
        }

        function calcularAreaSegura() {
            const header = document.querySelector('.game-header');
            const instrucao = document.querySelector('.instrucao-wrapper');
            const headerHeight = header ? header.offsetHeight : 120;
            const instrucaoHeight = instrucao ? instrucao.offsetHeight + 30 : 80;
            return Math.max(((headerHeight + instrucaoHeight) / window.innerHeight) * 100 + 5, 25);
        }

        // ========== JOGO PRINCIPAL ==========
        function carregarProximaSilaba() {
            if (indiceSilabaAtual >= silabasAtuais.length) { concluirCategoria(); return; }
            const certa = silabasAtuais[indiceSilabaAtual];
            document.getElementById("silabaAlvo").innerText = getTextoTransformado(certa.texto);
            document.getElementById("silabaAlvo").className = 'modo-' + modoGrafia;
            atualizarUI();
            aquario.innerHTML = "";
            let opcoes = [certa];
            let outras = silabasAtuais.filter(s => s.texto !== certa.texto);
            outras.sort(()=>0.5-Math.random());
            opcoes.push(...outras.slice(0, criaturasNaTela-1));
            while(opcoes.length < criaturasNaTela) opcoes.push({texto:"CHA", audio:"cha.mp3"});
            opcoes.sort(()=>Math.random()-0.5);
            opcoes.forEach(sil => criarCriatura(sil, certa));
            setTimeout(()=>{ if(jogoAtivo && !aguardandoProxima) tocarSilaba(certa); }, 500);
        }

        function criarCriatura(silabaObj, alvoObj) {
            const c = document.createElement("div");
            c.className = "creature";
            const minTop = calcularAreaSegura();
            const maxTop = 85;
            c.style.top = Math.random() * (maxTop - minTop) + minTop + "%";
            const dir = Math.random() > 0.5;
            const dur = Math.random() * 5 + 4.5;
            c.style.animation = dir ? `nadar-direita ${dur}s linear infinite` : `nadar-esquerda ${dur}s linear infinite`;
            const emoji = criaturas[Math.floor(Math.random() * criaturas.length)];
            const flip = dir ? 'transform: scaleX(-1);' : '';
            const silTexto = getTextoTransformado(silabaObj.texto);
            c.innerHTML = `<span class="creature-icon" style="${flip}">${emoji}</span>
                           <span class="silaba-creature modo-${modoGrafia}">${silTexto}</span>`;
            function handleInteraction(e) {
                e.preventDefault(); e.stopPropagation();
                if(!jogoAtivo || aguardandoProxima) return;
                const rect = c.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                if(silabaObj.texto === alvoObj.texto) acertou(c, silabaObj, centerX, centerY);
                else errou(c, silabaObj);
            }
            c.addEventListener('pointerdown', handleInteraction, { passive: false });
            c.addEventListener('touchstart', handleInteraction, { passive: false });
            c.addEventListener('click', handleInteraction);
            aquario.appendChild(c);
        }

        function acertou(elem, silabaObj, x, y) {
            if(!jogoAtivo) return;
            jogoAtivo = false;
            if(audioEnabled) document.getElementById("sfx-pescado").play().catch(e=>{});
            const rect = elem.getBoundingClientRect();
            elem.style.animation = "none";
            elem.style.left = rect.left + "px";
            elem.style.top = rect.top + "px";
            elem.classList.add("pescado");
            pontuacaoTotal += 15;
            acertosNaEtapa++;
            atualizarUI();
            mostrarFeedback(getTextoTransformado(silabaObj.texto), true, x, y);
            tocarSilaba(silabaObj, () => {
                indiceSilabaAtual++;
                if(indiceSilabaAtual < silabasAtuais.length) {
                    jogoAtivo = true;
                    carregarProximaSilaba();
                } else {
                    concluirCategoria();
                }
            });
        }

        function errou(elem, silabaObj) {
            if(!jogoAtivo) return;
            if(audioEnabled) document.getElementById("sfx-erro").play().catch(e=>{});
            mostrarFeedback(getTextoTransformado(silabaObj.texto), false);
            elem.classList.add("erro-anim");
            setTimeout(()=>elem.classList.remove("erro-anim"),400);
            tocarSilaba(silabaObj);
        }

        function resetarJogoParaCategoria(indice) {
            if(intervaloRelogio) clearInterval(intervaloRelogio);
            jogoAtivo = false;
            aguardandoProxima = false;
            transicaoCategoria = false;
            pontuacaoTotal = 0;
            indiceCategoriaAtual = indice;
            const categoria = categorias[indiceCategoriaAtual];
            silabasAtuais = [...categoria.silabas];
            indiceSilabaAtual = 0;
            acertosNaEtapa = 0;
            atualizarUI();
            aquario.innerHTML = "";
            jogoAtivo = true;
            iniciarCronometro();
            carregarProximaSilaba();
        }

        function concluirCategoria() {
            if (aguardandoProxima || transicaoCategoria) return;
            transicaoCategoria = true;
            aguardandoProxima = true;
            jogoAtivo = false;
            pararCronometro();
            aquario.innerHTML = "";
            
            // Exibe modal de vitória
            modalVitoria.style.display = "flex";
            document.getElementById("vitoria-msg-topo").innerHTML = `✨ ${categorias[indiceCategoriaAtual].nome} ✨`;
            document.getElementById("scoreFinalModal").innerHTML = `✅ Acertos: ${acertosNaEtapa}/${silabasAtuais.length} | Pontos: ${pontuacaoTotal}`;
            
            // Verifica se é a última categoria
            if (indiceCategoriaAtual + 1 < categorias.length) {
                document.getElementById("vitoria-msg-sub").innerHTML = "🐟 Avançando para a próxima família...";
                // Avança após 2 segundos
                setTimeout(() => {
                    modalVitoria.style.display = "none";
                    indiceCategoriaAtual++;
                    resetarJogoParaCategoria(indiceCategoriaAtual);
                    // CORREÇÃO PRINCIPAL: Garante que as flags sejam resetadas
                    aguardandoProxima = false;
                    transicaoCategoria = false;
                }, 2000);
            } else {
                document.getElementById("vitoria-msg-sub").innerHTML = "🏆 PARABÉNS! Você completou TODAS as famílias! 🏆";
                setTimeout(() => {
                    modalVitoria.style.display = "none";
                    aguardandoProxima = false;
                    transicaoCategoria = false;
                }, 3000);
            }
        }

        // ========== SELEÇÃO MANUAL DE CATEGORIA ==========
        function abrirSeletorCategorias() { 
            // CORREÇÃO: Garante que o modal abra mesmo durante o jogo
            modalCategorias.style.display = "flex"; 
        }
        function fecharSeletor() { modalCategorias.style.display = "none"; }
        function preencherGridCategorias() {
            const grid = document.getElementById("listaCategorias");
            grid.innerHTML = "";
            categorias.forEach((cat, idx) => {
                const btn = document.createElement("button");
                btn.className = "cat-botao bg-aguaClara hover:bg-agua text-white font-bold py-3 px-4 rounded-xl transition-colors shadow-md";
                btn.innerText = cat.nome;
                btn.onclick = () => {
                    resetarJogoParaCategoria(idx);
                    fecharSeletor();
                };
                btn.ontouchstart = (e) => { 
                    e.preventDefault(); 
                    resetarJogoParaCategoria(idx); 
                    fecharSeletor(); 
                };
                grid.appendChild(btn);
            });
        }

        // ========== NAVEGAÇÃO E EVENTOS ==========
        function toggleFullscreen(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
        function toggleAudio(){ audioEnabled=!audioEnabled; document.getElementById("btn-audio").innerHTML=audioEnabled?"🔊":"🔇"; if(audioEnabled) document.getElementById("bg-audio").play().catch(e=>{}); else document.getElementById("bg-audio").pause(); }
        function voltarMenu(){ modalNavegacao.style.display = "flex"; }
        function addBothEvents(el, handler) { 
            if(el){ 
                el.addEventListener('click', handler); 
                el.addEventListener('touchstart', handler, { passive: false }); 
            } 
        }

        const btnVoltarElem = document.getElementById("btnVoltar");
        const btnCancelar = document.getElementById("btnCancelarVolta");
        const btnConfirmar = document.getElementById("btnConfirmarVolta");
        const btnRepetir = document.getElementById("btnRepetirSilaba");
        const silabaAlvoElem = document.getElementById("silabaAlvo");
        const btnFecharCats = document.getElementById("btnFecharCategorias");
        const btnMenu = document.getElementById("btnMenuPrincipal");
        const btnFull = document.getElementById("btnFullscreen");
        const btnAudioElem = document.getElementById("btn-audio");
        const btnEscolher = document.getElementById("btnEscolherCategoria");

        addBothEvents(btnVoltarElem, voltarMenu);
        addBothEvents(btnCancelar, () => modalNavegacao.style.display = "none");
        addBothEvents(btnConfirmar, () => { modalNavegacao.style.display = "none"; window.location.href = "index_pesca.html"; });
        addBothEvents(btnRepetir, repetirSilabaAlvo);
        addBothEvents(silabaAlvoElem, (e) => { e.stopPropagation(); repetirSilabaAlvo(); });
        // CORREÇÃO: Evento do botão de escolher famílias garantido
        addBothEvents(btnEscolher, abrirSeletorCategorias);
        addBothEvents(btnFecharCats, fecharSeletor);
        addBothEvents(btnMenu, () => { window.location.href = "index_pesca.html"; });
        addBothEvents(btnFull, toggleFullscreen);
        addBothEvents(btnAudioElem, toggleAudio);

        // Cursor personalizado
        function initCustomCursor() {
            if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
                const cursorDiv = document.createElement('div'); 
                cursorDiv.className = 'custom-cursor'; 
                document.body.appendChild(cursorDiv);
                document.addEventListener('mousemove', (e) => { cursorDiv.style.left = e.clientX + 'px'; cursorDiv.style.top = e.clientY + 'px'; cursorDiv.style.display = 'block'; });
                document.addEventListener('mouseleave', () => { cursorDiv.style.display = 'none'; });
                document.addEventListener('mouseenter', () => { cursorDiv.style.display = 'block'; });
                document.body.style.cursor = 'none';
            }
        }

        function criarParticulasLuz() {
            const container = document.getElementById("lightParticles");
            for(let i=0;i<40;i++){
                setTimeout(()=>{
                    const p=document.createElement("div"); 
                    p.className="light-particle";
                    p.style.width=Math.random()*8+3+"px"; 
                    p.style.height=p.style.width;
                    p.style.left=Math.random()*100+"%"; 
                    p.style.animationDelay=Math.random()*10+"s";
                    p.style.animationDuration=Math.random()*6+6+"s";
                    container.appendChild(p);
                    setTimeout(()=>p.remove(),12000);
                }, i*300);
            }
        }

        window.addEventListener('resize',()=>{ criaturasNaTela = window.innerWidth<768?3:(window.innerWidth<1024?4:5); });
        setInterval(()=>{
            if(jogoAtivo && !aguardandoProxima && Math.random()>0.85){
                const b=document.createElement("div"); 
                b.className="bolha";
                const t=Math.random()*20+8; 
                b.style.width=t+"px"; 
                b.style.height=t+"px";
                b.style.left=Math.random()*100+"%"; 
                b.style.animationDuration=Math.random()*3+2+"s";
                document.body.appendChild(b); 
                setTimeout(()=>b.remove(),5000);
            }
        },1000);

        window.onload = () => {
            criarParticulasLuz();
            preencherGridCategorias();
            initCustomCursor();
            indiceCategoriaAtual = 0;
            resetarJogoParaCategoria(0);
        };
    </script>
</body>
</html>
