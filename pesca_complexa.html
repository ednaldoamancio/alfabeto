            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', 'Comic Neue', 'Comic Sans MS', Tahoma, sans-serif;
            background: #000;
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            touch-action: manipulation;
        }

        .custom-cursor {
            position: fixed;
            width: 45px;
            height: 45px;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.5));
        }
        .custom-cursor::before {
            content: "🔱";
            font-size: 40px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        @media (hover: none) and (pointer: coarse) {
            .custom-cursor { display: none; }
            body { cursor: auto; }
        }

        #bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0.6;
            filter: brightness(0.8) contrast(1.1) saturate(1.2);
            pointer-events: none;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0,20,50,0.7), rgba(0,5,20,0.85));
            z-index: 0;
            pointer-events: none;
        }

        .light-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .light-particle {
            position: absolute;
            background: radial-gradient(circle, rgba(255,255,200,0.6), transparent);
            border-radius: 50%;
            animation: floatLight 8s ease-in-out infinite;
        }
        @keyframes floatLight {
            0% { transform: translateY(100vh) translateX(0) scale(0); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(-20vh) translateX(100px) scale(1.5); opacity: 0; }
        }

        #game-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }

        .top-bar {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }
        .icon-btn {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #ffd54f;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            backdrop-filter: blur(4px);
            transition: transform 0.2s;
        }
        @media (min-width: 768px) {
            .icon-btn { width: 50px; height: 50px; font-size: 24px; }
            .top-bar { top: 20px; left: 20px; gap: 15px; }
        }

        .game-info-container {
            width: 100%;
            padding-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 20;
            pointer-events: none;
        }

        .game-info {
            display: flex;
            gap: 10px;
            background: rgba(0, 10, 25, 0.85);
            padding: 6px 15px;
            border-radius: 40px;
            border: 2px solid #00acc1;
            font-weight: bold;
            font-size: 11px;
            backdrop-filter: blur(4px);
            flex-wrap: wrap;
            justify-content: center;
        }
        @media (min-width: 768px) {
            .game-info { gap: 20px; padding: 10px 25px; font-size: 18px; }
        }
        .timer {
            background: #000000aa;
            padding: 4px 12px;
            border-radius: 30px;
            font-family: 'Courier New', monospace;
            color: #00ffcc;
        }

        .instrucao {
            font-size: 16px;
            font-weight: 900;
            margin-top: 8px;
            background: rgba(0,0,0,0.75);
            padding: 6px 14px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: baseline;
            gap: 6px;
            cursor: pointer;
            pointer-events: auto;
            border: 1px solid #ffd54f;
        }
        @media (min-width: 768px) {
            .instrucao { font-size: 24px; margin-top: 15px; padding: 8px 20px; gap: 10px; }
        }
        #silabaAlvo {
            color: #ffd54f;
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, #1a2a3a, #0a1a2a);
            padding: 0 15px;
            border-radius: 40px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #ff9800;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.15s ease;
            border: 1px solid #00acc1;
        }
        #silabaAlvo.pulsando {
            transform: scale(1.25);
            text-shadow: 0 0 20px #ffca28;
            border-color: #ffd54f;
        }

        .oceano {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            overflow: visible;
            pointer-events: auto;
        }

        .creature {
            position: absolute;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100px;
            height: 100px;
            pointer-events: auto;
            filter: brightness(1.1) saturate(1.1);
            z-index: 50;
            transition: transform 0.05s;
        }
        .creature:active { transform: scale(0.95); }
        .creature::after {
            content: "";
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            border-radius: 50%;
            pointer-events: auto;
        }
        @media (min-width: 768px) { .creature { width: 120px; height: 120px; } }
        .creature-icon {
            font-size: 65px;
            position: absolute;
            filter: drop-shadow(3px 6px 10px rgba(0,0,0,0.5));
            pointer-events: none;
        }
        @media (min-width: 768px) { .creature-icon { font-size: 85px; } }

            font-size: 18px;
            font-weight: bold;
            color: #FFFDE7;
            background: rgba(0,0,0,0.65);
            padding: 5px 10px;
            border-radius: 30px;
            position: absolute;
            text-shadow: 1px 1px 0 #0a2f5a;
            font-family: monospace;
            white-space: nowrap;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255,215,0,0.5);
            pointer-events: none;
        }
        @media (min-width: 768px) {
            .silaba-creature { font-size: 26px; padding: 6px 14px; }
        }

        .pescado {
            animation: subir-vertical 0.8s cubic-bezier(0.4,0,0.2,1) forwards !important;
            pointer-events: none !important;
            z-index: 300;
            filter: brightness(1.5) !important;
        }
        @keyframes subir-vertical {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-120vh) scale(0.3); opacity: 0; }
        }
        @keyframes nadar-direita {
            0% { left: -120px; }
            100% { left: 100%; }
        }
        @keyframes nadar-esquerda {
            0% { left: 100%; }
            100% { left: -120px; }
        }
        @media (min-width: 768px) {
            @keyframes nadar-direita { 0% { left: -150px; } 100% { left: 100%; } }
            @keyframes nadar-esquerda { 0% { left: 100%; } 100% { left: -150px; } }
        }

        .treasure-effect {
            position: absolute;
            font-size: 40px;
            pointer-events: none;
            z-index: 200;
            animation: treasureFloat 0.8s ease-out forwards;
        }
        @keyframes treasureFloat {
            0% { transform: scale(0.2) translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: scale(1.5) translateY(-100px) rotate(360deg); opacity: 0; }
        }
        .bolha {
            position: absolute;
            bottom: -50px;
            background: radial-gradient(circle, rgba(100,200,255,0.5), rgba(50,100,200,0.2));
            border-radius: 50%;
            pointer-events: none;
            animation: subir-bolha linear forwards;
        }
        @keyframes subir-bolha {
            to { transform: translateY(-120vh) translateX(60px); opacity: 0; }
        }
        .shockwave {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,215,0,0.8), transparent);
            pointer-events: none;
            animation: expandWave 0.5s ease-out forwards;
        }
        @keyframes expandWave {
            0% { transform: scale(0.5); opacity: 0.8; }
            100% { transform: scale(8); opacity: 0; }
        }

        #modal-vitoria, #modal-navegacao {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,10,25,0.98);
            backdrop-filter: blur(14px);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .vitoria-texto { font-size: 4vh; color: #ffd54f; margin: 15px 0; }

        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .score-panel {
            font-size: 16px;
            background: linear-gradient(135deg,#1e2a3a,#0a1520);
            padding: 8px 20px;
            border-radius: 60px;
            border: 1px solid #ffd54f;

        .feedback-correto {
            position: fixed;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            background: #2e7d32ee;
            backdrop-filter: blur(8px);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            z-index: 200;
            animation: fadeUp 0.9s ease-out forwards;
            pointer-events: none;
            white-space: nowrap;
            border: 2px solid #ffd54f;
        }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            20% { opacity: 1; transform: translateX(-50%) translateY(0); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-50px); }
        }
        .progresso-categoria {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 6px 12px;
            border-radius: 25px;
            font-size: 10px;
            backdrop-filter: blur(5px);
            color: #ffd54f;
            pointer-events: none;

            left: 15px;
            background: linear-gradient(135deg, #00acc1, #006064);
            border: none;
            border-radius: 40px;
            padding: 10px 18px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            z-index: 200;
            backdrop-filter: blur(4px);
            pointer-events: auto;
            transition: all 0.3s;

            bottom: 10px;
            left: 10px;

            border-radius: 15px;
            font-size: 9px;
            color: #aaa;
            pointer-events: none;

        .nav-btn {
            background: linear-gradient(135deg, #00acc1, #006064);
            border: 2px solid #ffd54f;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 40px;
            cursor: pointer;
            color: white;
        }

</head>

            { texto: "NHI", audio: "nhi.mp3" }, { texto: "NHO", audio: "nho.mp3" },
            { texto: "NHU", audio: "nhu.mp3" }, { texto: "NHÃO", audio: "nhao.mp3" }
        ] },
        { nome: "🦑 PLA - PLE - PLI - PLO - PLU - PLÃO", silabas: [
            { texto: "PLA", audio: "pla.mp3" }, { texto: "PLE", audio: "ple.mp3" },
            { texto: "PLI", audio: "pli.mp3" }, { texto: "PLO", audio: "plo.mp3" },
            { texto: "PLU", audio: "plu.mp3" }, { texto: "PLÃO", audio: "plao.mp3" }
        ] },
        { nome: "🐠 PRA - PRE - PRI - PRO - PRU - PRÃO", silabas: [
            { texto: "PRA", audio: "pra.mp3" }, { texto: "PRE", audio: "pre.mp3" },
            { texto: "PRI", audio: "pri.mp3" }, { texto: "PRO", audio: "pro.mp3" },
            { texto: "PRU", audio: "pru.mp3" }, { texto: "PRÃO", audio: "prao.mp3" }
        ] },
        { nome: "🐋 TLA - TLE - TLI - TLO - TLU - TLÃO", silabas: [
            { texto: "TLA", audio: "tla.mp3" }, { texto: "TLE", audio: "tle.mp3" },
            { texto: "TLI", audio: "tli.mp3" }, { texto: "TLO", audio: "tlo.mp3" },
            { texto: "TLU", audio: "tlu.mp3" }, { texto: "TLÃO", audio: "tlao.mp3" }
        ] },
        { nome: "🐢 TRA - TRE - TRI - TRO - TRU - TRÃO", silabas: [
            { texto: "TRA", audio: "tra.mp3" }, { texto: "TRE", audio: "tre.mp3" },
            { texto: "TRI", audio: "tri.mp3" }, { texto: "TRO", audio: "tro.mp3" },
            { texto: "TRU", audio: "tru.mp3" }, { texto: "TRÃO", audio: "trao.mp3" }
        ] },
        { nome: "🐚 VLA - VLE - VLI - VLO - VLU - VLÃO", silabas: [
            { texto: "VLA", audio: "vla.mp3" }, { texto: "VLE", audio: "vle.mp3" },
            { texto: "VLI", audio: "vli.mp3" }, { texto: "VLO", audio: "vlo.mp3" },
            { texto: "VLU", audio: "vlu.mp3" }, { texto: "VLÃO", audio: "vlao.mp3" }
        ] },
        { nome: "🪸 VRA - VRE - VRI - VRO - VRU - VRÃO", silabas: [
            { texto: "VRA", audio: "vra.mp3" }, { texto: "VRE", audio: "vre.mp3" },
            { texto: "VRI", audio: "vri.mp3" }, { texto: "VRO", audio: "vro.mp3" },
            { texto: "VRU", audio: "vru.mp3" }, { texto: "VRÃO", audio: "vrao.mp3" }
        ] }
    ];

    // Criaturas marinhas (mais de 30)
    const criaturas = [
        "🐟","🐠","🐡","🐋","🦈","🐙","🐬","🐳","🦀","🦑",
        "🐚","🦭","🪼","🐢","🐠","🐟","🦞","🪸","🧜‍♀️","🧜‍♂️"
    ];

    let audioEnabled = false;
    let currentAudio = null;
    let jogoAtivo = true;
    let aguardandoProxima = false;
    let faseAtual = 0;
    let pontuacaoTotal = 0;
    let acertosNaEtapa = 0;
    let silabasAtuais = [];      // array de {texto, audio}
    let indiceSilabaAtual = 0;
    let categoriaCorrente = null;
    let criaturasNaTela = window.innerWidth < 768 ? 3 : (window.innerWidth < 1024 ? 4 : 5);
    
    let temposEtapas = [];
    let tempoInicioEtapa = null;
    let intervaloRelogio = null;
    
    const bgAudio = document.getElementById("bg-audio");
    const sfxPescado = document.getElementById("sfx-pescado");
    const sfxErro = document.getElementById("sfx-erro");
    const btnAudio = document.getElementById("btn-audio");
    const aquario = document.getElementById("aquario");
    const modalVitoria = document.getElementById("modal-vitoria");
    const modalNavegacao = document.getElementById("modal-navegacao");

    // ========== FUNÇÕES DE ÁUDIO (MP3) ==========
    function tocarAudioMP3(arquivo, callback) {
        if (!arquivo) return;
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.currentTime = 0;
        }
        const audio = new Audio(arquivo);
        currentAudio = audio;
        audio.play().catch(e => console.log("Erro ao tocar áudio:", arquivo, e));
        audio.onended = () => {
            currentAudio = null;
            if (callback) callback();
        };
        audio.onerror = () => {
            currentAudio = null;
            if (callback) callback();
        };
    }

    function tocarSilaba(silabaObj, callback) {
        if (silabaObj && silabaObj.audio) {
            tocarAudioMP3(silabaObj.audio, callback);
        } else {
            console.warn("Áudio não encontrado para", silabaObj);
            if (callback) callback();
        }
    }

    function repetirSilabaAlvo() {
        const el = document.getElementById("silabaAlvo");
        const silabaTexto = el.innerText;
        if (!silabaTexto || silabaTexto === "---") return;
        const silabaObj = silabasAtuais.find(s => s.texto === silabaTexto);
        if (silabaObj) {
            el.classList.add("pulsando");
            setTimeout(() => el.classList.remove("pulsando"), 300);
            tocarSilaba(silabaObj);
        }
    }

    // ========== CRONÔMETRO ==========
    function formatarTempo(seg) {
        const m = Math.floor(seg / 60);
        const s = seg % 60;
        return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    }
    function iniciarCronometro() {
        if (intervaloRelogio) clearInterval(intervaloRelogio);
        tempoInicioEtapa = Date.now();
        document.getElementById("timerDisplay").innerText = "00:00";
        intervaloRelogio = setInterval(() => {
            if (tempoInicioEtapa && jogoAtivo && !aguardandoProxima) {
                const seg = Math.floor((Date.now() - tempoInicioEtapa) / 1000);
                document.getElementById("timerDisplay").innerText = formatarTempo(seg);
            }
        }, 1000);
    }
    function pararCronometro() {
        if (intervaloRelogio) clearInterval(intervaloRelogio);
        if (tempoInicioEtapa) return Math.floor((Date.now() - tempoInicioEtapa) / 1000);
        return 0;
    }

    // ========== EFEITOS VISUAIS ==========
    function criarOndaChoque(x, y) {
        const wave = document.createElement("div");
        wave.className = "shockwave";
        wave.style.left = (x - 15) + "px";
        wave.style.top = (y - 15) + "px";
        document.body.appendChild(wave);
        setTimeout(() => wave.remove(), 500);
    }
    function criarTesouro(x, y) {
        const treasures = ["💎","👑","💰","🗿","⚓","🔱","🐚","⭐","🏆","✨"];
        const t = treasures[Math.floor(Math.random() * treasures.length)];
        const elem = document.createElement("div");
        elem.className = "treasure-effect";
        elem.innerText = t;
        elem.style.left = (x - 25) + "px";
        elem.style.top = (y - 25) + "px";
        document.body.appendChild(elem);
        setTimeout(() => elem.remove(), 800);
    }
    function criarEfeitoBolhas(qtd = 30) {
        for(let i=0; i<qtd; i++) {
            setTimeout(() => {
                const b = document.createElement("div");
                b.className = "bolha";
                const tam = Math.random() * 25 + 10 + "px";
                b.style.width = tam; b.style.height = tam;
                b.style.left = Math.random() * 100 + "vw";
                b.style.animationDuration = Math.random() * 3 + 2.5 + "s";
                document.body.appendChild(b);
                setTimeout(() => b.remove(), 5500);
            }, i * 50);
        }
    }
    function mostrarFeedback(texto, isAcerto, x, y) {
        const div = document.createElement("div");
        div.className = "feedback-correto";
        div.style.background = isAcerto ? "#2e7d32ee" : "#c62828ee";
        div.style.border = isAcerto ? "2px solid #ffd700" : "2px solid #ff6f00";
        div.innerText = isAcerto ? `🎣✨ +15 ⭐ ${texto} ✨` : `❌ ${texto}`;
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 850);
        if(isAcerto && x) {
            criarTesouro(x, y);
            criarOndaChoque(x, y);
        }
    }

    // ========== LÓGICA DO JOGO ==========
    function atualizarUI() {
        document.getElementById("faseText").innerHTML = faseAtual + 1;
        document.getElementById("totalFases").innerHTML = categorias.length;
        document.getElementById("pontosText").innerHTML = pontuacaoTotal;
        document.getElementById("acertosFase").innerHTML = acertosNaEtapa;
        document.getElementById("totalEtapa").innerHTML = silabasAtuais.length;
        document.getElementById("categoriaAtual").innerHTML = categoriaCorrente.nome;
        document.getElementById("progressHint").innerHTML = `🏆 ${categoriaCorrente.nome.substring(0,22)} | ${acertosNaEtapa}/${silabasAtuais.length}`;
    }

    function carregarProximaSilaba() {
        if (indiceSilabaAtual >= silabasAtuais.length) { concluirEtapa(); return; }
        const silabaCerta = silabasAtuais[indiceSilabaAtual];
        document.getElementById("silabaAlvo").innerText = silabaCerta.texto;
        atualizarUI();
        aquario.innerHTML = "";
        
        let opcoes = [silabaCerta];
        let outras = silabasAtuais.filter(s => s.texto !== silabaCerta.texto);
        outras.sort(() => 0.5 - Math.random());
        opcoes.push(...outras.slice(0, criaturasNaTela - 1));
        while(opcoes.length < criaturasNaTela) opcoes.push({ texto: "CHA", audio: "cha.mp3" });
        opcoes.sort(() => Math.random() - 0.5);
        opcoes.forEach(sil => criarCriatura(sil, silabaCerta));
        
        setTimeout(() => {
            if (jogoAtivo && !aguardandoProxima) tocarSilaba(silabaCerta);
        }, 500);
    }

    function criarCriatura(silabaObj, alvoObj) {
        const creature = document.createElement("div");
        creature.className = "creature";
        const posTop = Math.random() * 70 + 10;
        creature.style.top = posTop + "%";
        const direita = Math.random() > 0.5;
        const duracao = Math.random() * 5 + 4.5;
        creature.style.animation = direita ? `nadar-direita ${duracao}s linear infinite` : `nadar-esquerda ${duracao}s linear infinite`;
        const emoji = criaturas[Math.floor(Math.random() * criaturas.length)];
        const flip = direita ? 'transform: scaleX(-1);' : '';
        creature.innerHTML = `<span class="creature-icon" style="${flip}">${emoji}</span>
                              <span class="silaba-creature">${silabaObj.texto}</span>`;
        const handleClick = (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (!jogoAtivo || aguardandoProxima) return;
            const rect = creature.getBoundingClientRect();
            if (silabaObj.texto === alvoObj.texto) {
                acertou(creature, silabaObj, rect.left + 30, rect.top + 30);
            } else {
                errou(creature, silabaObj);
            }
        };
        creature.addEventListener('click', handleClick);
        creature.addEventListener('touchstart', handleClick, { passive: false });
        aquario.appendChild(creature);
    }

    function acertou(elem, silabaObj, x, y) {
        if (!jogoAtivo) return;
        jogoAtivo = false;
        if (audioEnabled) {
            sfxPescado.currentTime = 0;
            sfxPescado.play().catch(e=>{});
        }
        const rect = elem.getBoundingClientRect();
        elem.style.animation = "none";
        elem.style.left = rect.left + "px";
        elem.style.top = rect.top + "px";
        elem.classList.add("pescado");
        pontuacaoTotal += 15;
        acertosNaEtapa++;
        atualizarUI();
        mostrarFeedback(silabaObj.texto, true, x, y);
        
        tocarSilaba(silabaObj, () => {
            indiceSilabaAtual++;
            if (indiceSilabaAtual < silabasAtuais.length) {
                jogoAtivo = true;
                carregarProximaSilaba();
            } else {
                concluirEtapa();
            }
        });
    }

    function errou(elem, silabaObj) {
        if (!jogoAtivo) return;
        if (audioEnabled && sfxErro) {
            sfxErro.currentTime = 0;
            sfxErro.play().catch(e=>{});
        }
        mostrarFeedback(silabaObj.texto, false);
        elem.classList.add("erro-anim");
        setTimeout(() => elem.classList.remove("erro-anim"), 400);
        tocarSilaba(silabaObj);
    }

    function iniciarEtapa() {
        if (faseAtual >= categorias.length) { finalizarJogoCompleto(); return; }
        categoriaCorrente = categorias[faseAtual];
        silabasAtuais = [...categoriaCorrente.silabas];
        indiceSilabaAtual = 0;
        acertosNaEtapa = 0;
        atualizarUI();
        jogoAtivo = true;
        aguardandoProxima = false;
        iniciarCronometro();
        carregarProximaSilaba();
    }

    function concluirEtapa() {
        if (aguardandoProxima) return;
        const tempo = pararCronometro();
        temposEtapas[faseAtual] = tempo;
        aguardandoProxima = true;
        jogoAtivo = false;
        aquario.innerHTML = "";
        criarEfeitoBolhas(50);
        
        document.getElementById("vitoria-msg-topo").innerHTML = `✨ ${categoriaCorrente.nome} ✨`;
        document.getElementById("scoreFinalModal").innerHTML = `✅ Acertos: ${acertosNaEtapa}/${silabasAtuais.length} | Pontos: ${pontuacaoTotal}`;
        document.getElementById("tempoEtapa").innerHTML = `⏱️ Tempo: ${formatarTempo(tempo)}`;
        let msg = (faseAtual+1 < categorias.length) ? "🐢 Nova categoria!" : "🏆 DOMINOU AS SÍLABAS COMPLEXAS! 🏆";
        document.getElementById("vitoria-msg-sub").innerHTML = msg;
        modalVitoria.style.display = "flex";
        
        // Não usa voz sintetizada, apenas exibe
        setTimeout(() => {
            modalVitoria.style.display = "none";
            if (faseAtual+1 < categorias.length) {
                faseAtual++;
                iniciarEtapa();
            } else {
                finalizarJogoCompleto();
            }
        }, 2000);
    }

    function finalizarJogoCompleto() {
        jogoAtivo = false;
        aquario.innerHTML = "";
        criarEfeitoBolhas(70);
        let total = temposEtapas.reduce((a,b)=>a+b,0);
        document.getElementById("vitoria-msg-topo").innerHTML = "🏆 MESTRE DAS SÍLABAS COMPLEXAS 🏆";
        document.getElementById("vitoria-msg-sub").innerHTML = "🐢 Todas as categorias concluídas! 🐠";
        document.getElementById("scoreFinalModal").innerHTML = `🌟 Pontuação final: ${pontuacaoTotal} 🌟`;
        document.getElementById("tempoEtapa").innerHTML = `⏱️ Tempo total: ${formatarTempo(total)}`;
        modalVitoria.style.display = "flex";
        setTimeout(() => modalVitoria.style.display = "none", 6000);
    }

    // ========== NAVEGAÇÃO ==========
    function toggleFullscreen() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    }
    function toggleAudio() {
        audioEnabled = !audioEnabled;
        btnAudio.innerText = audioEnabled ? "🔊" : "🔇";
        if (audioEnabled) bgAudio.play().catch(e=>{});
        else bgAudio.pause();
    }
    function voltarMenu() {
        if (aguardandoProxima) return;
        modalNavegacao.style.display = "flex";
    }
    document.getElementById("btnVoltar").addEventListener("click", voltarMenu);
    document.getElementById("btnCancelarVolta").addEventListener("click", () => modalNavegacao.style.display = "none");
    document.getElementById("btnConfirmarVolta").addEventListener("click", () => {
        modalNavegacao.style.display = "none";
        window.location.href = "index_pesca.html";
    });
    document.getElementById("btnRepetirSilaba").addEventListener("click", (e) => {
        if (e.target.id !== "silabaAlvo") repetirSilabaAlvo();
    });
    document.getElementById("silabaAlvo").addEventListener("click", (e) => {
        e.stopPropagation();
        repetirSilabaAlvo();
    });
    document.getElementById("silabaAlvo").addEventListener("touchstart", (e) => {
        e.stopPropagation();
        repetirSilabaAlvo();
    }, { passive: true });

    // ========== INICIALIZAÇÃO ==========
    function criarParticulasLuz() {
        const container = document.getElementById("lightParticles");
        for(let i=0; i<40; i++) {
            setTimeout(() => {
                const p = document.createElement("div");
                p.className = "light-particle";
                p.style.width = Math.random() * 8 + 3 + "px";
                p.style.height = p.style.width;
                p.style.left = Math.random() * 100 + "%";
                p.style.animationDelay = Math.random() * 10 + "s";
                p.style.animationDuration = Math.random() * 6 + 6 + "s";
                container.appendChild(p);
                setTimeout(() => p.remove(), 12000);
            }, i * 300);
        }
    }

    if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
        const cursor = document.createElement('div');
        cursor.className = 'custom-cursor';
        document.body.appendChild(cursor);
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });
        document.addEventListener('mouseleave', () => cursor.style.display = 'none');
        document.addEventListener('mouseenter', () => cursor.style.display = 'block');
    }

    window.addEventListener('resize', () => {
        criaturasNaTela = window.innerWidth < 768 ? 3 : (window.innerWidth < 1024 ? 4 : 5);
    });

    setInterval(() => {
        if (jogoAtivo && !aguardandoProxima && Math.random() > 0.85) {
            const b = document.createElement("div");
            b.className = "bolha";
            const t = Math.random() * 20 + 8;
            b.style.width = t + "px"; b.style.height = t + "px";
            b.style.left = Math.random() * 100 + "%";
            b.style.animationDuration = Math.random() * 3 + 2 + "s";
            document.body.appendChild(b);
            setTimeout(() => b.remove(), 5000);
        }
    }, 1000);

    window.onload = () => {
        criarParticulasLuz();
        faseAtual = 0;
        temposEtapas = new Array(categorias.length).fill(0);
        iniciarEtapa();
    };
</script>
</body>
</html>
