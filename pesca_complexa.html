<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sílabas Complexas - Tesouros do Mar Profundo | EdHumanas</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', 'Comic Neue', 'Comic Sans MS', Tahoma, sans-serif;
            background: #000;
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            touch-action: manipulation;
        }

        .custom-cursor {
            position: fixed;
            width: 45px;
            height: 45px;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.5));
        }
        .custom-cursor::before {
            content: "🔱";
            font-size: 40px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        @media (hover: none) and (pointer: coarse) {
            .custom-cursor { display: none; }
            body { cursor: auto; }
        }

        #bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0.6;
            filter: brightness(0.8) contrast(1.1) saturate(1.2);
            pointer-events: none;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0,20,50,0.7), rgba(0,5,20,0.85));
            z-index: 0;
            pointer-events: none;
        }

        .light-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .light-particle {
            position: absolute;
            background: radial-gradient(circle, rgba(255,255,200,0.6), transparent);
            border-radius: 50%;
            animation: floatLight 8s ease-in-out infinite;
        }
        @keyframes floatLight {
            0% { transform: translateY(100vh) translateX(0) scale(0); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(-20vh) translateX(100px) scale(1.5); opacity: 0; }
        }

        #game-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }

        .top-bar {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
            display: flex;
            gap: 10px;
            pointer-events: auto;
            flex-wrap: wrap;
            max-width: calc(100% - 20px);
        }
        .icon-btn {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ffd54f;
            color: white;
            padding: 8px 12px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 16px;
            backdrop-filter: blur(4px);
            transition: transform 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
            white-space: nowrap;
        }
        .icon-btn:active { transform: scale(0.95); }
        @media (min-width: 768px) {
            .icon-btn { padding: 10px 18px; font-size: 18px; }
            .top-bar { top: 20px; left: 20px; gap: 15px; }
        }

        .game-info-container {
            width: 100%;
            padding-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 20;
            pointer-events: none;
        }

        .game-info {
            display: flex;
            gap: 10px;
            background: rgba(0, 10, 25, 0.85);
            padding: 6px 15px;
            border-radius: 40px;
            border: 2px solid #00acc1;
            font-weight: bold;
            font-size: 11px;
            backdrop-filter: blur(4px);
            flex-wrap: wrap;
            justify-content: center;
        }
        @media (min-width: 768px) {
            .game-info { gap: 20px; padding: 10px 25px; font-size: 18px; }
        }
        .timer {
            background: #000000aa;
            padding: 4px 12px;
            border-radius: 30px;
            font-family: 'Courier New', monospace;
            color: #00ffcc;
        }

        .instrucao {
            font-size: 16px;
            font-weight: 900;
            margin-top: 8px;
            background: rgba(0,0,0,0.75);
            padding: 6px 14px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: baseline;
            gap: 6px;
            cursor: pointer;
            pointer-events: auto;
            border: 1px solid #ffd54f;
        }
        @media (min-width: 768px) {
            .instrucao { font-size: 24px; margin-top: 15px; padding: 8px 20px; gap: 10px; }
        }
        #silabaAlvo {
            color: #ffd54f;
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, #1a2a3a, #0a1a2a);
            padding: 0 15px;
            border-radius: 40px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #ff9800;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.15s ease;
            border: 1px solid #00acc1;
        }
        #silabaAlvo.pulsando {
            transform: scale(1.25);
            text-shadow: 0 0 20px #ffca28;
            border-color: #ffd54f;
        }

        .oceano {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            overflow: visible;
            pointer-events: auto;
        }

        .creature {
            position: absolute;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100px;
            height: 100px;
            pointer-events: auto;
            filter: brightness(1.1) saturate(1.1);
            z-index: 50;
            transition: transform 0.05s;
        }
        .creature:active { transform: scale(0.95); }
        @media (min-width: 768px) { .creature { width: 120px; height: 120px; } }
        .creature-icon {
            font-size: 65px;
            position: absolute;
            filter: drop-shadow(3px 6px 10px rgba(0,0,0,0.5));
            pointer-events: none;
        }
        @media (min-width: 768px) { .creature-icon { font-size: 85px; } }
        .silaba-creature {
            font-size: 18px;
            font-weight: bold;
            color: #FFFDE7;
            background: rgba(0,0,0,0.65);
            padding: 5px 10px;
            border-radius: 30px;
            position: absolute;
            text-shadow: 1px 1px 0 #0a2f5a;
            font-family: monospace;
            white-space: nowrap;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255,215,0,0.5);
            pointer-events: none;
        }
        @media (min-width: 768px) {
            .silaba-creature { font-size: 26px; padding: 6px 14px; }
        }

        .pescado {
            animation: subir-vertical 0.8s cubic-bezier(0.4,0,0.2,1) forwards !important;
            pointer-events: none !important;
            z-index: 300;
            filter: brightness(1.5) !important;
        }
        @keyframes subir-vertical {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-120vh) scale(0.3); opacity: 0; }
        }
        @keyframes nadar-direita {
            0% { left: -120px; }
            100% { left: 100%; }
        }
        @keyframes nadar-esquerda {
            0% { left: 100%; }
            100% { left: -120px; }
        }
        @media (min-width: 768px) {
            @keyframes nadar-direita { 0% { left: -150px; } 100% { left: 100%; } }
            @keyframes nadar-esquerda { 0% { left: 100%; } 100% { left: -150px; } }
        }

        .treasure-effect {
            position: absolute;
            font-size: 40px;
            pointer-events: none;
            z-index: 200;
            animation: treasureFloat 0.8s ease-out forwards;
        }
        @keyframes treasureFloat {
            0% { transform: scale(0.2) translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: scale(1.5) translateY(-100px) rotate(360deg); opacity: 0; }
        }
        .bolha {
            position: absolute;
            bottom: -50px;
            background: radial-gradient(circle, rgba(100,200,255,0.5), rgba(50,100,200,0.2));
            border-radius: 50%;
            pointer-events: none;
            animation: subir-bolha linear forwards;
        }
        @keyframes subir-bolha {
            to { transform: translateY(-120vh) translateX(60px); opacity: 0; }
        }
        .shockwave {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,215,0,0.8), transparent);
            pointer-events: none;
            animation: expandWave 0.5s ease-out forwards;
        }
        @keyframes expandWave {
            0% { transform: scale(0.5); opacity: 0.8; }
            100% { transform: scale(8); opacity: 0; }
        }

        /* Modais */
        #modal-vitoria, #modal-navegacao, #modal-categorias {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,10,25,0.98);
            backdrop-filter: blur(14px);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .vitoria-texto { font-size: 4vh; color: #ffd54f; margin: 15px 0; }
        .icone-vitoria { font-size: 12vh; animation: float 2s infinite; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .score-panel {
            font-size: 16px;
            background: linear-gradient(135deg,#1e2a3a,#0a1520);
            padding: 8px 20px;
            border-radius: 60px;
            border: 1px solid #ffd54f;
        }
        .erro-anim {
            animation: tremer 0.3s ease;
            filter: grayscale(0.5) brightness(0.6);
        }
        @keyframes tremer { 0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-8px); } 75%{ transform:translateX(8px); } }
        .feedback-correto {
            position: fixed;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            background: #2e7d32ee;
            backdrop-filter: blur(8px);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            z-index: 200;
            animation: fadeUp 0.9s ease-out forwards;
            pointer-events: none;
            white-space: nowrap;
            border: 2px solid #ffd54f;
        }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            20% { opacity: 1; transform: translateX(-50%) translateY(0); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-50px); }
        }
        .progresso-categoria {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 6px 12px;
            border-radius: 25px;
            font-size: 10px;
            backdrop-filter: blur(5px);
            color: #ffd54f;
            pointer-events: none;
        }
        @media (min-width: 768px) {
            .progresso-categoria { bottom: 20px; right: 20px; padding: 10px 18px; font-size: 14px; }
        }
        .btn-voltar {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: linear-gradient(135deg, #00acc1, #006064);
            border: none;
            border-radius: 40px;
            padding: 10px 18px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            z-index: 200;
            backdrop-filter: blur(4px);
            pointer-events: auto;
            transition: all 0.3s;
        }
        @media (min-width: 768px) {
            .btn-voltar { bottom: 30px; left: 30px; padding: 14px 28px; font-size: 18px; }
        }
        .btn-voltar:active { transform: scale(0.95); }
        .dica-som {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.5);
            padding: 3px 8px;
            border-radius: 15px;
            font-size: 9px;
            color: #aaa;
            pointer-events: none;
        }
        .nav-buttons { display: flex; gap: 15px; margin-top: 20px; }
        .nav-btn {
            background: linear-gradient(135deg, #00acc1, #006064);
            border: 2px solid #ffd54f;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 40px;
            cursor: pointer;
            color: white;
        }
        .nav-btn.cancelar { background: linear-gradient(135deg, #555, #333); border-color: #888; }
        
        /* Modal categorias */
        .grid-categorias {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            max-height: 60vh;
            overflow-y: auto;
            padding: 15px;
            margin-top: 20px;
            background: rgba(0,0,0,0.6);
            border-radius: 30px;
            width: 90vw;
            max-width: 800px;
        }
        .cat-botao {
            background: linear-gradient(135deg, #1e3c4c, #0a2a38);
            border: 2px solid #ffd966;
            border-radius: 50px;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            color: #ffecb3;
            cursor: pointer;
            transition: 0.2s;
        }
        .cat-botao:active { transform: scale(0.96); background: #2a5f6e; }
        .cat-botao:hover { background: #2a5f6e; transform: scale(1.02); }
        
        /* Fogos canvas */
        #fireworks-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2000;
            display: none;
        }
        .celebration-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(145deg, #0a2f3f, #00131f);
            border: 4px solid #ffd700;
            border-radius: 60px;
            padding: 30px 20px;
            text-align: center;
            z-index: 2100;
            max-width: 90vw;
            width: 500px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 80px rgba(255,215,0,0.5);
            animation: zoomCelebration 0.4s cubic-bezier(0.34,1.2,0.64,1);
            pointer-events: auto;
        }
        @keyframes zoomCelebration {
            from { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        .celebration-modal h2 { font-size: 2rem; color: #ffd966; margin-bottom: 15px; }
        .pontos-final { font-size: 1.5rem; background: #000000aa; padding: 8px 20px; border-radius: 50px; display: inline-block; margin: 15px 0; }
        .botoes-celebrate { display: flex; gap: 20px; justify-content: center; margin-top: 25px; flex-wrap: wrap; }
        .btn-celebrate { background: linear-gradient(135deg, #ffb347, #ff7e05); border: none; padding: 12px 28px; font-size: 1.1rem; font-weight: bold; border-radius: 50px; cursor: pointer; color: white; }
        .btn-celebrate.outras { background: linear-gradient(135deg, #3b8b40, #1e6b2f); }
    </style>
</head>
<body>

<video autoplay loop muted playsinline id="bg-video">
    <source src="fundo-do-mar.mp4" type="video/mp4">
</video>

<div class="light-particles" id="lightParticles"></div>

<audio id="bg-audio" src="som_fundo_do_mar.mp3" loop></audio>
<audio id="sfx-pescado" src="pescado.ogg"></audio>
<audio id="sfx-erro" src="erro.ogg"></audio>
<audio id="sfx-applause" src="palmas.mp3" preload="auto"></audio>
<audio id="sfx-fireworks" src="fogos.mp3" preload="auto"></audio>

<div id="game-wrapper">
    <div class="top-bar">
        <button id="btnMenuPrincipal" class="icon-btn">🏠 Menu</button>
        <button id="btnEscolherCategoria" class="icon-btn">📚 Famílias</button>
        <button id="btn-audio" class="icon-btn">🔇 Som</button>
        <button id="btnFullscreen" class="icon-btn">⛶ Tela</button>
    </div>

    <div class="game-info-container">
        <div class="game-info">
            <div>🏺 Família: <span id="categoriaAtual">-</span></div>
            <div>✨ Pontos: <span id="pontosText">0</span></div>
            <div>🐚 Progresso: <span id="acertosFase">0</span>/<span id="totalEtapa">0</span></div>
            <div class="timer">⏱️ <span id="timerDisplay">00:00</span></div>
        </div>
        <p class="instrucao" id="btnRepetirSilaba">
            🌊 Pesque a sílaba: <span id="silabaAlvo">---</span> 🔊
        </p>
    </div>
    <div class="oceano" id="aquario"></div>
    <div class="progresso-categoria" id="progressHint">🏆 Tesouros do Mar Profundo</div>
    
    <button class="btn-voltar" id="btnVoltar">
        <span>🏝️</span> Voltar ao Menu
    </button>
    <div class="dica-som">💡 Clique na sílaba para ouvir | Escolha qualquer família!</div>
</div>

<!-- Modal de categorias (modo livre) -->
<div id="modal-categorias">
    <div class="icone-vitoria">🐟📚🐠</div>
    <div class="vitoria-texto">Escolha uma família silábica</div>
    <div class="grid-categorias" id="listaCategorias"></div>
    <button class="nav-btn cancelar" id="btnFecharCategorias" style="margin-top:20px;">Fechar</button>
</div>

<div id="modal-vitoria">
    <div class="icone-vitoria">🏆🗿🏆</div>
    <div class="vitoria-texto" id="vitoria-msg-topo">Parabéns!</div>
    <div class="score-panel" id="scoreFinalModal">Pontuação: 0</div>
    <div class="vitoria-texto" id="vitoria-msg-sub">Continue explorando!</div>
</div>

<div id="modal-navegacao">
    <div class="icone-vitoria">🐢➡️🏝️</div>
    <div class="vitoria-texto">Voltar para o menu principal?</div>
    <div class="nav-buttons">
        <button class="nav-btn cancelar" id="btnCancelarVolta">❌ Continuar</button>
        <button class="nav-btn confirmar" id="btnConfirmarVolta">🏝️ Voltar ao Menu</button>
    </div>
</div>

<canvas id="fireworks-canvas"></canvas>

        { nome: "🐡 CLA - CLE - CLI - CLO - CLU - CLÃO", silabas: [{ texto: "CLA", audio: "cla.mp3" },{ texto: "CLE", audio: "cle.mp3" },{ texto: "CLI", audio: "cli.mp3" },{ texto: "CLO", audio: "clo.mp3" },{ texto: "CLU", audio: "clu.mp3" },{ texto: "CLÃO", audio: "clao.mp3" }] },
        { nome: "🐋 CRA - CRE - CRI - CRO - CRU - CRÃO", silabas: [{ texto: "CRA", audio: "cra.mp3" },{ texto: "CRE", audio: "cre.mp3" },{ texto: "CRI", audio: "cri.mp3" },{ texto: "CRO", audio: "cro.mp3" },{ texto: "CRU", audio: "cru.mp3" },{ texto: "CRÃO", audio: "crao.mp3" }] },
        { nome: "🦈 DRA - DRE - DRI - DRO - DRU - DRÃO", silabas: [{ texto: "DRA", audio: "dra.mp3" },{ texto: "DRE", audio: "dre.mp3" },{ texto: "DRI", audio: "dri.mp3" },{ texto: "DRO", audio: "dro.mp3" },{ texto: "DRU", audio: "dru.mp3" },{ texto: "DRÃO", audio: "drao.mp3" }] },
        { nome: "🐬 FLA - FLE - FLI - FLO - FLU - FLÃO", silabas: [{ texto: "FLA", audio: "fla.mp3" },{ texto: "FLE", audio: "fle.mp3" },{ texto: "FLI", audio: "fli.mp3" },{ texto: "FLO", audio: "flo.mp3" },{ texto: "FLU", audio: "flu.mp3" },{ texto: "FLÃO", audio: "flao.mp3" }] },
        { nome: "🐳 FRA - FRE - FRI - FRO - FRU - FRÃO", silabas: [{ texto: "FRA", audio: "fra.mp3" },{ texto: "FRE", audio: "fre.mp3" },{ texto: "FRI", audio: "fri.mp3" },{ texto: "FRO", audio: "fro.mp3" },{ texto: "FRU", audio: "fru.mp3" },{ texto: "FRÃO", audio: "frao.mp3" }] },
        { nome: "🦀 GLA - GLE - GLI - GLO - GLU - GLÃO", silabas: [{ texto: "GLA", audio: "gla.mp3" },{ texto: "GLE", audio: "gle.mp3" },{ texto: "GLI", audio: "gli.mp3" },{ texto: "GLO", audio: "glo.mp3" },{ texto: "GLU", audio: "glu.mp3" },{ texto: "GLÃO", audio: "glao.mp3" }] },
        { nome: "🪼 GRA - GRE - GRI - GRO - GRU - GRÃO", silabas: [{ texto: "GRA", audio: "gra.mp3" },{ texto: "GRE", audio: "gre.mp3" },{ texto: "GRI", audio: "gri.mp3" },{ texto: "GRO", audio: "gro.mp3" },{ texto: "GRU", audio: "gru.mp3" },{ texto: "GRÃO", audio: "grao.mp3" }] },
        { nome: "🐙 LHA - LHE - LHI - LHO - LHU - LHÃO", silabas: [{ texto: "LHA", audio: "lha.mp3" },{ texto: "LHE", audio: "lhe.mp3" },{ texto: "LHI", audio: "lhi.mp3" },{ texto: "LHO", audio: "lho.mp3" },{ texto: "LHU", audio: "lhu.mp3" },{ texto: "LHÃO", audio: "lhao.mp3" }] },
        { nome: "🐡 NHA - NHE - NHI - NHO - NHU - NHÃO", silabas: [{ texto: "NHA", audio: "nha.mp3" },{ texto: "NHE", audio: "nhe.mp3" },{ texto: "NHI", audio: "nhi.mp3" },{ texto: "NHO", audio: "nho.mp3" },{ texto: "NHU", audio: "nhu.mp3" },{ texto: "NHÃO", audio: "nhao.mp3" }] },
        { nome: "🦑 PLA - PLE - PLI - PLO - PLU - PLÃO", silabas: [{ texto: "PLA", audio: "pla.mp3" },{ texto: "PLE", audio: "ple.mp3" },{ texto: "PLI", audio: "pli.mp3" },{ texto: "PLO", audio: "plo.mp3" },{ texto: "PLU", audio: "plu.mp3" },{ texto: "PLÃO", audio: "plao.mp3" }] },
        { nome: "🐠 PRA - PRE - PRI - PRO - PRU - PRÃO", silabas: [{ texto: "PRA", audio: "pra.mp3" },{ texto: "PRE", audio: "pre.mp3" },{ texto: "PRI", audio: "pri.mp3" },{ texto: "PRO", audio: "pro.mp3" },{ texto: "PRU", audio: "pru.mp3" },{ texto: "PRÃO", audio: "prao.mp3" }] },
        { nome: "🐋 TLA - TLE - TLI - TLO - TLU - TLÃO", silabas: [{ texto: "TLA", audio: "tla.mp3" },{ texto: "TLE", audio: "tle.mp3" },{ texto: "TLI", audio: "tli.mp3" },{ texto: "TLO", audio: "tlo.mp3" },{ texto: "TLU", audio: "tlu.mp3" },{ texto: "TLÃO", audio: "tlao.mp3" }] },
        { nome: "🐢 TRA - TRE - TRI - TRO - TRU - TRÃO", silabas: [{ texto: "TRA", audio: "tra.mp3" },{ texto: "TRE", audio: "tre.mp3" },{ texto: "TRI", audio: "tri.mp3" },{ texto: "TRO", audio: "tro.mp3" },{ texto: "TRU", audio: "tru.mp3" },{ texto: "TRÃO", audio: "trao.mp3" }] },
        { nome: "🐚 VLA - VLE - VLI - VLO - VLU - VLÃO", silabas: [{ texto: "VLA", audio: "vla.mp3" },{ texto: "VLE", audio: "vle.mp3" },{ texto: "VLI", audio: "vli.mp3" },{ texto: "VLO", audio: "vlo.mp3" },{ texto: "VLU", audio: "vlu.mp3" },{ texto: "VLÃO", audio: "vlao.mp3" }] },
        { nome: "🪸 VRA - VRE - VRI - VRO - VRU - VRÃO", silabas: [{ texto: "VRA", audio: "vra.mp3" },{ texto: "VRE", audio: "vre.mp3" },{ texto: "VRI", audio: "vri.mp3" },{ texto: "VRO", audio: "vro.mp3" },{ texto: "VRU", audio: "vru.mp3" },{ texto: "VRÃO", audio: "vrao.mp3" }] }
    ];

    const criaturas = ["🐟","🐠","🐡","🐋","🦈","🐙","🐬","🐳","🦀","🦑","🐚","🦭","🪼","🐢","🦞","🪸","🧜‍♀️","🧜‍♂️"];
    let audioEnabled = false, currentAudio = null, jogoAtivo = true, aguardandoProxima = false;
    let faseAtual = 0, pontuacaoTotal = 0, acertosNaEtapa = 0, silabasAtuais = [], indiceSilabaAtual = 0;
    let categoriaCorrente = null, tempoInicioEtapa = null, intervaloRelogio = null;
    let criaturasNaTela = window.innerWidth < 768 ? 3 : (window.innerWidth < 1024 ? 4 : 5);
    
    // Elementos
    const bgAudio = document.getElementById("bg-audio"), sfxPescado = document.getElementById("sfx-pescado"), sfxErro = document.getElementById("sfx-erro");
    const aquario = document.getElementById("aquario"), modalVitoria = document.getElementById("modal-vitoria"), modalNavegacao = document.getElementById("modal-navegacao");
    const modalCategorias = document.getElementById("modal-categorias"), btnEscolherCategoria = document.getElementById("btnEscolherCategoria");
    const fireworksCanvas = document.getElementById("fireworks-canvas");

    // Funções auxiliares
    function tocarAudioMP3(arquivo, callback) { if (!arquivo) return; if(currentAudio) currentAudio.pause(); const a = new Audio(arquivo); currentAudio = a; a.play().catch(e=>console.log); a.onended = ()=>{ currentAudio=null; if(callback)callback(); }; }
    function tocarSilaba(silabaObj, callback) { if(silabaObj?.audio) tocarAudioMP3(silabaObj.audio, callback); else if(callback) callback(); }
    function repetirSilabaAlvo() { const t=document.getElementById("silabaAlvo").innerText; const s=silabasAtuais.find(x=>x.texto===t); if(s){ document.getElementById("silabaAlvo").classList.add("pulsando"); setTimeout(()=>document.getElementById("silabaAlvo").classList.remove("pulsando"),300); tocarSilaba(s); } }
    function formatarTempo(seg) { return `${Math.floor(seg/60).toString().padStart(2,'0')}:${(seg%60).toString().padStart(2,'0')}`; }
    function iniciarCronometro() { if(intervaloRelogio) clearInterval(intervaloRelogio); tempoInicioEtapa=Date.now(); intervaloRelogio=setInterval(()=>{ if(tempoInicioEtapa&&jogoAtivo&&!aguardandoProxima) document.getElementById("timerDisplay").innerText=formatarTempo(Math.floor((Date.now()-tempoInicioEtapa)/1000)); },1000); }
    function pararCronometro() { if(intervaloRelogio) clearInterval(intervaloRelogio); return tempoInicioEtapa?Math.floor((Date.now()-tempoInicioEtapa)/1000):0; }
    function criarTesouro(x,y){ const t=["💎","👑","💰","🗿","⚓","🔱","🐚","⭐","🏆","✨"][Math.floor(Math.random()*10)]; const e=document.createElement("div"); e.className="treasure-effect"; e.innerText=t; e.style.left=(x-25)+"px"; e.style.top=(y-25)+"px"; document.body.appendChild(e); setTimeout(()=>e.remove(),800); }
    function criarOndaChoque(x,y){ const w=document.createElement("div"); w.className="shockwave"; w.style.left=(x-15)+"px"; w.style.top=(y-15)+"px"; document.body.appendChild(w); setTimeout(()=>w.remove(),500); }
    function mostrarFeedback(texto, acerto, x, y){ const d=document.createElement("div"); d.className="feedback-correto"; d.style.background=acerto?"#2e7d32ee":"#c62828ee"; d.innerText=acerto?`🎣✨ +15 ⭐ ${texto} ✨`:`❌ ${texto}`; document.body.appendChild(d); setTimeout(()=>d.remove(),850); if(acerto&&x){ criarTesouro(x,y); criarOndaChoque(x,y); } }
    
    function atualizarUI(){ document.getElementById("categoriaAtual").innerHTML=categoriaCorrente?.nome||"-"; document.getElementById("pontosText").innerHTML=pontuacaoTotal; document.getElementById("acertosFase").innerHTML=acertosNaEtapa; document.getElementById("totalEtapa").innerHTML=silabasAtuais.length; document.getElementById("progressHint").innerHTML=`🏆 ${categoriaCorrente?.nome?.substring(0,22)} | ${acertosNaEtapa}/${silabasAtuais.length}`; }
    
    function carregarProximaSilaba(){ if(indiceSilabaAtual>=silabasAtuais.length){ concluirEtapa(); return; } const certa=silabasAtuais[indiceSilabaAtual]; document.getElementById("silabaAlvo").innerText=certa.texto; atualizarUI(); aquario.innerHTML=""; let opcoes=[certa]; let outras=silabasAtuais.filter(s=>s.texto!==certa.texto); outras.sort(()=>0.5-Math.random()); opcoes.push(...outras.slice(0,criaturasNaTela-1)); while(opcoes.length<criaturasNaTela) opcoes.push({texto:"CHA",audio:"cha.mp3"}); opcoes.sort(()=>Math.random()-0.5); opcoes.forEach(sil=>criarCriatura(sil,certa)); setTimeout(()=>{ if(jogoAtivo&&!aguardandoProxima) tocarSilaba(certa); },500); }
    
    function criarCriatura(silaba, alvo){ const c=document.createElement("div"); c.className="creature"; c.style.top=Math.random()*70+10+"%"; const dir=Math.random()>0.5; const dur=Math.random()*5+4.5; c.style.animation=dir?`nadar-direita ${dur}s linear infinite`:`nadar-esquerda ${dur}s linear infinite`; const emoji=criaturas[Math.floor(Math.random()*criaturas.length)]; const flip=dir?'transform: scaleX(-1);':''; c.innerHTML=`<span class="creature-icon" style="${flip}">${emoji}</span><span class="silaba-creature">${silaba.texto}</span>`; c.onclick=(e)=>{ e.preventDefault(); if(!jogoAtivo||aguardandoProxima) return; const rect=c.getBoundingClientRect(); if(silaba.texto===alvo.texto) acertou(c,silaba,rect.left+30,rect.top+30); else errou(c,silaba); }; aquario.appendChild(c); }
    
    function acertou(elem, silabaObj, x, y){ if(!jogoAtivo) return; jogoAtivo=false; if(audioEnabled) sfxPescado.play().catch(e=>{}); const rect=elem.getBoundingClientRect(); elem.style.animation="none"; elem.style.left=rect.left+"px"; elem.style.top=rect.top+"px"; elem.classList.add("pescado"); pontuacaoTotal+=15; acertosNaEtapa++; atualizarUI(); mostrarFeedback(silabaObj.texto,true,x,y); tocarSilaba(silabaObj,()=>{ indiceSilabaAtual++; if(indiceSilabaAtual<silabasAtuais.length){ jogoAtivo=true; carregarProximaSilaba(); } else concluirEtapa(); }); }
    
    function errou(elem, silabaObj){ if(!jogoAtivo) return; if(audioEnabled) sfxErro.play().catch(e=>{}); mostrarFeedback(silabaObj.texto,false); elem.classList.add("erro-anim"); setTimeout(()=>elem.classList.remove("erro-anim"),400); tocarSilaba(silabaObj); }
    
    function resetarJogoParaCategoria(indice){ if(intervaloRelogio) clearInterval(intervaloRelogio); jogoAtivo=false; aguardandoProxima=false; pontuacaoTotal=0; faseAtual=indice; categoriaCorrente=categorias[indice]; silabasAtuais=[...categoriaCorrente.silabas]; indiceSilabaAtual=0; acertosNaEtapa=0; atualizarUI(); aquario.innerHTML=""; jogoAtivo=true; iniciarCronometro(); carregarProximaSilaba(); }
    
    function concluirEtapa(){ if(aguardandoProxima) return; pararCronometro(); aguardandoProxima=true; jogoAtivo=false; aquario.innerHTML=""; modalVitoria.style.display="flex"; document.getElementById("vitoria-msg-topo").innerHTML=`✨ ${categoriaCorrente.nome} ✨`; document.getElementById("scoreFinalModal").innerHTML=`✅ Acertos: ${acertosNaEtapa}/${silabasAtuais.length} | Pontos: ${pontuacaoTotal}`; document.getElementById("vitoria-msg-sub").innerHTML="🎉 Parabéns! Escolha outra família no botão Famílias 📚"; setTimeout(()=>{ modalVitoria.style.display="none"; aguardandoProxima=false; },2000); }
    
    // ========== SELEÇÃO DE CATEGORIAS ==========
    function abrirSeletorCategorias(){ modalCategorias.style.display="flex"; }
    function fecharSeletor(){ modalCategorias.style.display="none"; }
    function preencherGridCategorias(){ const grid=document.getElementById("listaCategorias"); grid.innerHTML=""; categorias.forEach((cat,idx)=>{ const btn=document.createElement("button"); btn.className="cat-botao"; btn.innerText=cat.nome; btn.onclick=()=>{ resetarJogoParaCategoria(idx); fecharSeletor(); }; grid.appendChild(btn); }); }
    
    // ========== NAVEGAÇÃO ==========
    function toggleFullscreen(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
    function toggleAudio(){ audioEnabled=!audioEnabled; document.getElementById("btn-audio").innerHTML=audioEnabled?"🔊 Som Ligado":"🔇 Som Desligado"; if(audioEnabled) bgAudio.play().catch(e=>{}); else bgAudio.pause(); }
    function voltarMenu(){ modalNavegacao.style.display="flex"; }
    
    document.getElementById("btnVoltar")?.addEventListener("click",voltarMenu);
    document.getElementById("btnCancelarVolta")?.addEventListener("click",()=>modalNavegacao.style.display="none");
    document.getElementById("btnConfirmarVolta")?.addEventListener("click",()=>{ modalNavegacao.style.display="none"; window.location.href="index_pesca.html"; });
    document.getElementById("btnRepetirSilaba")?.addEventListener("click",()=>repetirSilabaAlvo());
    document.getElementById("silabaAlvo")?.addEventListener("click",(e)=>{ e.stopPropagation(); repetirSilabaAlvo(); });
    btnEscolherCategoria?.addEventListener("click",abrirSeletorCategorias);
    document.getElementById("btnFecharCategorias")?.addEventListener("click",fecharSeletor);
    document.getElementById("btnMenuPrincipal")?.addEventListener("click",()=>{ window.location.href="index_pesca.html"; });
    document.getElementById("btnFullscreen")?.addEventListener("click",toggleFullscreen);
    
    function criarParticulasLuz(){ const c=document.getElementById("lightParticles"); for(let i=0;i<40;i++){ setTimeout(()=>{ const p=document.createElement("div"); p.className="light-particle"; p.style.width=Math.random()*8+3+"px"; p.style.height=p.style.width; p.style.left=Math.random()*100+"%"; p.style.animationDelay=Math.random()*10+"s"; p.style.animationDuration=Math.random()*6+6+"s"; c.appendChild(p); setTimeout(()=>p.remove(),12000); }, i*300); } }
    
    window.addEventListener('resize',()=>{ criaturasNaTela=window.innerWidth<768?3:(window.innerWidth<1024?4:5); });
    setInterval(()=>{ if(jogoAtivo&&!aguardandoProxima&&Math.random()>0.85){ const b=document.createElement("div"); b.className="bolha"; const t=Math.random()*20+8; b.style.width=t+"px"; b.style.height=t+"px"; b.style.left=Math.random()*100+"%"; b.style.animationDuration=Math.random()*3+2+"s"; document.body.appendChild(b); setTimeout(()=>b.remove(),5000); } },1000);
    
    window.onload=()=>{ criarParticulasLuz(); preencherGridCategorias(); resetarJogoParaCategoria(0); };
</script>
