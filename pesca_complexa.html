<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sílabas Complexas - Tesouros do Mar Profundo | Escolha sua pescaria</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', 'Comic Neue', 'Comic Sans MS', Tahoma, sans-serif;
            background: #000;
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            touch-action: manipulation;
        }

        /* Vídeo e fundo (mesmo original) */
        #bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0.6;
            filter: brightness(0.8) contrast(1.1) saturate(1.2);
            pointer-events: none;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0,20,50,0.7), rgba(0,5,20,0.85));
            z-index: 0;
            pointer-events: none;
        }

        /* Partículas de luz */
        .light-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .light-particle {
            position: absolute;
            background: radial-gradient(circle, rgba(255,255,200,0.6), transparent);
            border-radius: 50%;
            animation: floatLight 8s ease-in-out infinite;
        }
        @keyframes floatLight {
            0% { transform: translateY(100vh) translateX(0) scale(0); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(-20vh) translateX(100px) scale(1.5); opacity: 0; }
        }

        /* ========== TELA DE ÍNDICE (ESCOLHA DE CATEGORIAS) ========== */
        .index-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 300;
            background: rgba(0, 10, 25, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
            pointer-events: auto;
        }
        .index-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .index-header h1 {
            font-size: 2rem;
            text-shadow: 0 0 10px #00acc1;
            color: #ffd966;
        }
        .index-header p {
            font-size: 1rem;
            color: #bbdef5;
        }
        .categorias-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
            padding: 15px;
        }
        .card-categoria {
            background: linear-gradient(145deg, #0a2f4a, #02101f);
            border-radius: 40px;
            padding: 16px 12px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid #00acc1;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
        }
        .card-categoria:hover {
            transform: scale(1.02);
            border-color: #ffd54f;
            box-shadow: 0 0 20px rgba(255,213,79,0.5);
        }
        .card-categoria:active {
            transform: scale(0.98);
        }
        .card-icon {
            font-size: 3rem;
            filter: drop-shadow(2px 4px 6px black);
        }
        .card-nome {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffd966;
            margin: 10px 0 5px;
        }
        .card-desc {
            font-size: 0.8rem;
            color: #aad4ff;
        }
        .btn-voltar-index {
            background: #00acc1aa;
            border: 2px solid #ffd54f;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 1rem;
            margin-top: 20px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            color: white;
            transition: 0.2s;
        }
        .btn-voltar-index:hover {
            background: #ffd54faa;
            color: #02101f;
        }

        /* ========== ESTILOS DO JOGO (mantidos do original) ========== */
        #game-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            pointer-events: none;
            visibility: hidden; /* escondido até escolher categoria */
        }
        .top-bar {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }
        .icon-btn {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #ffd54f;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            backdrop-filter: blur(4px);
            transition: transform 0.2s;
        }
        @media (min-width: 768px) {
            .icon-btn { width: 50px; height: 50px; font-size: 24px; }
            .top-bar { top: 20px; left: 20px; gap: 15px; }
        }
        .game-info-container {
            width: 100%;
            padding-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 20;
            pointer-events: none;
        }
        .game-info {
            display: flex;
            gap: 10px;
            background: rgba(0, 10, 25, 0.85);
            padding: 6px 15px;
            border-radius: 40px;
            border: 2px solid #00acc1;
            font-weight: bold;
            font-size: 11px;
            backdrop-filter: blur(4px);
            flex-wrap: wrap;
            justify-content: center;
        }
        @media (min-width: 768px) {
            .game-info { gap: 20px; padding: 10px 25px; font-size: 18px; }
        }
        .timer {
            background: #000000aa;
            padding: 4px 12px;
            border-radius: 30px;
            font-family: 'Courier New', monospace;
            color: #00ffcc;
        }
        .instrucao {
            font-size: 16px;
            font-weight: 900;
            margin-top: 8px;
            background: rgba(0,0,0,0.75);
            padding: 6px 14px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: baseline;
            gap: 6px;
            cursor: pointer;
            pointer-events: auto;
            border: 1px solid #ffd54f;
        }
        @media (min-width: 768px) {
            .instrucao { font-size: 24px; margin-top: 15px; padding: 8px 20px; gap: 10px; }
        }
        #silabaAlvo {
            color: #ffd54f;
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, #1a2a3a, #0a1a2a);
            padding: 0 15px;
            border-radius: 40px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #ff9800;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.15s ease;
            border: 1px solid #00acc1;
        }
        #silabaAlvo.pulsando {
            transform: scale(1.25);
            text-shadow: 0 0 20px #ffca28;
            border-color: #ffd54f;
        }
        .oceano {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            overflow: visible;
            pointer-events: auto;
        }
        .creature {
            position: absolute;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100px;
            height: 100px;
            pointer-events: auto;
            filter: brightness(1.1) saturate(1.1);
            z-index: 50;
            transition: transform 0.05s;
        }
        .creature:active { transform: scale(0.95); }
        .creature-icon {
            font-size: 65px;
            position: absolute;
            filter: drop-shadow(3px 6px 10px rgba(0,0,0,0.5));
            pointer-events: none;
        }
        @media (min-width: 768px) { .creature-icon { font-size: 85px; } }
        .silaba-creature {
            font-size: 18px;
            font-weight: bold;
            color: #FFFDE7;
            background: rgba(0,0,0,0.65);
            padding: 5px 10px;
            border-radius: 30px;
            position: absolute;
            text-shadow: 1px 1px 0 #0a2f5a;
            font-family: monospace;
            white-space: nowrap;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255,215,0,0.5);
            pointer-events: none;
        }
        .pescado {
            animation: subir-vertical 0.8s cubic-bezier(0.4,0,0.2,1) forwards !important;
            pointer-events: none !important;
            z-index: 300;
            filter: brightness(1.5) !important;
        }
        @keyframes subir-vertical {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-120vh) scale(0.3); opacity: 0; }
        }
        @keyframes nadar-direita {
            0% { left: -120px; }
            100% { left: 100%; }
        }
        @keyframes nadar-esquerda {
            0% { left: 100%; }
            100% { left: -120px; }
        }
        .treasure-effect {
            position: absolute;
            font-size: 40px;
            pointer-events: none;
            z-index: 200;
            animation: treasureFloat 0.8s ease-out forwards;
        }
        @keyframes treasureFloat {
            0% { transform: scale(0.2) translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: scale(1.5) translateY(-100px) rotate(360deg); opacity: 0; }
        }
        .bolha {
            position: absolute;
            bottom: -50px;
            background: radial-gradient(circle, rgba(100,200,255,0.5), rgba(50,100,200,0.2));
            border-radius: 50%;
            pointer-events: none;
            animation: subir-bolha linear forwards;
        }
        @keyframes subir-bolha {
            to { transform: translateY(-120vh) translateX(60px); opacity: 0; }
        }
        .shockwave {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,215,0,0.8), transparent);
            pointer-events: none;
            animation: expandWave 0.5s ease-out forwards;
        }
        @keyframes expandWave {
            0% { transform: scale(0.5); opacity: 0.8; }
            100% { transform: scale(8); opacity: 0; }
        }
        /* Modais */
        #modal-vitoria, #modal-navegacao {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,10,25,0.98);
            backdrop-filter: blur(14px);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .vitoria-texto { font-size: 4vh; color: #ffd54f; margin: 15px 0; }
        .score-panel {
            font-size: 16px;
            background: linear-gradient(135deg,#1e2a3a,#0a1520);
            padding: 8px 20px;
            border-radius: 60px;
            border: 1px solid #ffd54f;
        }
        .feedback-correto {
            position: fixed;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            background: #2e7d32ee;
            backdrop-filter: blur(8px);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            z-index: 200;
            animation: fadeUp 0.9s ease-out forwards;
            pointer-events: none;
            white-space: nowrap;
            border: 2px solid #ffd54f;
        }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            20% { opacity: 1; transform: translateX(-50%) translateY(0); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-50px); }
        }
        .progresso-categoria {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 6px 12px;
            border-radius: 25px;
            font-size: 10px;
            backdrop-filter: blur(5px);
            color: #ffd54f;
            pointer-events: none;
        }
        .btn-voltar {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: linear-gradient(135deg, #00acc1, #006064);
            border: none;
            border-radius: 40px;
            padding: 10px 18px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            z-index: 200;
            backdrop-filter: blur(4px);
            pointer-events: auto;
            transition: all 0.3s;
        }
        .btn-voltar-index-jogo {
            background: #ffaa33;
            color: #02101f;
            border: none;
            margin-right: 10px;
        }
        .nav-buttons { display: flex; gap: 15px; margin-top: 20px; }
        .nav-btn {
            background: linear-gradient(135deg, #00acc1, #006064);
            border: 2px solid #ffd54f;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 40px;
            cursor: pointer;
            color: white;
        }
        /* Fogos e celebração */
        #fireworks-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2000;
            display: none;
        }
        .celebration-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(145deg, #0a2f3f, #00131f);
            border: 4px solid #ffd700;
            border-radius: 60px;
            padding: 30px 20px;
            text-align: center;
            z-index: 2100;
            max-width: 90vw;
            width: 500px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 80px rgba(255,215,0,0.5);
            animation: zoomCelebration 0.4s cubic-bezier(0.34,1.2,0.64,1);
            pointer-events: auto;
        }
        @keyframes zoomCelebration {
            from { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        .btn-celebrate {
            background: linear-gradient(135deg, #ffb347, #ff7e05);
            border: none;
            padding: 12px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            color: white;
            transition: 0.2s;
            margin: 5px;
        }
        .palmas-emoji {
            font-size: 3rem;
            letter-spacing: 8px;
            animation: shake 0.3s infinite;
        }
        @keyframes shake {
            0%,100% { transform: rotate(0deg); }
            25% { transform: rotate(10deg); }
            75% { transform: rotate(-10deg); }
        }
        @keyframes subirPalma {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-120vh) rotate(20deg); opacity: 0; }
        }
    </style>
</head>
<body>

<video autoplay loop muted playsinline id="bg-video">
    <source src="fundo-do-mar.mp4" type="video/mp4">
</video>
<div class="light-particles" id="lightParticles"></div>

<!-- Áudios -->
<audio id="bg-audio" src="som_fundo_do_mar.mp3" loop></audio>
<audio id="sfx-pescado" src="pescado.ogg"></audio>
<audio id="sfx-erro" src="erro.ogg"></audio>
<audio id="sfx-applause" src="aplause.mp3" preload="auto"></audio>
<audio id="sfx-fireworks" src="fogos.mp3" preload="auto"></audio>

<!-- TELA DE ÍNDICE (ESCOLHA DE CATEGORIA) -->
<div id="index-screen" class="index-container">
    <div class="index-header">
        <h1>🐠 Tesouros do Mar Profundo 🐙</h1>
        <p>Escolha uma família silábica para começar a pescar!</p>
    </div>
    <div class="categorias-grid" id="categorias-grid"></div>
    <button class="btn-voltar-index" onclick="window.location.href='index_pesca.html'">🏝️ Voltar ao Menu Principal</button>
</div>

<!-- Estrutura do jogo (inicialmente invisível) -->
<div id="game-wrapper">
    <div class="top-bar">
        <button class="icon-btn" id="btnVoltarIndexGame">🏠 Índice</button>
        <button id="btn-audio" class="icon-btn" onclick="toggleAudio()">🔇</button>
        <button class="icon-btn" onclick="toggleFullscreen()">⛶</button>
    </div>
    <div class="game-info-container">
        <div class="game-info">
            <div>🏺 Família: <span id="categoriaAtual">-</span></div>
            <div>✨ Pontos: <span id="pontosText">0</span></div>
            <div>🐚 Progresso: <span id="acertosFase">0</span>/<span id="totalEtapa">0</span></div>
            <div class="timer">⏱️ <span id="timerDisplay">00:00</span></div>
        </div>
        <p class="instrucao" id="btnRepetirSilaba">
            🌊 Pesque a sílaba: <span id="silabaAlvo">---</span> 🔊
        </p>
    </div>
    <div class="oceano" id="aquario"></div>
    <div class="progresso-categoria" id="progressHint">🏆 Tesouros do Mar</div>
    <button class="btn-voltar" id="btnVoltarJogo">
        <span>🏝️</span> Voltar ao Menu
    </button>
</div>

<!-- Modais -->
<div id="modal-vitoria">
    <div class="icone-vitoria">🏆🗿🏆</div>
    <div class="vitoria-texto" id="vitoria-msg-topo">Parabéns!</div>
    <div class="score-panel" id="scoreFinalModal">Pontuação: 0</div>
    <div class="tempo-record" id="tempoEtapa"></div>
    <div class="vitoria-texto" id="vitoria-msg-sub" style="font-size: 2.5vh;">Você completou a família!</div>
</div>
<div id="modal-navegacao">
    <div class="icone-vitoria">🐢➡️🏝️</div>
    <div class="vitoria-texto">Voltar para o índice de famílias?</div>
    <div class="nav-buttons">
        <button class="nav-btn cancelar" id="btnCancelarVolta">❌ Continuar Jogando</button>
        <button class="nav-btn confirmar" id="btnConfirmarVolta">🏠 Escolher outra família</button>
    </div>
</div>
<canvas id="fireworks-canvas"></canvas>

<script>
    // ========== CATEGORIAS (mesmas do original) ==========

        { nome: "🌊 AL - EL - IL - OL - UL", silabas: [{ texto: "AL", audio: "al.mp3" }, { texto: "EL", audio: "el.mp3" },{ texto: "IL", audio: "il.mp3" },{ texto: "OL", audio: "ol.mp3" },{ texto: "UL", audio: "ul.mp3" }] },

        { nome: "🐡 CLA - CLE - CLI - CLO - CLU - CLÃO", silabas: [{ texto: "CLA", audio: "cla.mp3" },{ texto: "CLE", audio: "cle.mp3" },{ texto: "CLI", audio: "cli.mp3" },{ texto: "CLO", audio: "clo.mp3" },{ texto: "CLU", audio: "clu.mp3" },{ texto: "CLÃO", audio: "clao.mp3" }] },

        { nome: "🐳 FRA - FRE - FRI - FRO - FRU - FRÃO", silabas: [{ texto: "FRA", audio: "fra.mp3" },{ texto: "FRE", audio: "fre.mp3" },{ texto: "FRI", audio: "fri.mp3" },{ texto: "FRO", audio: "fro.mp3" },{ texto: "FRU", audio: "fru.mp3" },{ texto: "FRÃO", audio: "frao.mp3" }] },

        { nome: "🪼 GRA - GRE - GRI - GRO - GRU - GRÃO", silabas: [{ texto: "GRA", audio: "gra.mp3" },{ texto: "GRE", audio: "gre.mp3" },{ texto: "GRI", audio: "gri.mp3" },{ texto: "GRO", audio: "gro.mp3" },{ texto: "GRU", audio: "gru.mp3" },{ texto: "GRÃO", audio: "grao.mp3" }] },

        { nome: "🐡 NHA - NHE - NHI - NHO - NHU - NHÃO", silabas: [{ texto: "NHA", audio: "nha.mp3" },{ texto: "NHE", audio: "nhe.mp3" },{ texto: "NHI", audio: "nhi.mp3" },{ texto: "NHO", audio: "nho.mp3" },{ texto: "NHU", audio: "nhu.mp3" },{ texto: "NHÃO", audio: "nhao.mp3" }] },

        { nome: "🐠 PRA - PRE - PRI - PRO - PRU - PRÃO", silabas: [{ texto: "PRA", audio: "pra.mp3" },{ texto: "PRE", audio: "pre.mp3" },{ texto: "PRI", audio: "pri.mp3" },{ texto: "PRO", audio: "pro.mp3" },{ texto: "PRU", audio: "pru.mp3" },{ texto: "PRÃO", audio: "prao.mp3" }] },
        { nome: "🐋 TLA - TLE - TLI - TLO - TLU - TLÃO", silabas: [{ texto: "TLA", audio: "tla.mp3" },{ texto: "TLE", audio: "tle.mp3" },{ texto: "TLI", audio: "tli.mp3" },{ texto: "TLO", audio: "tlo.mp3" },{ texto: "TLU", audio: "tlu.mp3" },{ texto: "TLÃO", audio: "tlao.mp3" }] },
        { nome: "🐢 TRA - TRE - TRI - TRO - TRU - TRÃO", silabas: [{ texto: "TRA", audio: "tra.mp3" },{ texto: "TRE", audio: "tre.mp3" },{ texto: "TRI", audio: "tri.mp3" },{ texto: "TRO", audio: "tro.mp3" },{ texto: "TRU", audio: "tru.mp3" },{ texto: "TRÃO", audio: "trao.mp3" }] },
        { nome: "🐚 VLA - VLE - VLI - VLO - VLU - VLÃO", silabas: [{ texto: "VLA", audio: "vla.mp3" },{ texto: "VLE", audio: "vle.mp3" },{ texto: "VLI", audio: "vli.mp3" },{ texto: "VLO", audio: "vlo.mp3" },{ texto: "VLU", audio: "vlu.mp3" },{ texto: "VLÃO", audio: "vlao.mp3" }] },
        { nome: "🪸 VRA - VRE - VRI - VRO - VRU - VRÃO", silabas: [{ texto: "VRA", audio: "vra.mp3" },{ texto: "VRE", audio: "vre.mp3" },{ texto: "VRI", audio: "vri.mp3" },{ texto: "VRO", audio: "vro.mp3" },{ texto: "VRU", audio: "vru.mp3" },{ texto: "VRÃO", audio: "vrao.mp3" }] }
    ];

    const criaturas = ["🐟","🐠","🐡","🐋","🦈","🐙","🐬","🐳","🦀","🦑","🐚","🦭","🪼","🐢","🦞","🪸","🧜‍♀️","🧜‍♂️"];

    // Variáveis globais do jogo
    let audioEnabled = false;
    let currentAudio = null;
    let jogoAtivo = true;
    let aguardandoProxima = false;
    let pontuacaoTotal = 0;
    let acertosNaEtapa = 0;
    let silabasAtuais = [];
    let indiceSilabaAtual = 0;
    let categoriaCorrente = null;
    let criaturasNaTela = window.innerWidth < 768 ? 3 : (window.innerWidth < 1024 ? 4 : 5);
    let tempoInicioEtapa = null;
    let intervaloRelogio = null;
    
    // Elementos DOM
    const bgAudio = document.getElementById("bg-audio");
    const sfxPescado = document.getElementById("sfx-pescado");
    const sfxErro = document.getElementById("sfx-erro");
    const sfxApplause = document.getElementById("sfx-applause");
    const sfxFireworksAudio = document.getElementById("sfx-fireworks");
    const btnAudio = document.getElementById("btn-audio");
    const aquario = document.getElementById("aquario");
    const modalVitoria = document.getElementById("modal-vitoria");
    const modalNavegacao = document.getElementById("modal-navegacao");
    const fireworksCanvas = document.getElementById("fireworks-canvas");
    const gameWrapper = document.getElementById("game-wrapper");
    const indexScreen = document.getElementById("index-screen");

    // ========== FUNÇÕES AUXILIARES (som, tempo, efeitos) ==========
    function tocarAudioMP3(arquivo, callback) {
        if (!arquivo) return;
        if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
        const audio = new Audio(arquivo);
        currentAudio = audio;
        audio.play().catch(e => console.log("Erro áudio:", arquivo));
        audio.onended = () => { currentAudio = null; if(callback) callback(); };
        audio.onerror = () => { currentAudio = null; if(callback) callback(); };
    }
    function tocarSilaba(silabaObj, callback) { if(silabaObj?.audio) tocarAudioMP3(silabaObj.audio, callback); else if(callback) callback(); }
    function repetirSilabaAlvo() { 
        const el = document.getElementById("silabaAlvo");
        const silabaTexto = el.innerText;
        if (!silabaTexto || silabaTexto === "---") return;
        const silabaObj = silabasAtuais.find(s => s.texto === silabaTexto);
        if (silabaObj) { el.classList.add("pulsando"); setTimeout(() => el.classList.remove("pulsando"), 300); tocarSilaba(silabaObj); }
    }
    function formatarTempo(seg) { const m = Math.floor(seg/60), s = seg%60; return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; }
    function iniciarCronometro() { if(intervaloRelogio) clearInterval(intervaloRelogio); tempoInicioEtapa = Date.now(); document.getElementById("timerDisplay").innerText = "00:00"; intervaloRelogio = setInterval(() => { if(tempoInicioEtapa && jogoAtivo && !aguardandoProxima) { const seg = Math.floor((Date.now()-tempoInicioEtapa)/1000); document.getElementById("timerDisplay").innerText = formatarTempo(seg); } }, 1000); }
    function pararCronometro() { if(intervaloRelogio) clearInterval(intervaloRelogio); if(tempoInicioEtapa) return Math.floor((Date.now()-tempoInicioEtapa)/1000); return 0; }
    function criarTesouro(x,y){ const t=["💎","👑","💰","🗿","⚓","🔱","🐚","⭐","🏆","✨"][Math.floor(Math.random()*10)]; const e=document.createElement("div"); e.className="treasure-effect"; e.innerText=t; e.style.left=(x-25)+"px"; e.style.top=(y-25)+"px"; document.body.appendChild(e); setTimeout(()=>e.remove(),800); }
    function criarOndaChoque(x,y){ const w=document.createElement("div"); w.className="shockwave"; w.style.left=(x-15)+"px"; w.style.top=(y-15)+"px"; document.body.appendChild(w); setTimeout(()=>w.remove(),500); }
    function criarEfeitoBolhas(qtd=30){ for(let i=0;i<qtd;i++){ setTimeout(()=>{ const b=document.createElement("div"); b.className="bolha"; const tam=Math.random()*25+10+"px"; b.style.width=tam; b.style.height=tam; b.style.left=Math.random()*100+"vw"; b.style.animationDuration=Math.random()*3+2.5+"s"; document.body.appendChild(b); setTimeout(()=>b.remove(),5500); }, i*50); } }
    function mostrarFeedback(texto, isAcerto, x, y){ const div=document.createElement("div"); div.className="feedback-correto"; div.style.background=isAcerto?"#2e7d32ee":"#c62828ee"; div.innerText=isAcerto?`🎣✨ +15 ⭐ ${texto} ✨`:`❌ ${texto}`; document.body.appendChild(div); setTimeout(()=>div.remove(),850); if(isAcerto && x){ criarTesouro(x,y); criarOndaChoque(x,y); } }
    function atualizarUI(){ 
        document.getElementById("pontosText").innerHTML=pontuacaoTotal; 
        document.getElementById("acertosFase").innerHTML=acertosNaEtapa; 
        document.getElementById("totalEtapa").innerHTML=silabasAtuais.length; 
        document.getElementById("categoriaAtual").innerHTML=categoriaCorrente.nome; 
        document.getElementById("progressHint").innerHTML=`🏆 ${categoriaCorrente.nome.substring(0,22)} | ${acertosNaEtapa}/${silabasAtuais.length}`; 
    }
    
    // ========== LÓGICA DO JOGO (adaptada para categoria única) ==========
    function carregarProximaSilaba(){ 
        if(indiceSilabaAtual >= silabasAtuais.length){ concluirCategoria(); return; } 
        const silabaCerta = silabasAtuais[indiceSilabaAtual]; 
        document.getElementById("silabaAlvo").innerText = silabaCerta.texto; 
        atualizarUI(); 
        aquario.innerHTML = ""; 
        let opcoes = [silabaCerta]; 
        let outras = silabasAtuais.filter(s=>s.texto !== silabaCerta.texto); 
        outras.sort(()=>0.5-Math.random()); 
        opcoes.push(...outras.slice(0, criaturasNaTela-1)); 
        while(opcoes.length < criaturasNaTela) opcoes.push({texto:"CHA", audio:"cha.mp3"}); 
        opcoes.sort(()=>Math.random()-0.5); 
        opcoes.forEach(sil => criarCriatura(sil, silabaCerta)); 
        setTimeout(()=>{ if(jogoAtivo && !aguardandoProxima) tocarSilaba(silabaCerta); }, 500); 
    }
    
    function criarCriatura(silabaObj, alvoObj){ 
        const creature = document.createElement("div"); 
        creature.className = "creature"; 
        const posTop = Math.random()*70+10; 
        creature.style.top = posTop+"%"; 
        const direita = Math.random()>0.5; 
        const duracao = Math.random()*5+4.5; 
        creature.style.animation = direita ? `nadar-direita ${duracao}s linear infinite` : `nadar-esquerda ${duracao}s linear infinite`; 
        const emoji = criaturas[Math.floor(Math.random()*criaturas.length)]; 
        const flip = direita ? 'transform: scaleX(-1);' : ''; 
        creature.innerHTML = `<span class="creature-icon" style="${flip}">${emoji}</span><span class="silaba-creature">${silabaObj.texto}</span>`; 
        const handleClick = (e) => { 
            e.preventDefault(); 
            if(!jogoAtivo || aguardandoProxima) return; 
            const rect = creature.getBoundingClientRect(); 
            if(silabaObj.texto === alvoObj.texto) acertou(creature, silabaObj, rect.left+30, rect.top+30); 
            else errou(creature, silabaObj); 
        }; 
        creature.addEventListener('click', handleClick); 
        creature.addEventListener('touchstart', handleClick, {passive:false}); 
        aquario.appendChild(creature); 
    }
    
    function acertou(elem, silabaObj, x, y){ 
        if(!jogoAtivo) return; 
        jogoAtivo = false; 
        if(audioEnabled){ sfxPescado.currentTime=0; sfxPescado.play().catch(e=>{}); } 
        const rect = elem.getBoundingClientRect(); 
        elem.style.animation = "none"; 
        elem.style.left = rect.left+"px"; 
        elem.style.top = rect.top+"px"; 
        elem.classList.add("pescado"); 
        pontuacaoTotal += 15; 
        acertosNaEtapa++; 
        atualizarUI(); 
        mostrarFeedback(silabaObj.texto, true, x, y); 
        tocarSilaba(silabaObj, () => { 
            indiceSilabaAtual++; 
            if(indiceSilabaAtual < silabasAtuais.length){ 
                jogoAtivo = true; 
                carregarProximaSilaba(); 
            } else { 
                concluirCategoria(); 
            } 
        }); 
    }
    
    function errou(elem, silabaObj){ 
        if(!jogoAtivo) return; 
        if(audioEnabled && sfxErro){ sfxErro.currentTime=0; sfxErro.play().catch(e=>{}); } 
        mostrarFeedback(silabaObj.texto, false); 
        elem.classList.add("erro-anim"); 
        setTimeout(()=>elem.classList.remove("erro-anim"), 400); 
        tocarSilaba(silabaObj); 
    }
    
    function iniciarJogoComCategoria(categoriaIndex) {
        // Esconde índice e mostra o jogo
        indexScreen.style.display = "none";
        gameWrapper.style.visibility = "visible";
        
        // Reseta estado
        jogoAtivo = true;
        aguardandoProxima = false;
        pontuacaoTotal = 0;
        acertosNaEtapa = 0;
        categoriaCorrente = categorias[categoriaIndex];
        silabasAtuais = [...categoriaCorrente.silabas];
        indiceSilabaAtual = 0;
        
        atualizarUI();
        iniciarCronometro();
        carregarProximaSilaba();
    }
    
    function concluirCategoria() {
        if(aguardandoProxima) return;
        const tempo = pararCronometro();
        aguardandoProxima = true;
        jogoAtivo = false;
        aquario.innerHTML = "";
        criarEfeitoBolhas(50);
        
        // Exibir modal de vitória da categoria
        document.getElementById("vitoria-msg-topo").innerHTML = `✨ ${categoriaCorrente.nome} ✨`;
        document.getElementById("scoreFinalModal").innerHTML = `✅ Acertos: ${acertosNaEtapa}/${silabasAtuais.length} | Pontos: ${pontuacaoTotal}`;
        document.getElementById("tempoEtapa").innerHTML = `⏱️ Tempo: ${formatarTempo(tempo)}`;
        document.getElementById("vitoria-msg-sub").innerHTML = "🐠 Família completada! Deseja pescar outra?";
        modalVitoria.style.display = "flex";
        
        setTimeout(() => {
            modalVitoria.style.display = "none";
            // Oferece voltar ao índice para escolher outra família
            mostrarModalNavegacao();
        }, 2000);
    }
    
    function mostrarModalNavegacao() {
        modalNavegacao.style.display = "flex";
    }
    
    function voltarAoIndice() {
        // Para o jogo e volta para tela de índice
        if(intervaloRelogio) clearInterval(intervaloRelogio);
        jogoAtivo = false;
        aguardandoProxima = false;
        aquario.innerHTML = "";
        gameWrapper.style.visibility = "hidden";
        indexScreen.style.display = "flex";
        modalNavegacao.style.display = "none";
        modalVitoria.style.display = "none";
        // reseta áudio se necessário
        if(currentAudio) { currentAudio.pause(); currentAudio = null; }
    }
    
    // ========== CELEBRAÇÃO (MANTIDA PARA CASO QUEIRA USAR NO FUTURO) ==========
    function criarPalmasVisuais() { /* mantido do original, mas não usado agora */ }
    function iniciarFogosEPalmas() { /* não usado nesta versão para não complicar */ }
    
    // ========== CONFIGURAÇÃO DO ÍNDICE (GRID DE CATEGORIAS) ==========
    function construirIndice() {
        const grid = document.getElementById("categorias-grid");
        grid.innerHTML = "";
        categorias.forEach((cat, idx) => {
            const card = document.createElement("div");
            card.className = "card-categoria";
            const icone = cat.nome.split(" ")[0];
            card.innerHTML = `
                <div class="card-icon">${icone}</div>
                <div class="card-nome">${cat.nome.substring(2)}</div>
                <div class="card-desc">${cat.silabas.length} sílabas</div>
            `;
            card.addEventListener("click", () => iniciarJogoComCategoria(idx));
            grid.appendChild(card);
        });
    }
    
    // ========== NAVEGAÇÃO E CONTROLES ==========
    function toggleFullscreen(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
    function toggleAudio(){ audioEnabled=!audioEnabled; btnAudio.innerText=audioEnabled?"🔊":"🔇"; if(audioEnabled) bgAudio.play().catch(e=>{}); else bgAudio.pause(); }
    
    document.getElementById("btnVoltarIndexGame")?.addEventListener("click", () => {
        if(aguardandoProxima) return;
        mostrarModalNavegacao();
    });
    document.getElementById("btnVoltarJogo")?.addEventListener("click", () => {
        if(aguardandoProxima) return;
        mostrarModalNavegacao();
    });
    document.getElementById("btnCancelarVolta")?.addEventListener("click", () => {
        modalNavegacao.style.display = "none";
        // Se o jogo está ativo ou concluído, permitir continuar (reinicia se concluído)
        if(!jogoAtivo && aguardandoProxima) {
            // reinicia a mesma categoria
            const idx = categorias.findIndex(c => c.nome === categoriaCorrente.nome);
            if(idx !== -1) iniciarJogoComCategoria(idx);
        } else {
            jogoAtivo = true;
            aguardandoProxima = false;
            if(indiceSilabaAtual < silabasAtuais.length) carregarProximaSilaba();
        }
    });
    document.getElementById("btnConfirmarVolta")?.addEventListener("click", () => {
        voltarAoIndice();
    });
    document.getElementById("btnRepetirSilaba")?.addEventListener("click", (e) => { if(e.target.id !== "silabaAlvo") repetirSilabaAlvo(); });
    document.getElementById("silabaAlvo")?.addEventListener("click", (e) => { e.stopPropagation(); repetirSilabaAlvo(); });
    document.getElementById("silabaAlvo")?.addEventListener("touchstart", (e) => { e.stopPropagation(); repetirSilabaAlvo(); }, {passive:true});
    
    // Inicialização: construir índice e esconder jogo
    window.onload = () => {
        construirIndice();
        gameWrapper.style.visibility = "hidden";
        indexScreen.style.display = "flex";
        criarParticulasLuz();
        // Garantir que áudio de fundo só toque se ativado
    };
    
    function criarParticulasLuz(){ 
        const container = document.getElementById("lightParticles"); 
        for(let i=0;i<40;i++){ 
            setTimeout(()=>{ 
                const p = document.createElement("div"); 
                p.className = "light-particle"; 
                p.style.width = Math.random()*8+3+"px"; 
                p.style.height = p.style.width; 
                p.style.left = Math.random()*100+"%"; 
                p.style.animationDelay = Math.random()*10+"s"; 
                p.style.animationDuration = Math.random()*6+6+"s"; 
                container.appendChild(p); 
                setTimeout(()=>p.remove(),12000); 
            }, i*300); 
        } 
    }
    
    // Ajuste responsivo
    window.addEventListener('resize',()=>{ criaturasNaTela = window.innerWidth<768 ? 3 : (window.innerWidth<1024 ? 4 : 5); });
    // Bolhas aleatórias durante o jogo (opcional)
    setInterval(()=>{ if(gameWrapper.style.visibility === "visible" && jogoAtivo && !aguardandoProxima && Math.random()>0.85){ const b=document.createElement("div"); b.className="bolha"; const t=Math.random()*20+8; b.style.width=t+"px"; b.style.height=t+"px"; b.style.left=Math.random()*100+"%"; b.style.animationDuration=Math.random()*3+2+"s"; document.body.appendChild(b); setTimeout(()=>b.remove(),5000); } },1000);
</script>
