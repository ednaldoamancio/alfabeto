<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Famílias Silábicas - Pesca Divertida | EdHumanas</title>
    
    <style>
        :root {
            --primary: #1e88e5;
            --secondary: #ffb74d;
            --text-light: #ffffff;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            user-select: none; 
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', 'Comic Neue', 'Comic Sans MS', Tahoma, sans-serif;
            background: #000;
            color: var(--text-light);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            touch-action: manipulation;
        }

        /* Cursor personalizado para desktop */
        @media (hover: hover) and (pointer: fine) {
            body { cursor: none; }
        }
        .custom-cursor {
            position: fixed;
            width: 40px;
            height: 40px;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: transform 0.05s ease;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.5));
        }
        .custom-cursor::before {
            content: "🎣";
            font-size: 35px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        @media (hover: none) and (pointer: coarse) {
            .custom-cursor { display: none; }
        }

        #bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0.35;
            filter: brightness(0.7) contrast(1.2);
            pointer-events: none;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,10,25,0.6), rgba(0,0,15,0.85));
            z-index: 0;
            pointer-events: none;
        }

        #game-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }

        .top-bar {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
            display: flex;
            gap: 10px;
            pointer-events: auto;
            flex-wrap: wrap;
            max-width: calc(100% - 20px);
        }
        .icon-btn {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--secondary);
            color: white;
            padding: 8px 12px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 16px;
            backdrop-filter: blur(4px);
            transition: transform 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
            white-space: nowrap;
        }
        .icon-btn:active { transform: scale(0.95); }
        @media (min-width: 768px) {
            .icon-btn { padding: 10px 18px; font-size: 18px; }
            .top-bar { top: 20px; left: 20px; gap: 15px; }
        }

        /* Instrução centralizada */
        .instrucao { 
            font-size: 16px;
            font-weight: 900;
            margin-top: 15px;
            background: rgba(0,0,0,0.7);
            padding: 6px 14px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: baseline;
            gap: 6px;
            cursor: pointer;
            pointer-events: auto;
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            z-index: 30;
        }
        @media (min-width: 768px) {
            .instrucao {
                font-size: 24px;
                margin-top: 20px;
                padding: 8px 20px;
                gap: 10px;
                top: 15px;
            }
        }
        @media (min-width: 1024px) {
            .instrucao {
                font-size: 28px;
                padding: 8px 24px;
                gap: 12px;
            }
        }
        #silabaAlvo {
            color: var(--secondary);
            font-size: 28px;
            font-weight: bold;
            background: #000000cc;
            padding: 0 10px;
            border-radius: 30px;
            letter-spacing: 2px;
            text-shadow: 0 0 5px #ff9800;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.15s ease, text-shadow 0.15s ease;
            font-family: inherit;
        }
        #silabaAlvo.pulsando {
            transform: scale(1.25);
            text-shadow: 0 0 18px #ffca28, 0 0 6px #ff9800;
        }

        .oceano {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            overflow: visible;
            pointer-events: auto;
        }

        .peixinho {
            position: absolute;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 90px;
            height: 90px;
            pointer-events: auto;
            transition: filter 0.1s;
            filter: brightness(1.1) saturate(1.2);
            z-index: 50;
            -webkit-tap-highlight-color: transparent;
        }
        .peixinho::after {
            content: "";
            position: absolute;
            top: -15px;
            left: -15px;
            right: -15px;
            bottom: -15px;
            background: transparent;
            border-radius: 50%;
            pointer-events: auto;
        }
        @media (min-width: 768px) {
            .peixinho { width: 110px; height: 110px; }
        }
        .peixe-corpo {
            font-size: 55px;
            position: absolute;
            z-index: 1;
            filter: drop-shadow(3px 5px 8px rgba(0,0,0,0.5));
            pointer-events: none;
        }
        @media (min-width: 768px) { .peixe-corpo { font-size: 80px; } }
        .silaba-peixe {
            font-size: 20px;
            font-weight: bold;
            color: #FFFDE7;
            background: rgba(0,0,0,0.6);
            padding: 4px 8px;
            border-radius: 25px;
            position: absolute;
            z-index: 2;
            text-shadow: 1px 1px 0 #0a2f5a;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            pointer-events: none;
            white-space: nowrap;
        }
        @media (min-width: 768px) { .silaba-peixe { font-size: 28px; padding: 5px 12px; } }

        .pescado {
            animation: subir-vertical 0.7s ease-in forwards !important;
            pointer-events: none !important;
            z-index: 200;
        }
        @keyframes subir-vertical {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100vh) scale(0.5); opacity: 0; }
        }
        @keyframes nadar-direita { 0% { left: -120px; } 100% { left: 100%; } }
        @keyframes nadar-esquerda { 0% { left: 100%; } 100% { left: -120px; } }
        @media (min-width: 768px) {
            @keyframes nadar-direita { 0% { left: -150px; } 100% { left: 100%; } }
            @keyframes nadar-esquerda { 0% { left: 100%; } 100% { left: -150px; } }
        }

        .bolha {
            position: absolute;
            bottom: -50px;
            background: radial-gradient(circle, rgba(180,220,255,0.7), rgba(100,160,255,0.3));
            border-radius: 50%;
            pointer-events: none;
            z-index: 15;
            animation: subir-bolha linear forwards;
        }
        @keyframes subir-bolha { to { transform: translateY(-120vh) translateX(40px); opacity: 0; } }

        /* Modais */
        #modal-vitoria, #modal-navegacao, #modal-categorias, #modal-alfabeto {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,10,25,0.98);
            backdrop-filter: blur(14px);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .vitoria-texto { font-size: 4vh; color: var(--secondary); font-weight: bold; margin: 15px 0; }
        .icone-vitoria { font-size: 10vh; margin-bottom: 15px; animation: float 2s infinite; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-15px); } 100% { transform: translateY(0px); } }
        .score-panel { font-size: 16px; background: #1e2a3a; padding: 8px 20px; border-radius: 40px; margin-top: 15px; border: 1px solid var(--secondary); }
        @media (min-width: 768px) { .score-panel { font-size: 24px; padding: 12px 28px; } }
        .tempo-record { font-size: 14px; margin-top: 10px; color: #ffca28; }

        .erro-anim { animation: tremer 0.4s ease; filter: grayscale(0.5) brightness(0.7); }
        @keyframes tremer { 25% { transform: translateX(-8px) rotate(-2deg); } 75% { transform: translateX(8px) rotate(2deg); } 100% { transform: translateX(0); } }
        .feedback-correto {
            position: fixed;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            background: #2e7d32dd;
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: bold;
            z-index: 200;
            animation: fadeUp 0.8s ease-out forwards;
            pointer-events: none;
            white-space: nowrap;
        }
        @media (min-width: 768px) { .feedback-correto { font-size: 28px; padding: 12px 24px; } }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            20% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-40px); }
        }
        .star-point {
            position: absolute;
            font-size: 30px;
            pointer-events: none;
            z-index: 150;
            animation: estrelaPular 0.6s ease-out forwards;
        }
        @keyframes estrelaPular { 0% { transform: scale(0.2) translateY(0); opacity: 1; } 100% { transform: scale(1.2) translateY(-70px); opacity: 0; } }

        .btn-voltar-alfabeto {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: linear-gradient(135deg, #ab47bc, #7b1fa2);
            border: none;
            border-radius: 40px;
            padding: 10px 18px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            animation: pulse-glow-purple 2s infinite;
            pointer-events: auto;
        }
        @media (min-width: 768px) {
            .btn-voltar-alfabeto { bottom: 30px; left: 30px; padding: 14px 28px; font-size: 18px; gap: 12px; }
        }
        .btn-voltar-alfabeto:active { transform: scale(0.95); }
        @keyframes pulse-glow-purple { 0% { box-shadow: 0 0 0 0 rgba(171, 71, 188, 0.5); } 70% { box-shadow: 0 0 0 10px rgba(171, 71, 188, 0); } 100% { box-shadow: 0 0 0 0 rgba(171, 71, 188, 0); } }

        .grid-opcoes {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            max-height: 60vh;
            overflow-y: auto;
            padding: 20px;
            margin-top: 20px;
            background: rgba(0,0,0,0.6);
            border-radius: 40px;
            width: 90vw;
            max-width: 800px;
        }
        .opcao-botao {
            background: linear-gradient(135deg, #1e3c4c, #0a2a38);
            border: 2px solid #ffd966;
            border-radius: 50px;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffecb3;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .opcao-botao span.letra-exemplo {
            font-size: 2rem;
            font-weight: bold;
            background: #00000066;
            padding: 5px 12px;
            border-radius: 30px;
        }
        .opcao-botao:active { transform: scale(0.96); background: #2a5f6e; }
        .opcao-botao:hover { background: #2a5f6e; transform: scale(1.02); }

        .dica-som {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.6);
            padding: 3px 8px;
            border-radius: 15px;
            font-size: 9px;
            color: #ccc;
            pointer-events: none;
        }
        
        .nav-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .nav-btn {
            background: linear-gradient(135deg, var(--primary), #7b1fa2);
            border: 2px solid var(--secondary);
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            color: white;
            pointer-events: auto;
        }
        @media (min-width: 768px) {
            .nav-btn { padding: 15px 35px; font-size: 24px; }
        }
        .nav-btn.cancelar { background: linear-gradient(135deg, #555, #333); border-color: #888; }
        .nav-btn.confirmar { background: linear-gradient(135deg, #ff8c00, #ff5722); }
        
        .modal-status {
            margin-top: 10px;
            font-size: 1rem;
            color: #ffd966;
        }
    </style>
</head>
<body>

<video autoplay loop muted playsinline id="bg-video">
    <source src="video_mar.mp4" type="video/mp4">
</video>

<audio id="bg-audio" src="som_fundo_do_mar.mp3" loop></audio>
<audio id="sfx-pescado" src="pescado.ogg"></audio>
<audio id="sfx-erro" src="erro.mp3"></audio>

<div id="game-wrapper">
    <div class="top-bar">
        <button id="btnMenuPrincipal" class="icon-btn">🏠 Menu</button>
        <button id="btnEscolherFamilia" class="icon-btn">📚 Famílias</button>
        <button id="btnEscolherAlfabeto" class="icon-btn">🔤 Alfabeto</button>
        <button id="btn-audio" class="icon-btn">🔇 Som</button>
        <button id="btnFullscreen" class="icon-btn">⛶ Tela</button>
    </div>

    <!-- Instrução da sílaba alvo -->
    <p class="instrucao" id="btnRepetirSilaba">
        🐠 Pesque a sílaba: <span id="silabaAlvo">---</span> 🔊
    </p>

    <div class="oceano" id="aquario"></div>
    
    <button class="btn-voltar-alfabeto" id="btnVoltarAlfabeto">
        <span>🔤</span> Voltar ao Alfabeto
    </button>
    <div class="dica-som">💡 Clique na sílaba para ouvi-la | Escolha o formato do alfabeto</div>
</div>

<!-- Modal para escolher a modalidade do alfabeto -->
<div id="modal-alfabeto">
    <div class="icone-vitoria">🔤📖</div>
    <div class="vitoria-texto">Escolha o formato do alfabeto</div>
    <div class="grid-opcoes" id="listaModalidades"></div>
    <div class="modal-status" id="modalidadeAtualStatus">Modalidade atual: ---</div>
    <button class="nav-btn cancelar" id="btnFecharAlfabeto" style="margin-top:20px;">Fechar</button>
</div>

<!-- Modal de categorias (famílias silábicas) -->
<div id="modal-categorias">
    <div class="icone-vitoria">🐟📚🐠</div>
    <div class="vitoria-texto">Escolha uma família silábica</div>
    <div class="grid-opcoes" id="listaCategorias"></div>
    <button class="nav-btn cancelar" id="btnFecharCategorias" style="margin-top:20px;">Fechar</button>
</div>

<div id="modal-vitoria">
    <div class="icone-vitoria">🎣✨</div>
    <div class="vitoria-texto" id="vitoria-msg-topo">Parabéns!</div>
    <div class="score-panel" id="scoreFinalModal">Pontuação: 0</div>
    <div class="tempo-record" id="tempoEtapa"></div>
    <div class="vitoria-texto" id="vitoria-msg-sub" style="font-size: 2.5vh; color: #fff;">Família concluída!</div>
</div>

<div id="modal-navegacao">
    <div class="icone-vitoria">🔤➡️🐟</div>
    <div class="vitoria-texto" style="font-size: 3.5vh;">Voltar para o jogo do alfabeto?</div>
    <div class="nav-buttons">
        <button class="nav-btn cancelar" id="btnCancelarVolta">❌ Ficar nas sílabas</button>
        <button class="nav-btn confirmar" id="btnConfirmarVolta">🔤 Voltar ao alfabeto</button>
    </div>
</div>

    // ========== FAMÍLIAS SILÁBICAS ==========

    // ========== MODALIDADES DO ALFABETO ==========
    // Cada modalidade define uma função que recebe a letra (ex: "B") e retorna o caractere a ser exibido
    const modalidades = {
        "forma_maiuscula": {
            nome: "Letra de Forma MAIÚSCULA",

            transformar: (letra) => letra.toUpperCase()
        },
        "forma_minuscula": {

            fonte: "Arial, sans-serif",
            transformar: (letra) => letra.toLowerCase()
        },
        "cursiva_maiuscula": {
            nome: "Letra Cursiva MAIÚSCULA",
            exemplo: "𝒜",
            fonte: "'Segoe Script', 'Brush Script MT', cursive",
            transformar: (letra) => {
                const mapa = {
                    'A':'𝒜','B':'ℬ','C':'𝒞','D':'𝒟','E':'ℰ','F':'ℱ','G':'𝒢','H':'ℋ','I':'ℐ','J':'𝒥',
                    'K':'𝒦','L':'ℒ','M':'ℳ','N':'𝒩','O':'𝒪','P':'𝒫','Q':'𝒬','R':'ℛ','S':'𝒮','T':'𝒯',
                    'U':'𝒰','V':'𝒱','W':'𝒲','X':'𝒳','Y':'𝒴','Z':'𝒵','Ç':'𝒞̧'
                };
                return mapa[letra.toUpperCase()] || letra.toUpperCase();
            }
        },
        "cursiva_minuscula": {
            nome: "Letra Cursiva minúscula",
            exemplo: "𝒶",
            fonte: "'Segoe Script', 'Brush Script MT', cursive",
            transformar: (letra) => {
                const mapa = {
                    'a':'𝒶','b':'𝒷','c':'𝒸','d':'𝒹','e':'ℯ','f':'𝒻','g':'ℊ','h':'𝒽','i':'𝒾','j':'𝒿',
                    'k':'𝓀','l':'𝓁','m':'𝓂','n':'𝓃','o':'ℴ','p':'𝓅','q':'𝓆','r':'𝓇','s':'𝓈','t':'𝓉',
                    'u':'𝓊','v':'𝓋','w':'𝓌','x':'𝓍','y':'𝓎','z':'𝓏','ç':'𝒸̧'
                };
                const lower = letra.toLowerCase();
                return mapa[lower] || lower;
            }
        }
    };
    
    let modalidadeAtual = "forma_maiuscula"; // padrão
    
    // ========== VARIÁVEIS GLOBAIS ==========
    let audioEnabled = false;
    let currentUtterance = null;
    let jogoAtivo = true;
    let aguardandoProxima = false;
    let pontuacaoTotal = 0;
    let acertosNaEtapa = 0;
    let silabasAtuais = [];
    let indiceSilabaAtual = 0;
    let familiaAtualLetra = "B";
    let peixesNaTela = window.innerWidth < 768 ? 3 : (window.innerWidth < 1024 ? 4 : 5);
    let tempoInicioEtapa = null;
    let intervaloRelogio = null;
    
    // ========== ELEMENTOS DOM ==========
    const bgAudio = document.getElementById("bg-audio");
    const sfxPescado = document.getElementById("sfx-pescado");
    const sfxErro = document.getElementById("sfx-erro");
    const btnAudio = document.getElementById("btn-audio");
    const aquario = document.getElementById("aquario");
    const modalVitoria = document.getElementById("modal-vitoria");
    const modalNavegacao = document.getElementById("modal-navegacao");
    const modalCategorias = document.getElementById("modal-categorias");
    const modalAlfabeto = document.getElementById("modal-alfabeto");
    const btnEscolherFamilia = document.getElementById("btnEscolherFamilia");
    const btnEscolherAlfabeto = document.getElementById("btnEscolherAlfabeto");
    
    // ========== FUNÇÕES DE VOZ ==========
    function falar(texto, callback) {
        if (!window.speechSynthesis) { if (callback) callback(); return; }
        if (currentUtterance) window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'pt-BR';
        utterance.rate = 0.85;
        utterance.pitch = 1.0;
        const voices = window.speechSynthesis.getVoices();
        const ptBrVoice = voices.find(v => v.lang === 'pt-BR' && (v.name.includes('Google') || v.name.includes('Microsoft') || v.name.includes('Maria') || v.name.includes('Natural')));
        if (ptBrVoice) utterance.voice = ptBrVoice;
        currentUtterance = utterance;
        utterance.onend = () => { currentUtterance = null; if (callback) setTimeout(callback, 150); };
        utterance.onerror = () => { currentUtterance = null; if (callback) setTimeout(callback, 150); };
        window.speechSynthesis.speak(utterance);
    }
    
    function falarSilaba(silaba, callback) {
        const pronuncia = pronunciaMap[silaba.toUpperCase()] || silaba.toLowerCase();
        falar(pronuncia, callback);
    }
    
    function falarParabensESilaba(silaba, callback) {
        const pronuncia = pronunciaMap[silaba.toUpperCase()] || silaba.toLowerCase();
        falar(`Muito bem! ${pronuncia}`, callback);
    }
    
    function repetirSilabaAlvo() {
        const el = document.getElementById("silabaAlvo");
        const silaba = el.innerText;
        if (!silaba || silaba === "---") return;
        el.classList.add("pulsando");
        setTimeout(() => el.classList.remove("pulsando"), 300);
        falarSilaba(silaba);
    }
    
    // ========== FUNÇÃO PARA OBTER A LETRA NO FORMATO DA MODALIDADE ==========
    function getLetraFormatada(letra) {
        return modalidades[modalidadeAtual].transformar(letra);
    }
    
    // ========== CRONÔMETRO (não exibido, usado internamente) ==========
    function formatarTempo(seg) { return `${Math.floor(seg/60).toString().padStart(2,'0')}:${(seg%60).toString().padStart(2,'0')}`; }
    function iniciarCronometro() {
        if (intervaloRelogio) clearInterval(intervaloRelogio);
        tempoInicioEtapa = Date.now();
        intervaloRelogio = setInterval(() => {}, 1000);
    }
    function pararCronometro() {
        if (intervaloRelogio) clearInterval(intervaloRelogio);
        return tempoInicioEtapa ? Math.floor((Date.now() - tempoInicioEtapa) / 1000) : 0;
    }
    
    // ========== EFEITOS VISUAIS ==========
    function criarEfeitoBolhas(quantidade = 30) {
        const qtd = window.innerWidth < 768 ? 25 : quantidade;
        for(let i = 0; i < qtd; i++) {
            setTimeout(() => {
                const bolha = document.createElement("div");
                bolha.className = "bolha";
                const tam = Math.random() * (window.innerWidth < 768 ? 30 : 45) + 10 + "px";
                bolha.style.width = tam; bolha.style.height = tam;
                bolha.style.left = Math.random() * 100 + "vw";
                bolha.style.animationDuration = Math.random() * 2.5 + 2 + "s";
                document.body.appendChild(bolha);
                setTimeout(() => bolha.remove(), 4500);
            }, i * 30);
        }
    }
    function mostrarEstrela(x, y) {
        const star = document.createElement("div");
        star.className = "star-point";
        star.innerText = "⭐";
        star.style.left = (x - 20) + "px";
        star.style.top = (y - 20) + "px";
        document.body.appendChild(star);
        setTimeout(() => star.remove(), 700);
    }
    function mostrarFeedback(texto, isAcerto) {
        const div = document.createElement("div");
        div.className = "feedback-correto";
        div.style.background = isAcerto ? "#2e7d32dd" : "#c62828dd";
        div.innerText = texto;
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 850);
    }
    
    // ========== LÓGICA DO JOGO ==========
    function carregarProximaSilaba() {
        if (indiceSilabaAtual >= silabasAtuais.length) { concluirFamilia(); return; }
        const silabaCerta = silabasAtuais[indiceSilabaAtual];
        document.getElementById("silabaAlvo").innerText = silabaCerta;
        aquario.innerHTML = "";
        
        let opcoes = [silabaCerta];
        let outras = silabasAtuais.filter(s => s !== silabaCerta);
        outras.sort(() => 0.5 - Math.random());
        opcoes.push(...outras.slice(0, peixesNaTela - 1));
        while(opcoes.length < peixesNaTela) opcoes.push("ZÃO");
        opcoes.sort(() => Math.random() - 0.5);
        opcoes.forEach(sil => criarPeixe(sil, silabaCerta));
        
        setTimeout(() => {
            if (jogoAtivo && !aguardandoProxima) falarSilaba(silabaCerta);
        }, 600);
    }
    
    function criarPeixe(silaba, alvo) {
        const peixe = document.createElement("div");
        peixe.className = "peixinho";
        peixe.style.top = Math.random() * 70 + 10 + "%";
        const direita = Math.random() > 0.5;
        const duracao = (Math.random() * 6) + 5;
        peixe.style.animation = direita ? `nadar-direita ${duracao}s linear infinite` : `nadar-esquerda ${duracao}s linear infinite`;
        const emoji = emojisPeixe[Math.floor(Math.random() * emojisPeixe.length)];
        const flip = direita ? 'transform: scaleX(-1);' : '';
        peixe.innerHTML = `<span class="peixe-corpo" style="${flip}">${emoji}</span><span class="silaba-peixe">${silaba}</span>`;
        
        const handleClick = (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (!jogoAtivo || aguardandoProxima) return;
            if (silaba === alvo) acertou(peixe, silaba);
            else errou(peixe, silaba);
        };
        peixe.addEventListener('click', handleClick);
        peixe.addEventListener('touchstart', handleClick, { passive: false });
        aquario.appendChild(peixe);
    }
    
    function acertou(elem, silabaClicada) {
        if (!jogoAtivo) return;
        jogoAtivo = false;
        if (audioEnabled) { sfxPescado.currentTime = 0; sfxPescado.play().catch(e=>{}); }
        const rect = elem.getBoundingClientRect();
        elem.style.animation = "none";
        elem.style.left = rect.left + "px";
        elem.style.top = rect.top + "px";
        elem.classList.add("pescado");
        pontuacaoTotal += 10;
        acertosNaEtapa++;
        mostrarEstrela(rect.left + 30, rect.top + 30);
        mostrarFeedback(`✅ +10  ${silabaClicada}`, true);
        
        falarParabensESilaba(silabaClicada, () => {
            indiceSilabaAtual++;
            if (indiceSilabaAtual < silabasAtuais.length) {
                jogoAtivo = true;
                carregarProximaSilaba();
            } else { concluirFamilia(); }
        });
    }
    
    function errou(elem, silabaErrada) {
        if (!jogoAtivo) return;
        if (audioEnabled && sfxErro) { sfxErro.currentTime = 0; sfxErro.play().catch(e=>{}); }
        mostrarFeedback(`❌ ${silabaErrada}`, false);
        elem.classList.add("erro-anim");
        setTimeout(() => elem.classList.remove("erro-anim"), 500);
        falarSilaba(silabaErrada);
    }
    
    function resetarJogoParaFamilia(letra) {
        if (intervaloRelogio) clearInterval(intervaloRelogio);
        jogoAtivo = false;
        aguardandoProxima = false;
        pontuacaoTotal = 0;
        const familia = familiasCompletas.find(f => f.letra === letra);
        if (!familia) return;
        familiaAtualLetra = letra;
        silabasAtuais = [...familia.silabas];
        indiceSilabaAtual = 0;
        acertosNaEtapa = 0;
        aquario.innerHTML = "";
        jogoAtivo = true;
        iniciarCronometro();
        carregarProximaSilaba();
    }
    
    function concluirFamilia() {
        if (aguardandoProxima) return;
        const tempo = pararCronometro();
        aguardandoProxima = true;
        jogoAtivo = false;
        aquario.innerHTML = "";
        criarEfeitoBolhas(40);
        
        document.getElementById("vitoria-msg-topo").innerHTML = `✨ Família ${familiaAtualLetra} ✨`;
        document.getElementById("scoreFinalModal").innerHTML = `✅ Acertos: ${acertosNaEtapa}/${silabasAtuais.length}   |   Pontuação: ${pontuacaoTotal}`;
        document.getElementById("tempoEtapa").innerHTML = `⏱️ Tempo: ${formatarTempo(tempo)}`;
        document.getElementById("vitoria-msg-sub").innerHTML = "🐠 Escolha outra família no botão Famílias!";
        modalVitoria.style.display = "flex";
        
        falar(`Parabéns! Você completou a família ${familiaAtualLetra}!`, () => {
            setTimeout(() => {
                modalVitoria.style.display = "none";
                aguardandoProxima = false;
            }, 2000);
        });
    }
    
    // ========== SELEÇÃO DE FAMÍLIAS ==========
    function abrirSeletorFamilias() { modalCategorias.style.display = "flex"; }
    function fecharSeletorFamilias() { modalCategorias.style.display = "none"; }
    function preencherGridFamilias() {
        const grid = document.getElementById("listaCategorias");
        grid.innerHTML = "";
        familiasCompletas.forEach(fam => {
            const btn = document.createElement("button");
            btn.className = "opcao-botao";
            const letraFormatada = getLetraFormatada(fam.letra);
            btn.innerHTML = `<span class="letra-exemplo" style="font-family: ${modalidades[modalidadeAtual].fonte};">${letraFormatada}</span> ${fam.letra} → ${fam.silabas.join(" · ")}`;
            btn.onclick = () => {
                resetarJogoParaFamilia(fam.letra);
                fecharSeletorFamilias();
            };
            btn.ontouchstart = (e) => { e.preventDefault(); resetarJogoParaFamilia(fam.letra); fecharSeletorFamilias(); };
            grid.appendChild(btn);
        });
    }
    
    // ========== SELEÇÃO DE MODALIDADE DO ALFABETO ==========
    function abrirSeletorAlfabeto() { 
        atualizarStatusModalidade();
        modalAlfabeto.style.display = "flex"; 
    }
    function fecharSeletorAlfabeto() { modalAlfabeto.style.display = "none"; }
    function atualizarStatusModalidade() {
        document.getElementById("modalidadeAtualStatus").innerHTML = `Modalidade atual: ${modalidades[modalidadeAtual].nome}`;
    }
    function mudarModalidade(chave) {
        modalidadeAtual = chave;
        atualizarStatusModalidade();
        // Atualiza a exibição das letras nos botões de família se o modal de famílias estiver aberto ou para a próxima vez que abrir
        preencherGridFamilias();
        // Se o jogo estiver ativo, podemos também atualizar a sílaba alvo? Não precisa, pois sílabas são textos fixos.
        // Mas a navegação já estará com a nova fonte no modal de famílias.
        falar(`Alfabeto alterado para ${modalidades[chave].nome}`);
    }
    function preencherGridModalidades() {
        const grid = document.getElementById("listaModalidades");
        grid.innerHTML = "";
        for (const [chave, dados] of Object.entries(modalidades)) {
            const btn = document.createElement("button");
            btn.className = "opcao-botao";
            btn.innerHTML = `<span class="letra-exemplo" style="font-family: ${dados.fonte};">${dados.exemplo}</span> ${dados.nome}`;
            btn.onclick = () => {
                mudarModalidade(chave);
                fecharSeletorAlfabeto();
            };
            btn.ontouchstart = (e) => { e.preventDefault(); mudarModalidade(chave); fecharSeletorAlfabeto(); };
            grid.appendChild(btn);
        }
    }
    
    // ========== NAVEGAÇÃO E EVENTOS ==========
    function toggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
    function toggleAudio() { audioEnabled = !audioEnabled; document.getElementById("btn-audio").innerHTML = audioEnabled ? "🔊 Som Ligado" : "🔇 Som Desligado"; if (audioEnabled) bgAudio.play().catch(e=>{}); else bgAudio.pause(); }
    function voltarParaAlfabeto() { if (aguardandoProxima) return; modalNavegacao.style.display = "flex"; }
    function fecharModalVolta() { modalNavegacao.style.display = "none"; }
    function confirmarVolta() { modalNavegacao.style.display = "none"; window.location.href = "pesca_de_letrinhas.html"; }
    
    function addBothEvents(element, handler) {
        if (!element) return;
        element.addEventListener('click', handler);
        element.addEventListener('touchstart', handler, { passive: false });
    }
    
    addBothEvents(document.getElementById("btnVoltarAlfabeto"), voltarParaAlfabeto);
    addBothEvents(document.getElementById("btnCancelarVolta"), fecharModalVolta);
    addBothEvents(document.getElementById("btnConfirmarVolta"), confirmarVolta);
    addBothEvents(document.getElementById("btnRepetirSilaba"), repetirSilabaAlvo);
    addBothEvents(document.getElementById("silabaAlvo"), (e) => { e.stopPropagation(); repetirSilabaAlvo(); });
    addBothEvents(btnEscolherFamilia, abrirSeletorFamilias);
    addBothEvents(document.getElementById("btnFecharCategorias"), fecharSeletorFamilias);
    addBothEvents(btnEscolherAlfabeto, abrirSeletorAlfabeto);
    addBothEvents(document.getElementById("btnFecharAlfabeto"), fecharSeletorAlfabeto);
    addBothEvents(document.getElementById("btnMenuPrincipal"), () => { window.location.href = "index.html"; });
    addBothEvents(document.getElementById("btnFullscreen"), toggleFullscreen);
    addBothEvents(document.getElementById("btn-audio"), toggleAudio);
    
    // ========== CURSOR PERSONALIZADO ==========
    if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
        const cursor = document.createElement('div');
        cursor.className = 'custom-cursor';
        document.body.appendChild(cursor);
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });
        document.addEventListener('mouseleave', () => { cursor.style.display = 'none'; });
        document.addEventListener('mouseenter', () => { cursor.style.display = 'block'; });
    }
    
    // ========== INICIALIZAÇÃO ==========
    window.addEventListener('resize', () => {
        peixesNaTela = window.innerWidth < 768 ? 3 : (window.innerWidth < 1024 ? 4 : 5);
    });
    
    // Bolhas aleatórias
    setInterval(() => {
        if (jogoAtivo && !aguardandoProxima && Math.random() > 0.8) {
            const bolha = document.createElement("div");
            bolha.className = "bolha";
            const tam = Math.random() * (window.innerWidth < 768 ? 25 : 35) + 8 + "px";
            bolha.style.width = tam; bolha.style.height = tam;
            bolha.style.left = Math.random() * 100 + "vw";
            bolha.style.animationDuration = Math.random() * 3 + 2 + "s";
            document.body.appendChild(bolha);
            setTimeout(() => bolha.remove(), 5000);
        }
    }, 1200);
    
    window.onload = () => {
        if (window.speechSynthesis) window.speechSynthesis.getVoices();
        preencherGridFamilias();
        preencherGridModalidades();
        atualizarStatusModalidade();
        resetarJogoParaFamilia("B");
    };
</script>
</body>
</html>
