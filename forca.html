<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Forca Submarina • Netuno</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #001f3f 0%, #003b6a 100%);
      font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 10px;
    }

    .game-container {
      width: 100%;
      max-width: 450px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 48px;
      padding: 20px 16px 25px;
      box-shadow: 0 30px 45px rgba(0, 0, 0, 0.5), inset 0 2px 8px rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    /* Área da forca – agora bem alta e visível */
    .hangman-area {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0, 20, 40, 0.6);
      border-radius: 70px;
      padding: 12px 10px;
      box-shadow: inset 0 0 25px #00a6ff33, 0 15px 20px rgba(0,0,0,0.5);
      border: 1px solid #4ad9ff;
    }

    canvas#hangmanCanvas {
      width: 100%;
      height: auto;
      max-height: 280px;
      display: block;
      background: transparent;
      border-radius: 20px;
    }

    /* Palavra oculta */
    .word-display {
      font-size: 2.4rem;
      letter-spacing: 12px;
      font-weight: 700;
      color: #f7e05e;
      text-shadow: 0 0 15px #ffbb2e, 0 4px 8px black;
      background: rgba(0, 30, 60, 0.7);
      padding: 10px 18px;
      border-radius: 80px;
      margin: 5px 0;
      text-align: center;
      word-break: break-all;
      border: 1px solid #ffd966;
      backdrop-filter: blur(5px);
      width: fit-content;
      min-width: 200px;
    }

    /* Categoria e dica */
    .category-badge {
      background: #ffd966;
      color: #002856;
      font-weight: bold;
      font-size: 1.1rem;
      padding: 6px 22px;
      border-radius: 30px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 10px black;
      text-transform: uppercase;
    }

    /* Teclado amplo e confortável para touch */
    .keyboard {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      width: 100%;
      margin: 5px 0 8px;
      touch-action: manipulation;
    }

    .key {
      background: #023e8a;
      border: 2px solid #90e0ff;
      color: white;
      font-weight: bold;
      font-size: 1.5rem;
      padding: 14px 0;
      border-radius: 18px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 6px 0 #001b3a, 0 10px 15px rgba(0, 0, 0, 0.5);
      transition: all 0.05s ease;
      background: linear-gradient(180deg, #0077be 0%, #003d6b 100%);
      user-select: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .key:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #001b3a, 0 6px 10px black;
      background: #00a6ff;
    }

    .key.disabled {
      opacity: 0.4;
      transform: translateY(2px);
      box-shadow: 0 2px 0 #001b3a;
      pointer-events: none;
      background: #2c3e50;
      border-color: #5d6d7e;
    }

    /* Botão novo jogo */
    .new-game-btn {
      background: #f4a261;
      border: none;
      font-size: 1.5rem;
      font-weight: bold;
      color: #00243d;
      padding: 14px 28px;
      border-radius: 40px;
      letter-spacing: 1px;
      box-shadow: 0 8px 0 #b85e1a, 0 12px 20px black;
      cursor: pointer;
      transition: 0.08s linear;
      background: linear-gradient(180deg, #ffb347 0%, #e76f00 100%);
      border: 2px solid #ffe5b9;
      margin-top: 5px;
      width: fit-content;
      touch-action: manipulation;
    }

    .new-game-btn:active {
      transform: translateY(5px);
      box-shadow: 0 3px 0 #b85e1a, 0 8px 12px black;
    }

    .message-area {
      font-weight: bold;
      color: #ffd966;
      background: #001b33cc;
      padding: 6px 20px;
      border-radius: 30px;
      font-size: 1.2rem;
    }

    /* Ajuste para telas menores */
    @media (max-width: 400px) {
      .key {
        font-size: 1.3rem;
        padding: 12px 0;
      }
      .word-display {
        font-size: 2rem;
        letter-spacing: 8px;
      }
    }
  </style>
</head>
<body>
<div class="game-container">
  <!-- Área da forca ampliada verticalmente -->
  <div class="hangman-area">
    <canvas id="hangmanCanvas" width="300" height="280" aria-label="Desenho da forca"></canvas>
  </div>

  <!-- Categoria atual -->
  <div class="category-badge" id="categoryDisplay">PAÍSES</div>

  <!-- Palavra mascarada -->
  <div class="word-display" id="wordDisplay"></div>

  <!-- Status / mensagens -->
  <div class="message-area" id="messageBox">Clique nas letras</div>

  <!-- Teclado virtual grande -->
  <div class="keyboard" id="keyboardContainer"></div>

  <!-- Botão de novo jogo (substitui modos) -->
  <button class="new-game-btn" id="newGameButton">🌊 NOVO JOGO</button>
</div>

<script>
  (function() {
    // ---------- BANCO DE PALAVRAS (sem mundo marítimo) ----------
    const WORD_BANK = {
      países: [
        "BRASIL", "CHILE", "FRANCA", "JAPAO", "CANADA", "MEXICO", "ALEMANHA", "ITALIA", 
        "ESPANHA", "ARGENTINA", "PERU", "CHINA", "INDIA", "EGITO", "SUECIA", "NORUEGA",
        "PORTUGAL", "RUSSIA", "AUSTRALIA", "COREIA"
      ],
      frutas: [
        "ABACAXI", "BANANA", "MORANGO", "LARANJA", "UVA", "MELANCIA", "MANGA", "PERA",
        "KIWI", "CEREJA", "ABACATE", "GOIABA", "CAQUI", "FIGO", "LIMÃO", "AMEIXA",
        "CARAMBOLA", "JABUTICABA", "FRAMBOESA", "CUPUACU"
      ],
      profissões: [
        "MEDICO", "ENGENHEIRO", "PROFESSOR", "BOMBEIRO", "POLICIAL", "ARQUITETO", "JORNALISTA",
        "PILOTO", "MOTORISTA", "PINTOR", "COZINHEIRO", "ADVOGADO", "DENTISTA", "VETERINARIO",
        "FARMACEUTICO", "ELETRICISTA", "MECANICO", "PSICOLOGO", "BIOLOGO", "ATOR"
      ]
    };

    const CATEGORIES = ["países", "frutas", "profissões"];
    
    // Estado do jogo
    let currentCategory = "países";
    let secretWord = "";
    let guessedLetters = new Set();
    let wrongGuesses = 0;
    const maxWrong = 6;
    let gameOver = false;

    // Elementos DOM
    const canvas = document.getElementById("hangmanCanvas");
    const ctx = canvas.getContext("2d");
    const categoryDisplay = document.getElementById("categoryDisplay");
    const wordDisplay = document.getElementById("wordDisplay");
    const messageBox = document.getElementById("messageBox");
    const keyboardDiv = document.getElementById("keyboardContainer");
    const newGameBtn = document.getElementById("newGameButton");

    // ---------- DESENHO DA FORCA (grande e vertical) ----------
    function drawHangman(wrongCount) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Base e postes (estilo submarino/tritão)
      ctx.strokeStyle = "#b0e0e6";
      ctx.lineWidth = 5;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.shadowColor = "#00ffff";
      ctx.shadowBlur = 8;
      
      // Base
      ctx.beginPath();
      ctx.moveTo(40, 250);
      ctx.lineTo(180, 250);
      ctx.stroke();
      
      // Poste vertical
      ctx.beginPath();
      ctx.moveTo(90, 250);
      ctx.lineTo(90, 40);
      ctx.stroke();
      
      // Topo horizontal
      ctx.beginPath();
      ctx.moveTo(86, 40);
      ctx.lineTo(200, 40);
      ctx.stroke();
      
      // Corda
      ctx.beginPath();
      ctx.moveTo(200, 40);
      ctx.lineTo(200, 80);
      ctx.stroke();
      
      // Sombra menor para o corpo
      ctx.shadowBlur = 6;
      ctx.strokeStyle = "#f0e68c";
      ctx.fillStyle = "#ffe484";
      
      // Desenho progressivo do boneco
      if (wrongCount >= 1) {
        // Cabeça
        ctx.beginPath();
        ctx.arc(200, 100, 24, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = "#ffdb8e";
        ctx.fill();
        ctx.stroke();
      }
      if (wrongCount >= 2) {
        // Tronco
        ctx.beginPath();
        ctx.moveTo(200, 124);
        ctx.lineTo(200, 185);
        ctx.stroke();
      }
      if (wrongCount >= 3) {
        // Braço esquerdo
        ctx.beginPath();
        ctx.moveTo(200, 140);
        ctx.lineTo(165, 165);
        ctx.stroke();
      }
      if (wrongCount >= 4) {
        // Braço direito
        ctx.beginPath();
        ctx.moveTo(200, 140);
        ctx.lineTo(235, 165);
        ctx.stroke();
      }
      if (wrongCount >= 5) {
        // Perna esquerda
        ctx.beginPath();
        ctx.moveTo(200, 185);
        ctx.lineTo(170, 225);
        ctx.stroke();
      }
      if (wrongCount >= 6) {
        // Perna direita
        ctx.beginPath();
        ctx.moveTo(200, 185);
        ctx.lineTo(230, 225);
        ctx.stroke();
      }
      
      // Detalhe extra: tridente ou bolhas quando enforcado (opcional)
      if (wrongCount >= 6) {
        ctx.fillStyle = "#ff5555";
        ctx.beginPath();
        ctx.arc(190, 85, 5, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(210, 85, 5, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(188, 83, 2, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(208, 83, 2, 0, Math.PI*2);
        ctx.fill();
      }
      
      ctx.shadowBlur = 0;
      ctx.shadowColor = "transparent";
    }

    // ---------- LÓGICA DO JOGO ----------
    function getMaskedWord() {
      return secretWord
        .split("")
        .map(letter => (guessedLetters.has(letter) ? letter : "_"))
        .join(" ");
    }

    function updateUI() {
      wordDisplay.textContent = getMaskedWord();
      drawHangman(wrongGuesses);
      
      // Atualizar botões do teclado (desabilitar usadas)
      document.querySelectorAll(".key").forEach(btn => {
        const letter = btn.getAttribute("data-letter");
        if (guessedLetters.has(letter)) {
          btn.classList.add("disabled");
        } else {
          btn.classList.remove("disabled");
        }
      });
    }

    function checkGameStatus() {
      const masked = getMaskedWord().replace(/\s/g, "");
      if (masked === secretWord) {
        gameOver = true;
        messageBox.textContent = "🎉 Você venceu!";
        disableAllKeys();
        return true;
      }
      if (wrongGuesses >= maxWrong) {
        gameOver = true;
        messageBox.textContent = `💀 Perdeu! Palavra: ${secretWord}`;
        disableAllKeys();
        // Revelar palavra inteira
        wordDisplay.textContent = secretWord.split("").join(" ");
        return true;
      }
      messageBox.textContent = "Escolha uma letra...";
      return false;
    }

    function disableAllKeys() {
      document.querySelectorAll(".key").forEach(btn => btn.classList.add("disabled"));
    }

    function handleLetterGuess(letter) {
      if (gameOver) {
        messageBox.textContent = "Jogo encerrado. Novo jogo?";
        return;
      }
      if (guessedLetters.has(letter)) return;
      
      guessedLetters.add(letter);
      
      if (!secretWord.includes(letter)) {
        wrongGuesses++;
      }
      
      updateUI();
      checkGameStatus();
    }

    // Escolhe palavra aleatória da categoria atual
    function pickRandomWord(category) {
      const list = WORD_BANK[category];
      if (!list || list.length === 0) return "BRASIL";
      return list[Math.floor(Math.random() * list.length)].toUpperCase();
    }

    function resetGame() {
      // Escolher categoria aleatória entre as três disponíveis
      const randomIndex = Math.floor(Math.random() * CATEGORIES.length);
      currentCategory = CATEGORIES[randomIndex];
      secretWord = pickRandomWord(currentCategory);
      guessedLetters.clear();
      wrongGuesses = 0;
      gameOver = false;
      
      // Atualizar nome da categoria na interface
      const categoryNames = {
        países: "PAÍSES",
        frutas: "FRUTAS",
        profissões: "PROFISSÕES"
      };
      categoryDisplay.textContent = categoryNames[currentCategory] || currentCategory.toUpperCase();
      
      messageBox.textContent = "Nova partida!";
      updateUI();
      buildKeyboard(); // reconstroi teclado fresco
    }

    // ---------- TECLADO VIRTUAL ----------
    function buildKeyboard() {
      keyboardDiv.innerHTML = "";
      const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
      letters.forEach(letter => {
        const btn = document.createElement("div");
        btn.className = "key";
        btn.setAttribute("data-letter", letter);
        btn.textContent = letter;
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          handleLetterGuess(letter);
        });
        // Para touch, evitar zoom duplo etc
        btn.addEventListener("touchend", (e) => {
          e.preventDefault();
          handleLetterGuess(letter);
        });
        keyboardDiv.appendChild(btn);
      });
      
      // Sincronizar estado disabled caso já existam letras usadas (reset)
      updateUI();
    }

    // Evento novo jogo
    newGameBtn.addEventListener("click", (e) => {
      e.preventDefault();
      resetGame();
    });
    newGameBtn.addEventListener("touchend", (e) => {
      e.preventDefault();
      resetGame();
    });

    // Inicialização
    function initialGame() {
      // Define categoria inicial aleatória
      const startCat = CATEGORIES[Math.floor(Math.random() * CATEGORIES.length)];
      currentCategory = startCat;
      secretWord = pickRandomWord(currentCategory);
      guessedLetters.clear();
      wrongGuesses = 0;
      gameOver = false;
      
      const categoryNames = {
        países: "PAÍSES",
        frutas: "FRUTAS",
        profissões: "PROFISSÕES"
      };
      categoryDisplay.textContent = categoryNames[currentCategory] || currentCategory.toUpperCase();
      messageBox.textContent = "Clique nas letras!";
      drawHangman(0);
      buildKeyboard();
      wordDisplay.textContent = getMaskedWord();
    }

    // Ajustar canvas no redimensionamento (não altera tamanho interno)
    window.addEventListener('resize', () => {
      drawHangman(wrongGuesses);
    });

    // Iniciar tudo
    initialGame();
  })();
</script>
</body>
</html>
