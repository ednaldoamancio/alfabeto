<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Nunito:wght@400;600;700;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
            margin: 0;
            padding: 0;
        }

        body {
            /* ALTERADO: Plano de fundo substituído pela imagem do oceano */
            background-image: url('fundo_forca.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #043b5c;
            
            color: #eef5ff;
            font-family: 'Nunito', 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            padding: 5px 15px;
            overflow: hidden;
            position: relative;
        }

        /* Sobreposição escura para melhorar a leitura do texto */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(1, 20, 35, 0.3);
            z-index: -1;
        }

        /* Bolhas decorativas */
        .bubble-marine {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle, rgba(200, 240, 255, 0.4), rgba(100, 200, 255, 0.1));
            border-radius: 50%;
            animation: flutuarBolha linear infinite;
        }

        @keyframes flutuarBolha {
            0% { transform: translateY(100vh) scale(0.3); opacity: 0; }
            20% { opacity: 0.5; }
            80% { opacity: 0.4; }
            100% { transform: translateY(-20vh) scale(1); opacity: 0; }
        }

        .concha {
            position: fixed;
            font-size: 28px;
            pointer-events: none;
            z-index: 0;
            animation: flutuarConcha 12s infinite ease-in-out;
            filter: drop-shadow(0 0 5px rgba(255,215,0,0.3));
        }

        @keyframes flutuarConcha {
            0%, 100% { transform: translate(0, 0) rotate(0deg); opacity: 0.3; }
            50% { transform: translate(15px, -20px) rotate(8deg); opacity: 0.7; }
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            background: rgba(2, 40, 60, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 50px;
            padding: 8px 15px;
            margin-bottom: 10px;
            z-index: 10;
            border: 1px solid #ffcd7e;
        }

        h1 {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 0.9rem;
            margin: 0;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffdd99, #ffbc6e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Seletor de modo */
        .modo-selector {
            display: flex;
            gap: 8px;
            background: rgba(0,0,0,0.4);
            padding: 4px 10px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
        }

        .modo-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #7ec8ff;
            color: #7ec8ff;
            padding: 4px 12px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 40px;
            font-size: 0.7rem;
            transition: all 0.3s;
            font-family: 'Nunito', sans-serif;
        }

        .modo-btn.ativo {
            background: linear-gradient(135deg, #1e5f8e, #0d3a5c);
            border-color: #ffcd7e;
            color: #ffeaac;
            box-shadow: 0 0 10px rgba(255,205,126,0.4);
        }

        .modo-btn:hover {
            transform: scale(1.05);
            background: rgba(30, 95, 142, 0.6);
        }

        .audio-controls {
            display: flex;
            gap: 8px;
        }

        .audio-btn, .btn-dourado {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #ffcd7e;
            color: #ffeaac;
            padding: 6px 12px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 40px;
            font-size: 0.7rem;
            transition: all 0.3s;
            font-family: 'Nunito', sans-serif;
        }

        .audio-btn:hover, .btn-dourado:hover {
            transform: scale(1.05);
            background: rgba(255, 205, 126, 0.3);
            box-shadow: 0 0 15px rgba(255,205,126,0.5);
        }

        /* Botão Dourado Cintilante */
        .btn-dourado {
            background: linear-gradient(135deg, #f5b042, #ffd700, #f5a623);
            border: 2px solid #fff2b5;
            color: #3a2a1a;
            animation: brilhoDourado 1.5s ease-in-out infinite alternate;

        @keyframes brilhoDourado {
            0% {

        #fullscreen-btn {
            border-color: #48cae4;
            color: #48cae4;
        }

        #game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            z-index: 5;
        }

        #top-row {
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: space-around;
            gap: 10px;
            min-height: 0;
        }

        #hangman-container {
            flex: 1;
            height: 80%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 30, 50, 0.3);
            border-radius: 30px;
            padding: 10px;
            backdrop-filter: blur(4px);

        /* ALTERADO: Ajuste da imagem da Forca (PNG) */

        #display-section {

        footer {

    </style>
</head>
<body>

<!-- Decorações marinhas -->
<div class="tridente-decor">🔱🐚</div>
<div id="particulas-container"></div>

<header>
    <h1>🧜‍♀️ FORCA SUBMARINA - REINO DE NETUNO 🧜‍♂️</h1>
    <div class="modo-selector">
        <button class="modo-btn" data-modo="maritimo" onclick="selecionarModo('maritimo')">🌊 Mundo Marítimo</button>
        <button class="modo-btn" data-modo="geral" onclick="selecionarModo('geral')">🌍 Aprendizado Geral</button>

<script>
    // ==================== GERADOR DE SONS VIA WEB AUDIO API ====================
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function ensureAudioContext() {
        if (!audioCtx) {
            audioCtx = new AudioContext();
        }
        return audioCtx;
    }

    // Som de acerto (splash suave)
    function playAcerto() {
        try {
            const ctx = ensureAudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1200, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.15);
        } catch(e) { console.log('audio error', e); }
    }

    // Som de erro (bolha estourando)
    function playErro() {
        try {
            const ctx = ensureAudioContext();
            const bufferSize = ctx.sampleRate * 0.08;
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
            }
            const noise = ctx.createBufferSource();
            noise.buffer = buffer;
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.12, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
            noise.connect(gain);
            gain.connect(ctx.destination);
            noise.start(ctx.currentTime);
            noise.stop(ctx.currentTime + 0.08);
        } catch(e) { console.log('audio error', e); }
    }

    // Som de vitória (trinado alegre)
    function playVitoria() {
        try {
            const ctx = ensureAudioContext();
            const notas = [523.25, 659.25, 783.99, 1046.50];
            notas.forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.value = freq;
                const start = ctx.currentTime + i * 0.08;
                gain.gain.setValueAtTime(0.12, start);
                gain.gain.exponentialRampToValueAtTime(0.01, start + 0.15);
                osc.start(start);
                osc.stop(start + 0.15);
            });
        } catch(e) { console.log('audio error', e); }
    }

    // Som de derrota (descendente melancólico)
    function playDerrota() {
        try {
            const ctx = ensureAudioContext();
            const notas = [523.25, 493.88, 440.00, 392.00, 349.23];
            notas.forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.value = freq;
                const start = ctx.currentTime + i * 0.1;
                gain.gain.setValueAtTime(0.10, start);
                gain.gain.exponentialRampToValueAtTime(0.01, start + 0.2);
                osc.start(start);
                osc.stop(start + 0.2);
            });
        } catch(e) { console.log('audio error', e); }
    }

    // Música de fundo (ambiente oceânico com notas suaves)
    let bgInterval = null;
    let musicPlaying = false;

    function playBackgroundMusic() {
        if (bgInterval) return;
        try {
            const ctx = ensureAudioContext();
            let noteIndex = 0;
            const notas = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
            bgInterval = setInterval(() => {
                if (!musicPlaying) return;
                try {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.value = notas[noteIndex % notas.length];
                    gain.gain.setValueAtTime(0.04, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.4);
                    noteIndex++;
                } catch(e) { /* ignora erros de áudio */ }
            }, 500);
        } catch(e) { console.log('bg music error', e); }
    }

    function stopBackgroundMusic() {
        if (bgInterval) {
            clearInterval(bgInterval);
            bgInterval = null;
        }
    }

    // ==================== BANCO DE PALAVRAS ====================

    // 🌊 MUNDO MARÍTIMO (Tema do oceano)
    const databaseMaritimo = {
        "🧜‍♀️ CRIATURAS MARINHAS": ["SEREIA", "TRITÃO", "NETUNO", "POLVO", "TUBARÃO", "BALEIA", "GOLFINHO", "TARTARUGA", "CAVALO MARINHO", "ESTRELA DO MAR", "AGUA VIVA", "LULA", "CARANGUEJO", "LAGOSTA", "SALMAO", "ATUM", "BACALHAU", "PEPINO DO MAR", "OURICO DO MAR"],
        "🏰 REINO DE ATLÂNTIDA": ["ATLANTIDA", "TRIDENTE", "CORAL", "CONCHA", "PEROLA", "CASTELO", "PALACIO", "JARDIM MARINHO", "RECIFE", "ALGA", "TESOURO", "BAU", "COROA", "POSEIDON", "OCEANO", "MARE", "FUNDO DO MAR", "ABISMO"],
        "👑 PERSONAGENS DA SEREIA": ["ARIEL", "PRINCIPE ERIC", "URSULA", "REI TRITAO", "CARANGUEJO SEBASTIAO", "PEIXE LINGUADO", "BRUXA DO MAR", "POLVO MALVADO", "PRINCESA SEREIA"],
        "🌊 OCEANO E MAR": ["ONDA", "MARE ALTA", "TEMPORAL", "PRAIA", "AREIA", "COQUEIRO", "BARCO", "VELA", "ANCORA", "REMOS", "NAUFRAGIO", "ILHA", "ARQUIPELAGO", "LAGUNA", "CORRENTE"],
        "💎 TESOUROS DO MAR": ["PEROLA", "CRISTAL", "RUBI", "ESMERALDA", "DIAMANTE", "OURO", "PRATA", "BRONZE", "CORAL", "MAPAS", "BUSSOLA", "CONCHA", "AMONITE", "MARFIM"]
    };

    // 🌍 APRENDIZADO GERAL (Categorias educativas do dia a dia)
    const databaseGeral = {
        "🐶 ANIMAIS": ["CACHORRO", "GATO", "ELEFANTE", "GIRAFA", "LEAO", "TIGRE", "ZEBRA", "MACACO", "COELHO", "RATO", "CAVALO", "VACA", "PORCO", "GALINHA", "PATO", "OVELHA", "BODE", "URSO", "LOBO", "RAPOSA", "ESQUILO", "CANGURU", "PANDA", "PINGUIM", "TUBARAO", "BALEIA", "JACARE", "COBRA", "SAPO", "ABELHA", "FORMIGA", "BORBOLETA", "MORCEGO", "CORUJA", "AGUIA", "PAPAGAIO", "HIPOPOTAMO", "RINOCERONTE", "COALA"],
        "🏠 CASA": ["CADEIRA", "MESA", "SOFA", "CAMA", "ARMARIO", "GELADEIRA", "FOGAO", "TELEVISAO", "JANELA", "PORTA", "TAPETE", "CORTINA", "LAMPADA", "ESPELHO", "TRAVESSEIRO", "LENCOL", "TOALHA", "CHUVEIRO", "VASO", "PIA", "COPO", "PRATO", "TALHER", "PANELA", "VASSOURA", "BALDE", "RELÓGIO", "QUADRO", "ESTANTE", "MICROONDAS", "GARFO", "FACA", "COLHER", "XICARA", "COBERTOR", "CABIDE", "PENTE"],
        "🌎 PAÍSES": ["BRASIL", "ARGENTINA", "CHILE", "MEXICO", "CANADA", "ESTADOS UNIDOS", "PORTUGAL", "ESPANHA", "FRANCA", "ITALIA", "ALEMANHA", "INGLATERRA", "JAPAO", "CHINA", "EGITO", "AUSTRALIA", "RUSSIA", "INDIA", "ANGOLA", "GRECIA", "URUGUAI", "PARAGUAI", "PERU", "COLOMBIA", "NORUEGA", "SUECIA", "MARROCOS"],
        "🍎 ALIMENTOS": ["BANANA", "MACA", "LARANJA", "UVA", "MORANGO", "MELANCIA", "ABACAXI", "PERA", "MAMAO", "LIMAO", "BATATA", "CENOURA", "TOMATE", "ALFACE", "FEIJAO", "ARROZ", "MACARRAO", "CARNE", "OVO", "LEITE", "PAO", "QUEIJO", "BOLO", "BISCOITO", "SUCO", "PIPOCA", "GELATINA", "CHOCOLATE", "PIZZA", "HAMBURGUER"],
        "👨‍⚕️ PROFISSÕES": ["PROFESSOR", "MEDICO", "DENTISTA", "POLICIAL", "BOMBEIRO", "PADEIRO", "MOTORISTA", "COZINHEIRO", "PINTOR", "PEDREIRO", "CARPINTEIRO", "MECANICO", "VENDEDOR", "ARTISTA", "CANTOR", "DANCARINO", "ATLETA", "JORNALISTA", "CIENTISTA", "ASTRONAUTA", "VETERINARIO", "ADVOGADO", "PILOTO", "CARTEIRO", "JARDINEIRO"],
        "🧠 CORPO HUMANO": ["CABECA", "OMBRO", "JOELHO", "PE", "OLHO", "OUVIDO", "BOCA", "NARIZ", "MAO", "DEDO", "BRACO", "PERNA", "BARRIGA", "COSTA", "PESCOCO", "DENTE", "LINGUA", "UNHA", "CABELO", "CORACAO", "PULMAO", "ESTOMAGO", "CEREBRO", "SANGUE", "OSSO"]
    };

    // 🎲 MISTÉRIO (Junta todas as categorias dos dois mundos)
    const databaseMisterio = {
        ...databaseMaritimo,
        ...databaseGeral
    };

    let currentDatabase = databaseMaritimo;
    let currentModo = "maritimo";
    
    // VARIÁVEL NOVA: Armazena as palavras que ainda não foram jogadas
    let wordPool = [];

    let currentWordRaw = "";
    let currentWordNormalized = "";
    let currentCategory = "";
    let guessedLetters = [];
    let mistakes = 0;

    // FUNÇÃO NOVA: Gera e embaralha uma lista de palavras baseada no modo atual
    function gerarPilhaDePalavras() {
        wordPool = [];
        
        // Adiciona todas as palavras do modo atual na lista
        for (const category in currentDatabase) {
            currentDatabase[category].forEach(word => {
                wordPool.push({ category: category, word: word });
            });
        }
        
        // Embaralha a lista (Algoritmo Fisher-Yates) para que as categorias fiquem misturadas
        for (let i = wordPool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [wordPool[i], wordPool[j]] = [wordPool[j], wordPool[i]];
        }
    }

    // ==================== FUNÇÃO PARA SELECIONAR MODO ====================
    function selecionarModo(modo) {
        currentModo = modo;

        document.querySelectorAll('.modo-btn').forEach(btn => {
            btn.classList.remove('ativo');
            if (btn.getAttribute('data-modo') === modo) {
                btn.classList.add('ativo');
            }
        });

        if (modo === "maritimo") {
            currentDatabase = databaseMaritimo;
            mostrarMensagemTemporaria("🌊 MODO MUNDO MARÍTIMO! Explore o fundo do mar! 🌊", "#7ec8ff");
        } else if (modo === "geral") {
            currentDatabase = databaseGeral;
            mostrarMensagemTemporaria("🌍 MODO APRENDIZADO GERAL! Aprenda palavras do dia a dia! 🌍", "#ffeaac");
        } else if (modo === "misterio") {
            currentDatabase = databaseMisterio;
            mostrarMensagemTemporaria("🎲 MODO MISTÉRIO! Todos os mundos se misturam! 🎲", "#ffaa66");
        }

        // Toda vez que muda de modo, recria a pilha com as novas palavras
        gerarPilhaDePalavras();
        initGame();
    }

    function mostrarMensagemTemporaria(msg, cor) {
        const msgDiv = document.getElementById('message');
        msgDiv.innerHTML = msg;
        msgDiv.style.color = cor;
        setTimeout(() => {
            if (msgDiv.innerHTML === msg) {
                msgDiv.innerHTML = "🐚 Escolha uma letra para ajudar a Sereia! 🐚";
                msgDiv.style.color = "#b9e6ff";
            }
        }, 2500);
    }

    // ==================== FUNÇÃO PARA VOLTAR À PÁGINA ANTERIOR ====================
    function voltarParaPaginaAnterior() {
        if (typeof confetti !== 'undefined') {
            confetti({
                particleCount: 60,
                spread: 60,
                origin: { y: 0.3 },
                colors: ['#ffd700', '#48cae4', '#ffaa33'],
                startVelocity: 10
            });
        }
        window.location.href = 'https://ilha-das-vogais.vercel.app/';
    }

    // ==================== FUNÇÃO DE TELA CHEIA ====================
    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {});
            document.getElementById('fullscreen-btn').innerHTML = "✖ SAIR TELA";
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
                document.getElementById('fullscreen-btn').innerHTML = "⛶ TELA CHEIA";
            }
        }
    }

    function normalize(str) {
        return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
    }

    function initGame() {
        // Se a pilha de palavras estiver vazia, gera ela novamente
        if (wordPool.length === 0) {
            gerarPilhaDePalavras();
            // Mostra aviso de que as palavras reiniciaram
            setTimeout(() => {
               mostrarMensagemTemporaria("🔄 Todas as palavras foram usadas! Reiniciando a lista...", "#ffdd99");
            }, 2600); 
        }

        // Retira a última palavra da pilha já embaralhada
        const palavraSorteada = wordPool.pop();
        currentCategory = palavraSorteada.category;
        currentWordRaw = palavraSorteada.word.toUpperCase();

        currentWordNormalized = normalize(currentWordRaw);
        guessedLetters = [];
        mistakes = 0;

        let icone = "";
        if (currentModo === "maritimo") icone = "🌊";
        else if (currentModo === "geral") icone = "🌍";
        else icone = "🎲";

        document.getElementById('category-info').innerHTML = icone + " " + currentCategory + " " + icone;
        document.getElementById('reset-btn').style.display = "none";

        // ALTERADO: Inicializa a forca como a imagem principal sem nenhum filtro
        const imgElement = document.getElementById('hangman-img');
        imgElement.style.opacity = '1';
        imgElement.style.filter = 'none';

        renderWord();
        renderKeyboard();

        let msgInicial = "";
        if (currentModo === "maritimo") msgInicial = "🐚 Mergulhe no fundo do mar e adivinhe a palavra! 🐚";
        else if (currentModo === "geral") msgInicial = "📚 Aprenda novas palavras do seu dia a dia! 📚";
        else msgInicial = "🔮 O mistério está no ar! Qual será a palavra? 🔮";

        document.getElementById('message').innerHTML = msgInicial;
        document.getElementById('message').style.color = "#b9e6ff";
    }

    function renderWord() {
        const container = document.getElementById('word-display');
        let displayStr = "";
        let winCounter = 0;
        for (let i = 0; i < currentWordRaw.length; i++) {
            const charRaw = currentWordRaw[i];
            const charNorm = currentWordNormalized[i];
            if (charRaw === " " || charRaw === "-") {
                displayStr += charRaw === " " ? "  " : "- ";
            } else if (guessedLetters.includes(charNorm)) {
                displayStr += charRaw + " ";
            } else {
                displayStr += "_ ";
                winCounter++;
            }
        }
        container.innerText = displayStr.trimEnd();
        if (winCounter === 0 && currentWordRaw !== "") endGame(true);
    }

    function renderKeyboard() {
        const kb = document.getElementById('keyboard');
        kb.innerHTML = "";
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('').forEach(l => {
            const b = document.createElement('button');
            b.innerText = l;
            b.className = 'key';
            b.id = 'k-' + l;
            b.onclick = () => handleGuess(l);
            kb.appendChild(b);
        });
    }

    function handleGuess(l) {
        if (guessedLetters.includes(l) || mistakes >= 6) return;
        const keyBtn = document.getElementById('k-' + l);
        if (keyBtn) keyBtn.disabled = true;

        if (currentWordNormalized.includes(l)) {
            guessedLetters.push(l);
            playAcerto();
            renderWord();
        } else {
            mistakes++;
            playErro();
            
            // ALTERADO: Aqui está a correção! 
            // Em vez de tentar carregar imagens que não existem (o que gera o ícone de erro),
            // nós apenas esmaecemos a imagem principal a cada erro.
            const imgElement = document.getElementById('hangman-img');
            const opacidade = 1 - (mistakes * 0.1666); // 1 erro = 83%, 6 erros = 0% (invisível)
            imgElement.style.opacity = opacidade;
            
            // Se atingiu 6 erros, termina o jogo
            if (mistakes === 6) {
                endGame(false);
            }
        }
    }

    function endGame(win) {
        const msg = document.getElementById('message');
        if (win) {
            playVitoria();
            let msgVitoria = "";
            if (currentModo === "maritimo") msgVitoria = "🧜‍♀️ PARABÉNS! A SEREIA ESCAPOU! 🧜‍♀️✨";
            else if (currentModo === "geral") msgVitoria = "🎉 PARABÉNS! VOCÊ APRENDEU MAIS UMA PALAVRA! 🎉";
            else msgVitoria = "🔮 PARABÉNS! O MISTÉRIO FOI REVELADO! 🔮✨";
            msg.innerHTML = msgVitoria;
            msg.style.color = "#44ffaa";
            if (typeof confetti !== 'undefined') {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#ffd700', '#48cae4', '#ffaa33'] });
            }
        } else {
            playDerrota();
            let msgDerrota = "";
            if (currentModo === "maritimo") msgDerrota = "💔 OH NÃO! A SEREIA FOI CAPTURADA! A PALAVRA ERA: " + currentWordRaw + " 💔";
            else if (currentModo === "geral") msgDerrota = "😢 QUE PENA! VOCÊ PODE TENTAR DE NOVO! A PALAVRA ERA: " + currentWordRaw;
            else msgDerrota = "😱 O MISTÉRIO PERMANECE! A PALAVRA ERA: " + currentWordRaw;
            msg.innerHTML = msgDerrota;
            msg.style.color = "#ff8888";
            const display = document.getElementById('word-display');
            display.innerText = currentWordRaw.split('').join(' ');
        }
        document.getElementById('reset-btn').style.display = "block";
    }

    function nextRound() {
        initGame();
    }

    // ==================== CONTROLE DE MÚSICA ====================
    function toggleMusic() {
        const btn = document.getElementById('bg-music-btn');
        if (!musicPlaying) {
            musicPlaying = true;
            btn.innerHTML = "🔊 MÚSICA";
            btn.style.background = "rgba(100,200,255,0.4)";
            playBackgroundMusic();
        } else {
            musicPlaying = false;
            btn.innerHTML = "🔇 MÚSICA";
            btn.style.background = "rgba(0,0,0,0.6)";
            stopBackgroundMusic();
        }
    }

    // ==================== ELEMENTOS FLUTUANTES (BOLHAS E CONCHAS) ====================
    function criarBolhasMarinhas() {
        for (let i = 0; i < 20; i++) {
            setTimeout(() => {
                const bolha = document.createElement('div');
                bolha.className = 'bubble-marine';
                const tamanho = Math.random() * 30 + 6;
                bolha.style.width = tamanho + 'px';
                bolha.style.height = tamanho + 'px';
                bolha.style.left = Math.random() * 100 + '%';
                bolha.style.animationDuration = Math.random() * 6 + 3 + 's';
                bolha.style.animationDelay = Math.random() * 5 + 's';
                bolha.style.opacity = Math.random() * 0.4 + 0.2;
                document.body.appendChild(bolha);
                setTimeout(() => bolha.remove(), 10000);
            }, i * 150);
        }
        setInterval(() => {
            const bolha = document.createElement('div');
            bolha.className = 'bubble-marine';
            const tamanho = Math.random() * 25 + 5;
            bolha.style.width = tamanho + 'px';
            bolha.style.height = tamanho + 'px';
            bolha.style.left = Math.random() * 100 + '%';
            bolha.style.animationDuration = Math.random() * 5 + 3 + 's';
            document.body.appendChild(bolha);
            setTimeout(() => bolha.remove(), 9000);
        }, 2000);
    }

    function criarConchasFlutuantes() {
        const conchasSimbolos = ['🐚', '⭐', '🌟', '🐟', '🧜‍♀️', '🔱', '🌊', '🐠', '🐙'];
        for (let i = 0; i < 10; i++) {
            const concha = document.createElement('div');
            concha.className = 'concha';
            concha.innerText = conchasSimbolos[Math.floor(Math.random() * conchasSimbolos.length)];
            concha.style.left = Math.random() * 100 + '%';
            concha.style.top = Math.random() * 100 + '%';
            concha.style.fontSize = Math.random() * 20 + 16 + 'px';
            concha.style.animationDuration = Math.random() * 12 + 8 + 's';
            concha.style.animationDelay = Math.random() * 8 + 's';
            document.body.appendChild(concha);
        }
    }

    // ==================== INICIALIZAÇÃO ====================
    window.onload = () => {
        criarBolhasMarinhas();
        criarConchasFlutuantes();

        document.querySelector('.modo-btn[data-modo="maritimo"]').classList.add('ativo');

        // Gera as palavras antes de iniciar o jogo pela primeira vez
        gerarPilhaDePalavras();
        initGame();

        // Tentativa automática de fullscreen
        document.documentElement.requestFullscreen().catch(e => console.log("fullscreen não permitido automaticamente"));

        // Mensagem de boas-vindas
        setTimeout(() => {
            const msg = document.getElementById('message');
            msg.innerHTML = "🧜‍♀️ Bem-vinda(o) ao Reino de Netuno! Escolha um modo de jogo acima! 🧜‍♂️";
            msg.style.color = "#ffeaac";
            setTimeout(() => {
                if (msg.innerHTML.includes("Bem-vinda")) msg.innerHTML = "🌊 Clique no botão do modo que quiser e comece a brincadeira! 🌊";
            }, 3500);
        }, 500);
    };
</script>
