<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🧜‍♀️ Forca Submarina - Reino de Netuno 🧜‍♂️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Nunito:wght@400;600;700;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js">
    </script>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
            margin: 0;
            padding: 0;
        }

        body {
            background-image: url('fundo_forca.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #043b5c;
            color: #eef5ff;
            font-family: 'Nunito', 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            padding: 5px 10px;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(1, 20, 35, 0.3);
            z-index: -1;
        }

        .bubble-marine {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle, rgba(200, 240, 255, 0.4), rgba(100, 200, 255, 0.1));
            border-radius: 50%;
            animation: flutuarBolha linear infinite;
        }

        @keyframes flutuarBolha {
            0% {
                transform: translateY(100vh) scale(0.3);
                opacity: 0;
            }
            20% {
                opacity: 0.5;
            }
            80% {
                opacity: 0.4;
            }
            100% {
                transform: translateY(-20vh) scale(1);
                opacity: 0;
            }
        }

        .concha {
            position: fixed;
            font-size: 28px;
            pointer-events: none;
            z-index: 0;
            animation: flutuarConcha 12s infinite ease-in-out;
            filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.3));
        }

        @keyframes flutuarConcha {
            0%,
            100% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 0.3;
            }
            50% {
                transform: translate(15px, -20px) rotate(8deg);
                opacity: 0.7;
            }
        }

        header {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            background: rgba(2, 40, 60, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 50px;
            padding: 8px 15px;
            margin-bottom: 8px;
            z-index: 10;
            border: 1px solid #ffcd7e;
        }

        .audio-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .audio-btn,
        .btn-dourado {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #ffcd7e;
            color: #ffeaac;
            padding: 8px 14px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 40px;
            font-size: 0.75rem;
            transition: all 0.3s;
            font-family: 'Nunito', sans-serif;
            white-space: nowrap;
        }

        .audio-btn:hover,
        .btn-dourado:hover {
            transform: scale(1.05);
            background: rgba(255, 205, 126, 0.3);
            box-shadow: 0 0 15px rgba(255, 205, 126, 0.5);
        }

        .btn-dourado {
            background: linear-gradient(135deg, #f5b042, #ffd700, #f5a623);
            border: 2px solid #fff2b5;
            color: #3a2a1a;
            animation: brilhoDourado 1.5s ease-in-out infinite alternate;
        }

        @keyframes brilhoDourado {
            0% {
                box-shadow: 0 0 5px rgba(255, 215, 0, 0.4);
                background: linear-gradient(135deg, #f5b042, #ffd700);
            }
            100% {
                box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
                background: linear-gradient(135deg, #ffcc44, #ffea8c);
            }
        }

        #fullscreen-btn {
            border-color: #48cae4;
            color: #48cae4;
        }

        #game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            z-index: 5;
        }

        #top-row {
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: center;
            gap: 15px;
            min-height: 0;
        }

        #hangman-container {
            flex: 1.2;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 30, 50, 0.3);
            border-radius: 30px;
            padding: 15px;
            backdrop-filter: blur(4px);
            overflow: hidden;
            min-width: 0;
        }

        #hangman-img {
            width: 100%;
            height: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
            transition: opacity 0.2s ease;
        }

        #keyboard-container {
            flex: 1;
            max-width: 420px;
            display: flex;
            align-items: center;
        }

        #keyboard {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            width: 100%;
        }

        .key {
            background: rgba(10, 40, 60, 0.9);
            color: #ffeaac;
            border: 2px solid #7ec8ff;
            padding: 14px 0;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 14px;
            transition: all 0.2s;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .key:active {
            transform: scale(0.92);
            background: #1e5f8e;
            border-color: #ffcd7e;
        }

        .key:disabled {
            opacity: 0.3;
            border-color: #333;
            color: #666;
            cursor: default;
            transform: none;
        }

        #display-section {
            padding: 10px 0 20px 0;
            text-align: center;
            background: rgba(1, 30, 45, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            margin-top: 8px;
            flex-shrink: 0;
            border: 1px solid #ffcd7e;
        }

        #category-info {
            font-size: 0.95rem;
            color: #ffeaac;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-weight: bold;
            font-family: 'Dancing Script', cursive;
        }

        #word-display {
            font-size: 2rem;
            letter-spacing: 8px;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1.2;
            font-family: 'Cinzel Decorative', monospace;
            color: #ffdd99;
            text-shadow: 0 0 10px rgba(255, 200, 100, 0.5);
            padding: 0 10px;
            word-break: break-all;
        }

        footer {
            height: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.65rem;
            color: #8ab3cf;
            flex-shrink: 0;
        }

        #message {
            position: absolute;
            top: 65px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: bold;
            z-index: 20;
            text-align: center;
            width: 90%;
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 14px;
            border-radius: 40px;
            backdrop-filter: blur(8px);
            font-family: 'Dancing Script', cursive;
            pointer-events: none;
        }

        #reset-btn {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            font-size: 1.3rem;
            background: linear-gradient(135deg, #ffd700, #ffaa33);
            color: #2c1a2e;
            font-weight: bold;
            z-index: 100;
            display: none;
            border-radius: 60px;
            border: 3px solid #fff2b5;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            animation: pulse-glow 1.5s infinite;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        @keyframes pulse-glow {
            0%,
            100% {
                box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                box-shadow: 0 0 30px rgba(255, 215, 0, 0.9);
                transform: translate(-50%, -50%) scale(1.05);
            }
        }

        .tridente-decor {
            position: fixed;
            bottom: 10px;
            left: 20px;
            font-size: 40px;
            opacity: 0.2;
            z-index: 0;
            pointer-events: none;
            filter: drop-shadow(0 0 5px cyan);
        }

        /* ==================== RESPONSIVO PARA CELULAR ==================== */
        @media (max-width: 768px) {
            body {
                padding: 3px 6px;
            }

            header {
                border-radius: 30px;
                padding: 6px 10px;
                margin-bottom: 5px;
            }

            .audio-btn,
            .btn-dourado {
                padding: 6px 10px;
                font-size: 0.7rem;
            }

            #message {
                top: 55px;
                font-size: 0.8rem;
                padding: 5px 12px;
            }

            #top-row {
                flex-direction: column;
                gap: 8px;
                flex: 1;
            }

            #hangman-container {
                width: 100%;
                flex: 1.5;
                min-height: 180px;
                max-height: 45%;
                padding: 8px;
                border-radius: 20px;
            }

            #hangman-img {
                width: auto;
                height: 100%;
                max-width: 100%;
            }

            #keyboard-container {
                width: 100%;
                max-width: 100%;
                flex: 1;
                padding: 0 2px;
            }

            #keyboard {
                grid-template-columns: repeat(7, 1fr);
                gap: 8px;
            }

            .key {
                padding: 16px 0;
                font-size: 1.4rem;
                border-radius: 16px;
                border-width: 2px;
            }

            #display-section {
                padding: 8px 0 15px 0;
                margin-top: 5px;
                border-radius: 30px;
            }

            #word-display {
                font-size: 1.6rem;
                letter-spacing: 6px;
            }

            #category-info {
                font-size: 0.85rem;
            }

            footer {
                font-size: 0.6rem;
                height: 20px;
            }
        }

        @media (max-width: 400px) {
            .key {
                padding: 14px 0;
                font-size: 1.3rem;
                gap: 6px;
            }

            #keyboard {
                gap: 6px;
            }

            #hangman-container {
                min-height: 150px;
                max-height: 40%;
            }

            #word-display {
                font-size: 1.4rem;
                letter-spacing: 5px;
            }
        }
    </style>
</head>
<body>

    <div class="tridente-decor">🔱🐚</div>
    <div id="particulas-container"></div>

    <header>
        <div class="audio-controls">
            <button id="btn-voltar-dourado" class="btn-dourado" onclick="voltarParaPaginaAnterior()">⬅️⭐</button>
            <button id="fullscreen-btn" class="audio-btn" onclick="toggleFullscreen()">⛶ TELA CHEIA</button>
            <button id="bg-music-btn" class="audio-btn" onclick="toggleMusic()">🔇 MÚSICA</button>
        </div>
    </header>

    <div id="message"></div>

    <div id="game-area">
        <div id="top-row">
            <div id="hangman-container">
                <img id="hangman-img" src="forca.png" alt="Forca Submarina">
            </div>

            <div id="keyboard-container">
                <div id="keyboard"></div>
            </div>
        </div>

        <div id="display-section">
            <div id="category-info">🌊 CATEGORIA 🌊</div>
            <div id="word-display">_ _ _ _ _</div>
        </div>
    </div>

    <footer>
        🧜‍♀️ Ajude a Sereia! Clique nas letras para formar as palavras 🧜‍♂️
    </footer>

    <button id="reset-btn" onclick="nextRound()">✨ PRÓXIMA PALAVRA ✨</button>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function ensureAudioContext() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            return audioCtx;
        }

        function playAcerto() {
            try {
                const ctx = ensureAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.15);
            } catch (e) {
                console.log('audio error', e);
            }
        }

        function playErro() {
            try {
                const ctx = ensureAudioContext();
                const bufferSize = ctx.sampleRate * 0.08;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
                }
                const noise = ctx.createBufferSource();
                noise.buffer = buffer;
                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.12, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                noise.connect(gain);
                gain.connect(ctx.destination);
                noise.start(ctx.currentTime);
                noise.stop(ctx.currentTime + 0.08);
            } catch (e) {
                console.log('audio error', e);
            }
        }

        function playVitoria() {
            try {
                const ctx = ensureAudioContext();
                const notas = [523.25, 659.25, 783.99, 1046.50];
                notas.forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    const start = ctx.currentTime + i * 0.08;
                    gain.gain.setValueAtTime(0.12, start);
                    gain.gain.exponentialRampToValueAtTime(0.01, start + 0.15);
                    osc.start(start);
                    osc.stop(start + 0.15);
                });
            } catch (e) {
                console.log('audio error', e);
            }
        }

        function playSuplica() {
            try {
                const ctx = ensureAudioContext();
                const audioElement = new Audio('suplicas.mp3');
                audioElement.volume = 0.7;
                const track = ctx.createMediaElementSource(audioElement);
                track.connect(ctx.destination);
                audioElement.play().catch(e => console.log("Erro ao tocar áudio de súplicas:", e));
            } catch (e) {
                console.log('audio error', e);
            }
        }

        let bgInterval = null;
        let musicPlaying = false;

        function playBackgroundMusic() {
            if (bgInterval) return;
            try {
                const ctx = ensureAudioContext();
                let noteIndex = 0;
                const notas = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
                bgInterval = setInterval(() => {
                    if (!musicPlaying) return;
                    try {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.type = 'sine';
                        osc.frequency.value = notas[noteIndex % notas.length];
                        gain.gain.setValueAtTime(0.04, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                        osc.start(ctx.currentTime);
                        osc.stop(ctx.currentTime + 0.4);
                        noteIndex++;
                    } catch (e) {}
                }, 500);
            } catch (e) {
                console.log('bg music error', e);
            }
        }

        function stopBackgroundMusic() {
            if (bgInterval) {
                clearInterval(bgInterval);
                bgInterval = null;
            }
        }

        // ==================== BANCO DE PALAVRAS COM ACENTOS ====================
        const database = {
            "🌎 PAÍSES": ["BRASIL", "ARGENTINA", "CHILE", "MÉXICO", "CANADÁ", "ESTADOS UNIDOS", "PORTUGAL", "ESPANHA",
                "FRANÇA", "ITÁLIA"
            ],
            "🍎 FRUTAS": ["BANANA", "MAÇÃ", "LARANJA", "UVA", "MORANGO", "MELANCIA", "ABACAXI", "PÊRA", "MAMÃO",
            "LIMÃO"],
            "👨‍⚕️ PROFISSÕES": ["PROFESSOR", "MÉDICO", "DENTISTA", "POLICIAL", "BOMBEIRO", "PADEIRO", "MOTORISTA",
                "COZINHEIRO", "PINTOR", "PEDREIRO"
            ]
        };

        // Mapeamento de teclas simples para caracteres acentuados/cedilha
        const charMap = {
            'A': ['A', 'Á', 'À', 'Â', 'Ã'],
            'E': ['E', 'É', 'È', 'Ê'],
            'I': ['I', 'Í', 'Ì', 'Î'],
            'O': ['O', 'Ó', 'Ò', 'Ô', 'Õ'],
            'U': ['U', 'Ú', 'Ù', 'Û'],
            'C': ['C', 'Ç'],
            'N': ['N', 'Ñ']
        };

        function getBaseChar(char) {
            const normalized = char.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
            if (char === 'Ç' || char === 'ç') return 'C';
            return normalized;
        }

        function isAccentedOrSpecial(char) {
            return char !== getBaseChar(char) || char === 'Ç' || char === 'ç';
        }

        let wordPool = [];
        let currentWordRaw = "";
        let currentWordNormalized = "";
        let currentCategory = "";
        let guessedLetters = []; // Armazena as letras base já tentadas (A, E, I, O, U, C, etc.)
        let mistakes = 0;

        const forcaImages = [
            'forca.png',
            'forca_1.png',
            'forca_2.png',
            'forca_3.png',
            'forca_4.png',
            'forca_5.png',
            'forca_6.png'
        ];

        function gerarPilhaDePalavras() {
            wordPool = [];
            for (const category in database) {
                database[category].forEach(word => {
                    wordPool.push({
                        category: category,
                        word: word
                    });
                });
            }
            for (let i = wordPool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [wordPool[i], wordPool[j]] = [wordPool[j], wordPool[i]];
            }
        }

        function mostrarMensagemTemporaria(msg, cor) {
            const msgDiv = document.getElementById('message');
            msgDiv.innerHTML = msg;
            msgDiv.style.color = cor;
            setTimeout(() => {
                if (msgDiv.innerHTML === msg) {
                    msgDiv.innerHTML = "🐚 Escolha uma letra para ajudar a Sereia! 🐚";
                    msgDiv.style.color = "#b9e6ff";
                }
            }, 2500);
        }

        function voltarParaPaginaAnterior() {
            if (typeof confetti !== 'undefined') {
                confetti({
                    particleCount: 60,
                    spread: 60,
                    origin: {
                        y: 0.3
                    },
                    colors: ['#ffd700', '#48cae4', '#ffaa33'],
                    startVelocity: 10
                });
            }
            window.location.href = 'https://ilha-das-vogais.vercel.app/';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {});
                document.getElementById('fullscreen-btn').innerHTML = "✖ SAIR TELA";
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    document.getElementById('fullscreen-btn').innerHTML = "⛶ TELA CHEIA";
                }
            }
        }

        function normalize(str) {
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
        }

        function initGame() {
            if (wordPool.length === 0) {
                gerarPilhaDePalavras();
                setTimeout(() => {
                    mostrarMensagemTemporaria("🔄 Todas as palavras foram usadas! Reiniciando a lista...", "#ffdd99");
                }, 2600);
            }

            const palavraSorteada = wordPool.pop();
            currentCategory = palavraSorteada.category;
            currentWordRaw = palavraSorteada.word.toUpperCase();
            currentWordNormalized = normalize(currentWordRaw);
            guessedLetters = [];
            mistakes = 0;

            document.getElementById('category-info').innerHTML = "🌊 " + currentCategory + " 🌊";
            document.getElementById('reset-btn').style.display = "none";

            const imgElement = document.getElementById('hangman-img');
            imgElement.src = forcaImages[0];

            renderWord();
            renderKeyboard();

            document.getElementById('message').innerHTML = "📚 Adivinhe a palavra da categoria " + currentCategory +
                "! 📚";
            document.getElementById('message').style.color = "#b9e6ff";
        }

        function renderWord() {
            const container = document.getElementById('word-display');
            let displayStr = "";
            let allRevealed = true;

            for (let i = 0; i < currentWordRaw.length; i++) {
                const charRaw = currentWordRaw[i];
                const charNorm = currentWordNormalized[i];

                if (charRaw === " " || charRaw === "-") {
                    displayStr += charRaw === " " ? "  " : "- ";
                } else {
                    const baseChar = getBaseChar(charRaw);
                    if (guessedLetters.includes(baseChar)) {
                        // Mostra o caractere original com acento/cedilha
                        displayStr += charRaw + " ";
                    } else {
                        displayStr += "_ ";
                        allRevealed = false;
                    }
                }
            }
            container.innerText = displayStr.trimEnd();
            if (allRevealed && currentWordRaw !== "") endGame(true);
        }

        function renderKeyboard() {
            const kb = document.getElementById('keyboard');
            kb.innerHTML = "";
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('').forEach(l => {
                const b = document.createElement('button');
                b.innerText = l;
                b.className = 'key';
                b.id = 'k-' + l;
                b.onclick = () => handleGuess(l);
                // Desabilita se a letra base já foi tentada
                if (guessedLetters.includes(l)) {
                    b.disabled = true;
                }
                kb.appendChild(b);
            });
        }

        function handleGuess(letter) {
            if (guessedLetters.includes(letter) || mistakes >= 6) return;

            // Marca a letra base como tentada
            guessedLetters.push(letter);
            const keyBtn = document.getElementById('k-' + letter);
            if (keyBtn) keyBtn.disabled = true;

            // Verifica se a letra base ou qualquer variante acentuada está na palavra
            const variants = charMap[letter] || [letter];
            let found = false;

            for (let i = 0; i < currentWordRaw.length; i++) {
                const charRaw = currentWordRaw[i];
                const baseChar = getBaseChar(charRaw);

                if (baseChar === letter) {
                    found = true;
                    break;
                }
            }

            if (found) {
                playAcerto();
                renderWord();
            } else {
                mistakes++;
                playErro();
                const imgElement = document.getElementById('hangman-img');
                imgElement.src = forcaImages[mistakes];
                if (mistakes === 6) {
                    playSuplica();
                    endGame(false);
                }
            }
        }

        function endGame(win) {
            const msg = document.getElementById('message');
            if (win) {
                playVitoria();
                msg.innerHTML = "🎉 PARABÉNS! VOCÊ ACERTOU A PALAVRA! 🎉✨";
                msg.style.color = "#44ffaa";
                if (typeof confetti !== 'undefined') {
                    confetti({
                        particleCount: 100,
                        spread: 70,
                        origin: {
                            y: 0.6
                        },
                        colors: ['#ffd700', '#48cae4', '#ffaa33']
                    });
                }
            } else {
                playSuplica();
                msg.innerHTML = "😢 QUE PENA! A PALAVRA ERA: " + currentWordRaw;
                msg.style.color = "#ff8888";
                const display = document.getElementById('word-display');
                // Mostra a palavra completa com acentos
                display.innerText = currentWordRaw.split('').join(' ');
            }
            document.getElementById('reset-btn').style.display = "block";
            // Desabilita todas as teclas
            document.querySelectorAll('.key').forEach(key => key.disabled = true);
        }

        function nextRound() {
            initGame();
        }

        function toggleMusic() {
            const btn = document.getElementById('bg-music-btn');
            if (!musicPlaying) {
                musicPlaying = true;
                btn.innerHTML = "🔊 MÚSICA";
                btn.style.background = "rgba(100,200,255,0.4)";
                playBackgroundMusic();
            } else {
                musicPlaying = false;
                btn.innerHTML = "🔇 MÚSICA";
                btn.style.background = "rgba(0,0,0,0.6)";
                stopBackgroundMusic();
            }
        }

        function criarBolhasMarinhas() {
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const bolha = document.createElement('div');
                    bolha.className = 'bubble-marine';
                    const tamanho = Math.random() * 30 + 6;
                    bolha.style.width = tamanho + 'px';
                    bolha.style.height = tamanho + 'px';
                    bolha.style.left = Math.random() * 100 + '%';
                    bolha.style.animationDuration = Math.random() * 6 + 3 + 's';
                    bolha.style.animationDelay = Math.random() * 5 + 's';
                    bolha.style.opacity = Math.random() * 0.4 + 0.2;
                    document.body.appendChild(bolha);
                    setTimeout(() => bolha.remove(), 10000);
                }, i * 150);
            }
            setInterval(() => {
                const bolha = document.createElement('div');
                bolha.className = 'bubble-marine';
                const tamanho = Math.random() * 25 + 5;
                bolha.style.width = tamanho + 'px';
                bolha.style.height = tamanho + 'px';
                bolha.style.left = Math.random() * 100 + '%';
                bolha.style.animationDuration = Math.random() * 5 + 3 + 's';
                document.body.appendChild(bolha);
                setTimeout(() => bolha.remove(), 9000);
            }, 2000);
        }

        function criarConchasFlutuantes() {
            const conchasSimbolos = ['🐚', '⭐', '🌟', '🐟', '🧜‍♀️', '🔱', '🌊', '🐠', '🐙'];
            for (let i = 0; i < 10; i++) {
                const concha = document.createElement('div');
                concha.className = 'concha';
                concha.innerText = conchasSimbolos[Math.floor(Math.random() * conchasSimbolos.length)];
                concha.style.left = Math.random() * 100 + '%';
                concha.style.top = Math.random() * 100 + '%';
                concha.style.fontSize = Math.random() * 20 + 16 + 'px';
                concha.style.animationDuration = Math.random() * 12 + 8 + 's';
                concha.style.animationDelay = Math.random() * 8 + 's';
                document.body.appendChild(concha);
            }
        }

        window.onload = () => {
            criarBolhasMarinhas();
            criarConchasFlutuantes();
            gerarPilhaDePalavras();
            initGame();
            document.documentElement.requestFullscreen().catch(e => console.log(
                "fullscreen não permitido automaticamente"));
            setTimeout(() => {
                const msg = document.getElementById('message');
                msg.innerHTML = "🧜‍♀️ Bem-vinda(o) ao Reino de Netuno! 🧜‍♂️";
                msg.style.color = "#ffeaac";
            }, 500);
        };
    </script>
</body>
</html>
