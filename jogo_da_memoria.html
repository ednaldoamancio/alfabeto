<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Memória Oceânica – Alfabeto Verde</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Caveat:wght@400;700&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #0b2e1f 0%, #1a4a2e 100%);
            font-family: 'Comic Neue', 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            color: #eef5e6;
        }

        /* Container principal em duas colunas (grid lateral) */
        .game-container {
            max-width: 1400px;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            align-items: flex-start;
            justify-content: center;
        }

        /* Área do jogo (cartas) */
        .game-area {
            flex: 3;
            min-width: 280px;
            background: rgba(15, 40, 25, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 48px;
            padding: 24px 20px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,200,0.2);
            border: 1px solid #6fbf6e;
        }

        /* Painel lateral (estatísticas + controles) */
        .side-panel {
            flex: 1;
            min-width: 220px;
            background: rgba(10, 30, 18, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 20px 18px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            border: 1px solid #83c783;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        /* cabeçalho do jogo com título e tema */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 24px;
            gap: 12px;
        }
        h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #c3ffb8, #8fe388);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
            letter-spacing: -0.5px;
        }
        .btn-icon {
            background: #2e5a3a;
            border: none;
            border-radius: 60px;
            padding: 8px 14px;
            color: #f5ffdc;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .btn-icon:active { transform: scale(0.96); }

        /* info lateral */
        .stat-card {
            background: #0f2f1c;
            border-radius: 28px;
            padding: 15px;
            text-align: center;
            border-left: 6px solid #78d678;
        }
        .stat-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            color: #bde5b0;
        }
        .stat-value {
            font-size: 2.4rem;
            font-weight: 800;
            line-height: 1;
            color: #f7ffcf;
            margin: 8px 0;
        }
        .badge-min {
            font-size: 1rem;
            background: #1c412b;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 40px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .control-title {
            font-weight: bold;
            font-size: 1rem;
            border-bottom: 2px solid #6fbf6e;
            display: inline-block;
            margin-bottom: 8px;
        }
        .mode-buttons, .amount-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .mode-btn, .qty-btn {
            background: #1f4632;
            border: none;
            padding: 8px 12px;
            border-radius: 40px;
            font-weight: bold;
            color: #e2ffe2;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.8rem;
        }
        .mode-btn.active, .qty-btn.active {
            background: #68bc6e;
            color: #0a2a14;
            box-shadow: 0 0 8px #b0ffa0;
        }
        .mode-btn:active, .qty-btn:active { transform: scale(0.96); }

        /* Grid das cartas */
        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            justify-items: center;
            align-items: center;
        }
        @media (max-width: 550px) {
            .game-board { gap: 8px; }
        }

        .memory-card {
            aspect-ratio: 1 / 1.1;
            width: 100%;
            max-width: 110px;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border-radius: 20px;
        }
        .memory-card.flip { transform: rotateY(180deg); }

        .front-face, .back-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            box-shadow: 0 8px 14px rgba(0,0,0,0.3);
            background: #fef9e6;
            border: 2px solid #6fbf6e;
        }
        .front-face {
            transform: rotateY(180deg);
            background: #fffdf0;
            color: #1d6b2b;
            font-size: 2.4rem;
        }
        .back-face {
            background: radial-gradient(circle at 30% 20%, #3d9e5a, #1c6e3a);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ffffff40" width="28px" height="28px"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 40px;
            font-size: 2rem;
        }
        /* Estilos para letras de forma / cursiva */
        .cursive-upper .front-face { font-family: 'Dancing Script', cursive; text-transform: uppercase; }
        .cursive-lower .front-face { font-family: 'Caveat', cursive; text-transform: lowercase; }
        .form-upper .front-face { font-family: 'Comic Neue', sans-serif; text-transform: uppercase; font-weight: 700; }
        .form-lower .front-face { font-family: 'Comic Neue', sans-serif; text-transform: lowercase; font-weight: 700; }

        .win-message {
            margin-top: 25px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            background: #64b96eaa;
            backdrop-filter: blur(10px);
            padding: 12px;
            border-radius: 40px;
            display: none;
            animation: fadeUp 0.5s;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px);}
            to { opacity: 1; transform: translateY(0);}
        }

        .restart-btn {
            background: #ffcd7e;
            border: none;
            color: #2a572a;
            font-weight: bold;
            padding: 12px 20px;
            border-radius: 60px;
            width: 100%;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
            margin-top: 10px;
        }
        .restart-btn:active { transform: scale(0.97);}
        footer { font-size: 0.7rem; text-align: center; margin-top: 15px; opacity: 0.7; }

        /* Troféu e confetes */
        .trophy-badge {
            font-size: 2rem;
            filter: drop-shadow(0 0 6px gold);
            display: inline-block;
            margin-left: 8px;
        }
        canvas#confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2000;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
</head>
<body>
<div class="game-container">
    <!-- Área principal do jogo -->
    <div class="game-area">
        <div class="game-header">
            <h1>🌊 MEMÓRIA OCEÂNICA</h1>
            <button class="btn-icon" id="themeAudioBtn">🔊 Sons Ativos</button>
        </div>
        <div class="game-board" id="gameBoard"></div>
        <div class="win-message" id="winMessage"></div>
        <button class="restart-btn" id="restartGameBtn">🐠 NOVA PARTIDA 🐠</button>
        <footer>🐚 encontre os pares com o menor número de toques!</footer>
    </div>

    <!-- Painel lateral com estatísticas e controles -->
    <div class="side-panel">
        <div class="stat-card">
            <div class="stat-label">🎯 TOQUES USADOS</div>
            <div class="stat-value" id="tapCounter">0</div>
            <div class="stat-label">⚡ MÍNIMO POSSÍVEL</div>
            <div class="stat-value" id="minTapsDisplay">0</div>
            <div class="badge-min" id="bestHint">✨ desafio: iguale o mínimo!</div>
        </div>

        <div class="control-group">
            <div class="control-title">✍️ ESTILO DAS LETRAS</div>
            <div class="mode-buttons" id="styleButtons">
                <button data-style="form-upper" class="mode-btn active">🔠 MAIÚSCULA (fôrma)</button>
                <button data-style="form-lower" class="mode-btn">🔡 MINÚSCULA (fôrma)</button>
                <button data-style="cursive-upper" class="mode-btn">🖌️ CURSIVA MAIÚSCULA</button>
                <button data-style="cursive-lower" class="mode-btn">✍️ CURSIVA MINÚSCULA</button>
            </div>
        </div>

        <div class="control-group">
            <div class="control-title">🐟 QUANTIDADE DE PARES</div>
            <div class="amount-buttons" id="qtyButtons">
                <button data-pairs="8" class="qty-btn">16 cartas (8 pares)</button>
                <button data-pairs="10" class="qty-btn">20 cartas (10 pares)</button>
                <button data-pairs="12" class="qty-btn active">24 cartas (12 pares)</button>
            </div>
        </div>
        <div class="control-group">
            <div class="control-title">🔊 DICAS</div>
            <p style="font-size: 0.8rem; opacity: 0.9;">⭐ Clique nas cartas → escute a letra<br>🎉 Toque mínimo = 2x nº de pares</p>
        </div>
    </div>
</div>
<canvas id="confetti-canvas"></canvas>

<script>
    (function(){
        // ---------- CONFIGURAÇÕES ----------
        let currentPairs = 12;            // 8,10,12 pares
        let currentStyle = "form-upper";  // form-upper, form-lower, cursive-upper, cursive-lower
        let totalTaps = 0;                // contador de toques (cliques em cartas não resolvidas)
        let minPossibleTaps = 0;
        let gameActive = true;
        let blockBoard = false;
        let firstCard = null, secondCard = null;
        let matchedPairs = 0;
        let cardsArray = [];         // objetos { element, letterValue, pairId }
        let letterList = [];          // letras base (A,B,C...)
        let soundEnabled = true;
        
        // Elementos DOM
        const boardEl = document.getElementById("gameBoard");
        const tapCounterSpan = document.getElementById("tapCounter");
        const minTapsSpan = document.getElementById("minTapsDisplay");
        const winMsgDiv = document.getElementById("winMessage");
        const restartBtn = document.getElementById("restartGameBtn");
        const styleBtns = document.querySelectorAll("[data-style]");
        const qtyBtns = document.querySelectorAll("[data-pairs]");
        const audioToggleBtn = document.getElementById("themeAudioBtn");
        
        // ---------- FUNÇÕES SONORAS (Web Audio + Síntese) ----------
        let audioCtx = null;
        function initAudioContext() {
            if (!audioCtx && soundEnabled) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        function playBeep(type) {
            if (!soundEnabled) return;
            try {
                initAudioContext();
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = "sine";
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
                if (type === "match") {
                    osc.frequency.value = 880;
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
                } else if (type === "mismatch") {
                    osc.frequency.value = 440;
                    osc.frequency.exponentialRampToValueAtTime(220, now + 0.3);
                } else if (type === "flip") {
                    osc.frequency.value = 680;
                    osc.frequency.exponentialRampToValueAtTime(520, now + 0.15);
                } else if (type === "win") {
                    osc.frequency.value = 660;
                    osc.frequency.setValueAtTime(880, now+0.1);
                    osc.frequency.setValueAtTime(1046, now+0.25);
                    gain.gain.setValueAtTime(0.25, now);
                }
                osc.start();
                osc.stop(now + 0.4);
            } catch(e) { console.warn("audio error", e); }
        }

        // Fala a letra usando SpeechSynthesis
        function speakLetter(letter) {
            if (!soundEnabled) return;
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(letter);
            utterance.lang = 'pt-BR';
            utterance.rate = 0.85;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        // Tocar fanfarra de vitória simples
        function playVictoryFanfare() {
            if (!soundEnabled) return;
            try {
                initAudioContext();
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, now + idx*0.12);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + idx*0.12 + 0.6);
                    osc.start(now + idx*0.12);
                    osc.stop(now + idx*0.12 + 0.5);
                });
            } catch(e) {}
        }

        // ---------- LÓGICA DO JOGO DA MEMÓRIA ----------
        function updateMinTaps() {
            minPossibleTaps = currentPairs * 2;  // cada par exige 2 cliques no mínimo
            minTapsSpan.innerText = minPossibleTaps;
        }

        function updateTapCounterUI() {
            tapCounterSpan.innerText = totalTaps;
        }

        // reinicia completamente o jogo com as configurações atuais
        function resetAndRestart() {
            // limpa timeouts
            if (window._resetTimeout) clearTimeout(window._resetTimeout);
            blockBoard = false;
            gameActive = true;
            matchedPairs = 0;
            totalTaps = 0;
            updateTapCounterUI();
            winMsgDiv.style.display = "none";
            winMsgDiv.innerHTML = "";
            if (firstCard) { 
                // remove eventos/classes pendentes
                if (firstCard && firstCard.classList) firstCard.classList.remove('flip');
                if (secondCard && secondCard.classList) secondCard.classList.remove('flip');
            }
            firstCard = null;
            secondCard = null;
            // gera novo baralho
            generateLetterSet();
            createBoard();
        }

        function generateLetterSet() {
            // define quantas letras diferentes (pares)
            const totalPairs = currentPairs;
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
            letterList = alphabet.slice(0, totalPairs);
            // letterList ex: para 12 pares -> A a L
        }

        // transforma letra conforme estilo selecionado
        function getDisplayLetter(letter, style) {
            let result = letter;
            if (style === "form-lower") result = letter.toLowerCase();
            else if (style === "cursive-lower") result = letter.toLowerCase();
            else if (style === "form-upper") result = letter.toUpperCase();
            else if (style === "cursive-upper") result = letter.toUpperCase();
            return result;
        }

        function createBoard() {
            boardEl.innerHTML = "";
            // criar array com pares
            let deck = [];
            letterList.forEach((letter, idx) => {
                deck.push({ pairId: idx, letter: letter });
                deck.push({ pairId: idx, letter: letter });
            });
            // embaralhar
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
            cardsArray = [];
            deck.forEach((item, pos) => {
                const cardDiv = document.createElement("div");
                cardDiv.classList.add("memory-card");
                // aplica classe de estilo global no container? Melhor aplicar classe no elemento pai do board
                cardDiv.dataset.letter = item.letter;
                cardDiv.dataset.pairId = item.pairId;
                const displayChar = getDisplayLetter(item.letter, currentStyle);
                cardDiv.innerHTML = `
                    <div class="front-face">${displayChar}</div>
                    <div class="back-face">🐟</div>
                `;
                cardDiv.addEventListener("click", () => onCardClick(cardDiv));
                boardEl.appendChild(cardDiv);
                cardsArray.push({
                    element: cardDiv,
                    letter: item.letter,
                    pairId: item.pairId,
                    matched: false
                });
            });
            // adiciona classe de estilo ao board para fontes (auxílio visual)
            boardEl.className = `game-board ${currentStyle}`;
        }

        function onCardClick(card) {
            if (!gameActive) return;
            if (blockBoard) return;
            // se a carta já está virada ou já foi combinada (matched)
            if (card.classList.contains('flip')) return;
            const cardData = cardsArray.find(c => c.element === card);
            if (cardData.matched) return;

            // contabiliza toque (clique válido)
            totalTaps++;
            updateTapCounterUI();
            playBeep("flip");
            speakLetter(getDisplayLetter(cardData.letter, currentStyle));
            
            // vira carta
            card.classList.add('flip');
            
            if (firstCard === null) {
                firstCard = card;
                return;
            }
            if (secondCard === null && firstCard !== card) {
                secondCard = card;
                checkMatch();
            }
        }

        function checkMatch() {
            const firstData = cardsArray.find(c => c.element === firstCard);
            const secondData = cardsArray.find(c => c.element === secondCard);
            const isMatch = (firstData.pairId === secondData.pairId);
            
            if (isMatch) {
                // acerto
                playBeep("match");
                firstData.matched = true;
                secondData.matched = true;
                matchedPairs++;
                // remove evento de clique (opcional mas seguro)
                firstCard.style.pointerEvents = "none";
                secondCard.style.pointerEvents = "none";
                clearSelection();
                if (matchedPairs === currentPairs) {
                    endGameVictory();
                }
            } else {
                // erro
                playBeep("mismatch");
                blockBoard = true;
                setTimeout(() => {
                    firstCard.classList.remove('flip');
                    secondCard.classList.remove('flip');
                    clearSelection();
                    blockBoard = false;
                }, 700);
            }
        }
        
        function clearSelection() {
            firstCard = null;
            secondCard = null;
        }
        
        function endGameVictory() {
            gameActive = false;
            blockBoard = true;
            const perfectWin = (totalTaps === minPossibleTaps);
            // mensagem personalizada
            let trophyHtml = "";
            if (perfectWin) {
                trophyHtml = '<span class="trophy-badge">🏆✨ PERFEITO! ✨🏆</span>';
                playVictoryFanfare();
                // fogos + troféu maior
                canvasConfetti({ particleCount: 180, spread: 100, origin: { y: 0.6 }, colors: ['#2ecc71', '#f1c40f', '#e67e22'] });
                canvasConfetti({ particleCount: 100, spread: 70, origin: { y: 0.4, x: 0.3 }, startVelocity: 20 });
                canvasConfetti({ particleCount: 100, spread: 70, origin: { y: 0.4, x: 0.7 }, startVelocity: 20 });
                setTimeout(() => {
                    canvasConfetti({ particleCount: 300, spread: 120, origin: { y: 0.5 }, startVelocity: 25, colors: ['#ffd966', '#ffb347', '#2ecc71'] });
                }, 200);
                speakLetter("Parabéns! Desempenho perfeito! Você é um mestre da memória!");
            } else {
                canvasConfetti({ particleCount: 120, spread: 70, origin: { y: 0.6 }, colors: ['#7fe07f', '#ffd966'] });
                speakLetter("Muito bem! Você completou o jogo!");
                playVictoryFanfare();
            }
            const msg = perfectWin ? 
                `🎉 VITÓRIA PERFEITA! 🎉<br> Você usou ${totalTaps} toques (MÍNIMO = ${minPossibleTaps})! 🌟` : 
                `🐠 Parabéns! Você completou em ${totalTaps} toques.<br> O mínimo possível é ${minPossibleTaps}. Tente superar! 🐟`;
            winMsgDiv.innerHTML = `${msg} ${trophyHtml} <div style="margin-top:8px;">💪 continue treinando!</div>`;
            winMsgDiv.style.display = "block";
        }
        
        // ---------- CONFIGURAÇÕES DINÂMICAS ----------
        function setPairs(pairs) {
            currentPairs = pairs;
            updateMinTaps();
            resetAndRestart();
        }
        
        function setStyle(style) {
            currentStyle = style;
            // atualiza classe global no board
            boardEl.className = `game-board ${currentStyle}`;
            // recria todas as cartas com novo estilo (atualiza texto)
            if (cardsArray.length) {
                // atualiza o front-face de cada carta existente
                cardsArray.forEach(cardData => {
                    if (!cardData.element) return;
                    const frontDiv = cardData.element.querySelector(".front-face");
                    if (frontDiv) {
                        const newDisplay = getDisplayLetter(cardData.letter, currentStyle);
                        frontDiv.innerText = newDisplay;
                    }
                });
            } else {
                resetAndRestart();
            }
        }
        
        // reiniciar completamente com estilo e quantidade atuais
        function fullReset() {
            resetAndRestart();
        }
        
        // ativar/desativar sons
        function toggleSound() {
            soundEnabled = !soundEnabled;
            audioToggleBtn.innerText = soundEnabled ? "🔊 Sons Ativos" : "🔇 Sons Desligados";
            if (soundEnabled && audioCtx && audioCtx.state === "suspended") {
                audioCtx.resume();
            }
            if (!soundEnabled && audioCtx) {
                audioCtx.suspend();
            }
        }
        
        // Inicializar eventos UI
        function bindEvents() {
            restartBtn.addEventListener("click", () => fullReset());
            styleBtns.forEach(btn => {
                btn.addEventListener("click", () => {
                    const style = btn.dataset.style;
                    styleBtns.forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    setStyle(style);
                });
            });
            qtyBtns.forEach(btn => {
                btn.addEventListener("click", () => {
                    const pairs = parseInt(btn.dataset.pairs, 10);
                    qtyBtns.forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    setPairs(pairs);
                });
            });
            audioToggleBtn.addEventListener("click", () => {
                toggleSound();
            });
            // pré-inicializa contexto de áudio no primeiro toque em qualquer lugar (política de navegador)
            document.body.addEventListener("click", () => {
                if (soundEnabled && audioCtx && audioCtx.state === "suspended") {
                    audioCtx.resume();
                }
            }, { once: true });
        }
        
        // início
        function init() {
            // padrão: 12 pares (24 cartas) / estilo maiúscula forma ativo
            currentPairs = 12;
            currentStyle = "form-upper";
            updateMinTaps();
            generateLetterSet();
            createBoard();
            bindEvents();
            // marcar botão ativo inicial
            document.querySelector("[data-pairs='12']").classList.add("active");
            document.querySelector("[data-style='form-upper']").classList.add("active");
            audioCtx = null;
            soundEnabled = true;
            audioToggleBtn.innerText = "🔊 Sons Ativos";
        }
        
        init();
    })();
</script>
</body>
</html>
