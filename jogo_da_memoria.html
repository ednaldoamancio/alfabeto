<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Memória Oceânica – Movimento Suave dos Peixes</title>

<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700;900&family=Playwrite+BR+Guides&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:linear-gradient(160deg,#005f73 0%,#0a9396 100%);
    font-family:'Comic Neue','Segoe UI',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    position:relative;
    color:#ffffff;
    overflow-x:hidden;
}

body::after{
    content:"";
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:120px;
    background:radial-gradient(circle at 50% 120%, #ee9b00 0%, transparent 70%);
    opacity:0.4;
    z-index:-1;
}

.bubble{
    position:fixed;
    bottom:-50px;
    background:radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(150,220,255,0.2) 70%);
    border-radius:50%;
    pointer-events:none;
    z-index:0;
    animation:riseBubbles linear infinite;
}

@keyframes riseBubbles{
    0%{ transform:translateY(0) scale(0.3); opacity:0; }
    10%{ opacity:0.7; }
    100%{ transform:translateY(-120vh) scale(1.3); opacity:0; }
}

.game-container{
    max-width:1400px;
    width:100%;
    display:flex;
    flex-wrap:wrap;
    gap:25px;
    align-items:flex-start;
    justify-content:center;
    position:relative;
    z-index:2;
}

.game-area{
    flex:3;
    min-width:280px;
    background:rgba(0,21,36,0.4);
    backdrop-filter:blur(10px);
    border-radius:32px;
    padding:25px;
    box-shadow:0 15px 35px rgba(0,0,0,0.3);
    border:3px solid #94d2bd;
}

.side-panel{
    flex:1;
    min-width:260px;
    background:rgba(0,95,115,0.85);
    backdrop-filter:blur(10px);
    border-radius:32px;
    padding:25px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    border:3px solid #ee9b00;
    display:flex;
    flex-direction:column;
    gap:20px;
}

.game-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    margin-bottom:20px;
    gap:15px;
    border-bottom:2px solid rgba(255,255,255,0.15);
    padding-bottom:15px;
}

h1{
    font-size:2rem;
    font-weight:900;
    color:#e9d8a6;
    text-shadow:2px 2px 0px rgba(0,0,0,0.4);
}

.btn-icon{
    background:#ee9b00;
    border:none;
    border-radius:50px;
    padding:10px 18px;
    color:#002124;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
    font-size:0.95rem;
    box-shadow:0 4px 0px #bb7900;
}
.btn-icon:active{ transform:translateY(2px); box-shadow:0 2px 0px #bb7900; }
.btn-back-home{
    background:#e9d8a6;
    color:#005f73;
    text-decoration:none;
    text-align:center;
    font-weight:900;
    padding:12px;
    border-radius:50px;
    font-size:1rem;
    box-shadow:0 4px 0px #b5a478;
    transition:0.2s;
    display:block;
}
.btn-back-home:active{ transform:translateY(2px); box-shadow:0 2px 0px #b5a478; }

.stat-card{
    background:rgba(0,0,0,0.2);
    border-radius:20px;
    padding:15px;
    text-align:center;
    border-bottom:4px solid #ee9b00;
}
.stat-label{ font-size:0.85rem; font-weight:700; color:#94d2bd; letter-spacing:1px; }
.stat-value{ font-size:2.6rem; font-weight:900; color:#ffffff; margin:5px 0; }
.badge-min{ font-size:0.85rem; background:rgba(255,255,255,0.15); display:inline-block; padding:4px 12px; border-radius:40px; color:#e9d8a6; font-weight:700; }

.control-group{ display:flex; flex-direction:column; gap:10px; }
.control-title{ font-weight:900; font-size:1.05rem; color:#ffffff; display:flex; align-items:center; gap:6px; }
.mode-buttons, .amount-buttons{ display:flex; flex-wrap:wrap; gap:8px; }
.mode-btn, .qty-btn{
    background:rgba(0,0,0,0.2);
    border:2px solid transparent;
    padding:10px;
    border-radius:20px;
    font-weight:700;
    color:#ffffff;
    cursor:pointer;
    transition:0.2s;
    font-size:0.85rem;
    flex:1 1 calc(50% - 8px);
    text-align:center;
}
.mode-btn.active, .qty-btn.active{
    background:#00cbd6;
    color:#002124;
    font-weight:900;
    border-color:#ffffff;
    box-shadow:0 0 10px rgba(0,203,214,0.5);
}

.game-board{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    margin-bottom:20px;
}
@media (max-width:600px){
    .game-board{ gap:10px; }
    h1{ font-size:1.5rem; }
}

.memory-card{
    aspect-ratio:1 / 1.2;
    width:100%;
    max-width:120px;
    cursor:pointer;
    position:relative;
    transform-style:preserve-3d;
    transition:transform 0.4s cubic-bezier(0.175,0.885,0.32,1.15);
}
.memory-card.flip{ transform:rotateY(180deg); }
.front-face, .back-face{
    position:absolute;
    width:100%;
    height:100%;
    backface-visibility:hidden;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:4px solid #7fdcff;
    box-shadow:0 6px 12px rgba(0,0,0,0.25);
}
.front-face{
    transform:rotateY(180deg);
    background: linear-gradient(145deg, #1e6091, #0b3b4f);
    color:#ffffff;
    font-size:3.2rem;
    font-weight:900;
    text-align:center;
}
.cursive-upper .front-face{
    font-family:'Playwrite BR Guides',cursive;
    text-transform:uppercase;
    font-size:3.4rem;
    letter-spacing:2px;
}
.cursive-lower .front-face{
    font-family:'Playwrite BR Guides',cursive;
    text-transform:lowercase;
    font-size:3.8rem;
}
.form-upper .front-face{
    font-family:'Comic Neue',sans-serif;
    text-transform:uppercase;
}
.form-lower .front-face{
    font-family:'Comic Neue',sans-serif;
    text-transform:lowercase;
}

/* ===== MOVIMENTO DOS PEIXES - VERSÃO SUAVE, LENTA E SUTIL ===== */
.back-face {
    background: linear-gradient(135deg, #184e68 0%, #0a5e6b 100%);
    border-color:#ffffff;
    overflow: hidden;
    position: relative;
}

/* Peixe principal - balanço calmo e suave */
.back-face::before {
    content: "🐟";
    font-size: 2.8rem;
    position: absolute;
    animation: fishGentleSway 6s ease-in-out infinite;
    filter: drop-shadow(2px 3px 4px rgba(0,0,0,0.2));
    opacity: 0.85;
}

/* Peixinho secundário - movimento ainda mais sutil */
.back-face::after {
    content: "🐠";
    font-size: 1.5rem;
    position: absolute;
    animation: smallFishGentle 7s ease-in-out infinite;
    opacity: 0.8;
}

/* Animação suave principal */
@keyframes fishGentleSway {
    0% { transform: translate(-5%, -8%) rotate(-2deg); }
    25% { transform: translate(3%, -3%) rotate(1deg); }
    50% { transform: translate(8%, 2%) rotate(2deg); }
    75% { transform: translate(0%, 5%) rotate(0deg); }
    100% { transform: translate(-5%, -8%) rotate(-2deg); }
}

/* Peixe pequeno com movimento discreto */
@keyframes smallFishGentle {
    0% { transform: translate(8%, 15%) rotate(3deg); }
    33% { transform: translate(2%, 10%) rotate(1deg); }
    66% { transform: translate(-3%, 12%) rotate(-1deg); }
    100% { transform: translate(8%, 15%) rotate(3deg); }
}

.back-face {
    transition: box-shadow 0.3s ease;
}

.memory-card:hover .back-face {
    box-shadow: inset 0 0 12px rgba(255,245,200,0.3);
}

/* Efeito de comemoração suave */
@keyframes celebrateSoft {
    0% { box-shadow: 0 0 0 0 rgba(255,215,0,0.5); border-color: #ffd700; transform: scale(1);}
    50% { box-shadow: 0 0 0 10px rgba(255,215,0,0); border-color: #ffcc55; transform: scale(1.01);}
    100% { box-shadow: 0 0 0 0 rgba(255,215,0,0); border-color: #7fdcff; transform: scale(1);}
}
.memory-card.win-celebrate .front-face,
.memory-card.win-celebrate .back-face {
    animation: celebrateSoft 0.7s ease-in-out 2;
}
.memory-card.win-celebrate .back-face::before,
.memory-card.win-celebrate .back-face::after {
    animation-duration: 5s;
}

.win-message{
    margin-top:20px;
    text-align:center;
    font-size:1.4rem;
    font-weight:900;
    color:#ffffff;
    background:#1b4332;
    padding:20px;
    border-radius:25px;
    display:none;
    border:3px solid #52b788;
    box-shadow:0 10px 20px rgba(0,0,0,0.3);
    position:relative;
    z-index:10;
    animation: messageSoftGlow 0.8s ease-out;
}
@keyframes messageSoftGlow {
    0% { transform: scale(0.96); opacity: 0; }
    50% { transform: scale(1.02); background: #2d6a4f; border-color: #ffd966; }
    100% { transform: scale(1); opacity: 1; }
}

.restart-btn{
    background:#ee9b00;
    border:none;
    color:#002124;
    font-weight:900;
    padding:15px;
    border-radius:50px;
    width:100%;
    cursor:pointer;
    font-size:1.2rem;
    transition:0.2s;
    margin-top:10px;
    box-shadow:0 5px 0px #bb7900;
}
.restart-btn:active{ transform:translateY(3px); box-shadow:0 2px 0px #bb7900; }
footer{ font-size:0.8rem; text-align:center; margin-top:15px; opacity:0.8; color:#94d2bd; }
.trophy-badge{ font-size:2rem; display:inline-block; margin-left:5px; animation: trophyGentle 1s ease infinite; }
@keyframes trophyGentle {
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-4px); }
}

canvas#confetti-canvas{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:2000;
}

/* Botões de acessibilidade e fullscreen */
.accessibility-control {
    margin-top: 15px;
    background: rgba(0,0,0,0.3);
    border-radius: 30px;
    padding: 8px;
    text-align: center;
    display: flex;
    gap: 8px;
    justify-content: center;
}
.toggle-animations, .fullscreen-btn {
    background: #94d2bd;
    border: none;
    padding: 8px 12px;
    border-radius: 40px;
    font-weight: bold;
    color: #002124;
    cursor: pointer;
    font-size: 0.8rem;
    transition: 0.2s;
}
.toggle-animations:active, .fullscreen-btn:active {
    transform: scale(0.96);
}
</style>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
</head>
<body>
<div id="bubble-container" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1; overflow:hidden;"></div>
<div class="game-container">
<div class="game-area">
<div class="game-header">
<h1>🌊 MEMÓRIA OCEÂNICA 🌊</h1>
<button class="btn-icon" id="themeAudioBtn">🐟 MOVIMENTO SUAVE</button>
</div>
<div class="game-board" id="gameBoard"></div>
<div class="win-message" id="winMessage"></div>
<button class="restart-btn" id="restartGameBtn">🐚 NOVA PARTIDA 🐚</button>
<footer>✨ Peixes se movem de forma calma e suave. Jogo pensado para todos! ✨</footer>
</div>
<div class="side-panel">
<a href="https://alfabeto-mu.vercel.app/" class="btn-back-home">⚓ VOLTAR AO INÍCIO</a>
<div class="stat-card">
<div class="stat-label">🎯 TOQUES USADOS</div>
<div class="stat-value" id="tapCounter">0</div>
<div class="stat-label">⚡ MÍNIMO JUSTO</div>
<div class="stat-value" id="minTapsDisplay">0</div>
<div class="badge-min" id="bestHint">🐠 Mínimo: visualize + combine</div>
</div>
<div class="control-group">
<div class="control-title">✍️ TIPO DE LETRA</div>
<div class="mode-buttons" id="styleButtons">
<button data-style="form-upper" class="mode-btn active">MAIÚSCULA</button>
<button data-style="form-lower" class="mode-btn">minúscula</button>
<button data-style="cursive-upper" class="mode-btn">CURSIVA M.</button>
<button data-style="cursive-lower" class="mode-btn">cursiva m.</button>
</div>
</div>
<div class="control-group">
<div class="control-title">🐟 CARTAS</div>
<div class="amount-buttons" id="qtyButtons">
<button data-pairs="8" class="qty-btn active">16 Cartas</button>
<button data-pairs="10" class="qty-btn">20 Cartas</button>
<button data-pairs="12" class="qty-btn">24 Cartas</button>
</div>
</div>
<div class="accessibility-control">
<button id="toggleAnimationsBtn" class="toggle-animations">🐙 Desativar Movimento</button>
<button id="fullscreenBtn" class="fullscreen-btn">🖥️ Tela Cheia</button>
</div>
</div>
</div>
<canvas id="confetti-canvas"></canvas>

<script>
(function(){
    // ===== ÁUDIO DE APLAUSOS =====
    let applauseAudio = null;
    try {
        applauseAudio = new Audio('aplause.mp3');
        applauseAudio.preload = 'auto';
        // Configura para tocar assim que possível
        if(applauseAudio) {
            applauseAudio.volume = 0.8;
        }
    } catch(e) {
        console.log("Áudio não pôde ser carregado:", e);
    }
    
    // Função para tocar aplausos
    function playApplause() {
        if(applauseAudio) {
            // Reinicia o áudio se já estiver tocando
            applauseAudio.currentTime = 0;
            applauseAudio.play().catch(e => console.log("Áudio bloqueado pelo navegador:", e));
        }
    }
    
    // Cálculo do mínimo justo
    function calcularMinimoJusto(pairs) {
        const totalCards = pairs * 2;
        return totalCards + pairs;
    }
    
    let currentPairs = 8;
    let currentStyle = "form-upper";
    let totalTaps = 0;
    let minPossibleTaps = calcularMinimoJusto(currentPairs);
    
    let gameActive = true;
    let blockBoard = false;
    let firstCard = null;
    let secondCard = null;
    let matchedPairs = 0;
    let cardsArray = [];
    let letterList = [];
    let gameFinished = false;
    let animationsEnabled = true;
    
    const boardEl = document.getElementById("gameBoard");
    const tapCounterSpan = document.getElementById("tapCounter");
    const minTapsSpan = document.getElementById("minTapsDisplay");
    const winMsgDiv = document.getElementById("winMessage");
    const restartBtn = document.getElementById("restartGameBtn");
    const styleBtns = document.querySelectorAll("[data-style]");
    const qtyBtns = document.querySelectorAll("[data-pairs]");
    const toggleBtn = document.getElementById("toggleAnimationsBtn");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    
    // ===== FUNÇÃO DE TELA CHEIA =====
    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.log(`Erro ao entrar em tela cheia: ${err.message}`);
            });
        } else {
            document.exitFullscreen();
        }
    }
    
    // Evento do botão fullscreen
    if(fullscreenBtn) {
        fullscreenBtn.addEventListener("click", toggleFullscreen);
    }
    
    // Função para controlar animações (acessibilidade)
    function setAnimationsEnabled(enabled) {
        animationsEnabled = enabled;
        if (enabled) {
            document.body.classList.remove("no-fish-animation");
            if(toggleBtn) toggleBtn.textContent = "🐙 Desativar Movimento";
        } else {
            document.body.classList.add("no-fish-animation");
            if(toggleBtn) toggleBtn.textContent = "🐟 Ativar Movimento Suave";
        }
    }
    
    // CSS dinâmico para desabilitar animações
    const disableAnimStyle = document.createElement('style');
    disableAnimStyle.textContent = `
        body.no-fish-animation .back-face::before,
        body.no-fish-animation .back-face::after {
            animation: none !important;
            transform: translate(0, 0) !important;
        }
        body.no-fish-animation .memory-card.win-celebrate .front-face,
        body.no-fish-animation .memory-card.win-celebrate .back-face {
            animation: none !important;
        }
        body.no-fish-animation .trophy-badge {
            animation: none !important;
        }
    `;
    document.head.appendChild(disableAnimStyle);
    
    function createBubbles(){
        const bubbleContainer = document.getElementById("bubble-container");
        setInterval(()=>{
            if(document.hidden) return;
            const bubble = document.createElement("div");
            bubble.classList.add("bubble");
            const size = Math.random()*30 + 15;
            bubble.style.width = size + "px";
            bubble.style.height = size + "px";
            bubble.style.left = Math.random()*100 + "%";
            bubble.style.animationDuration = Math.random()*5 + 4 + "s";
            bubbleContainer.appendChild(bubble);
            setTimeout(()=>{ bubble.remove(); },7000);
        },1000);
    }
    createBubbles();
    
    function updateMinTapsDisplay(){
        minPossibleTaps = calcularMinimoJusto(currentPairs);
        minTapsSpan.innerText = minPossibleTaps;
        const badgeHint = document.getElementById("bestHint");
        if(badgeHint) badgeHint.innerHTML = `🐠 Mínimo: ${minPossibleTaps} toques (ver + combinar)`;
    }
    
    function generateLetterSet(){
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
        letterList = alphabet.slice(0, currentPairs);
    }
    
    function getDisplayLetter(letter, style){
        if(style.includes("lower")) return letter.toLowerCase();
        return letter.toUpperCase();
    }
    
    function triggerConfettiCelebration(){
        if(typeof canvasConfetti !== "function") return;
        canvasConfetti({ particleCount: 180, spread: 90, origin: { y: 0.6 }, startVelocity: 20, colors: ['#ffd700', '#ffaa33', '#0a9396', '#ee9b00'] });
        canvasConfetti({ particleCount: 100, spread: 60, origin: { y: 0.5, x: 0.2 }, startVelocity: 24 });
        canvasConfetti({ particleCount: 100, spread: 60, origin: { y: 0.5, x: 0.8 }, startVelocity: 24 });
        setTimeout(() => {
            canvasConfetti({ particleCount: 250, spread: 110, origin: { y: 0.7 }, decay: 0.9 });
        }, 200);
        setTimeout(() => {
            canvasConfetti({ particleCount: 60, spread: 45, origin: { y: 0.4, x: 0.5 } });
        }, 400);
    }
    
    function animateCardsCelebration(){
        if(!animationsEnabled) return;
        const allCards = document.querySelectorAll(".memory-card");
        allCards.forEach((card, idx) => {
            setTimeout(() => {
                card.classList.add("win-celebrate");
                setTimeout(() => {
                    card.classList.remove("win-celebrate");
                }, 700);
            }, idx * 30);
        });
    }
    
    function showVictoryMessage(){
        const perfectWin = (totalTaps === minPossibleTaps);
        let msg = perfectWin 
            ? `🏆✨ VITÓRIA ESPECIAL! ✨🏆<br>${totalTaps} toques (mínimo ${minPossibleTaps})!<span class="trophy-badge">🐟🌟</span><br>Memória brilhante! 👏`
            : `🎉🐙 PARABÉNS! VOCÊ VENCEU! 🐙🎉<br>Toques: ${totalTaps}  |  Mínimo: ${minPossibleTaps}<br>🐠 Os peixes nadaram felizes! 👏🎉`;
        winMsgDiv.innerHTML = msg;
        winMsgDiv.style.display = "block";
        winMsgDiv.style.animation = "none";
        setTimeout(() => { winMsgDiv.style.animation = "messageSoftGlow 0.6s ease-out"; }, 10);
    }
    
    function celebrateVictory(){
        if(gameFinished) return;
        gameFinished = true;
        gameActive = false;
        
        // === FOGOS E APLAUSOS JUNTOS ===
        triggerConfettiCelebration();
        animateCardsCelebration();
        showVictoryMessage();
        playApplause();  // Toca o som de aplausos
        
        const themeBtn = document.getElementById("themeAudioBtn");
        if(themeBtn) {
            themeBtn.style.transform = "scale(1.1)";
            setTimeout(()=> themeBtn.style.transform = "", 300);
        }
    }
    
    function checkGameCompletion(){
        if(matchedPairs === currentPairs && !gameFinished){
            celebrateVictory();
        }
    }
    
    function onCardClick(card){
        if(!gameActive || blockBoard || gameFinished) return;
        const cardData = cardsArray.find(c => c.element === card);
        if(cardData.matched) return;
        if(card.classList.contains("flip")) return;
        
        totalTaps++;
        tapCounterSpan.innerText = totalTaps;
        card.classList.add("flip");
        
        if(firstCard === null){
            firstCard = card;
            return;
        }
        if(secondCard === null && firstCard !== card){
            secondCard = card;
            checkMatch();
        }
    }
    
    function checkMatch(){
        const firstData = cardsArray.find(c => c.element === firstCard);
        const secondData = cardsArray.find(c => c.element === secondCard);
        
        if(firstData.pairId === secondData.pairId){
            firstData.matched = true;
            secondData.matched = true;
            matchedPairs++;
            firstCard = null;
            secondCard = null;
            checkGameCompletion();
        } else {
            blockBoard = true;
            setTimeout(() => {
                if(firstCard) firstCard.classList.remove("flip");
                if(secondCard) secondCard.classList.remove("flip");
                firstCard = null;
                secondCard = null;
                blockBoard = false;
            }, 800);
        }
    }
    
    function fullGameReset(){
        gameFinished = false;
        gameActive = true;
        blockBoard = false;
        matchedPairs = 0;
        totalTaps = 0;
        tapCounterSpan.innerText = totalTaps;
        winMsgDiv.style.display = "none";
        firstCard = null;
        secondCard = null;
        
        generateLetterSet();
        createBoard();
        
        const allCards = document.querySelectorAll(".memory-card");
        allCards.forEach(c => {
            c.classList.remove("flip", "win-celebrate");
        });
    }
    
    function createBoard(){
        boardEl.innerHTML = "";
        let deck = [];
        letterList.forEach((letter, idx) => {
            deck.push({ pairId: idx, letter: letter });
            deck.push({ pairId: idx, letter: letter });
        });
        for(let i = deck.length - 1; i > 0; i--){
            const j = Math.floor(Math.random() * (i + 1));
            [deck[i], deck[j]] = [deck[j], deck[i]];
        }
        
        cardsArray = [];
        deck.forEach((item) => {
            const cardDiv = document.createElement("div");
            cardDiv.classList.add("memory-card");
            cardDiv.dataset.pairId = item.pairId;
            const displayChar = getDisplayLetter(item.letter, currentStyle);
            cardDiv.innerHTML = `
                <div class="front-face">${displayChar}</div>
                <div class="back-face"></div>
            `;
            cardDiv.addEventListener("click", () => onCardClick(cardDiv));
            boardEl.appendChild(cardDiv);
            cardsArray.push({
                element: cardDiv,
                letter: item.letter,
                pairId: item.pairId,
                matched: false
            });
        });
        boardEl.className = `game-board ${currentStyle}`;
    }
    
    function changeStyle(newStyle){
        currentStyle = newStyle;
        fullGameReset();
    }
    
    function changePairs(pairs){
        currentPairs = pairs;
        updateMinTapsDisplay();
        fullGameReset();
    }
    
    function bindEvents(){
        restartBtn.addEventListener("click", () => {
            fullGameReset();
        });
        
        styleBtns.forEach(btn => {
            btn.addEventListener("click", () => {
                styleBtns.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                changeStyle(btn.dataset.style);
            });
        });
        
        qtyBtns.forEach(btn => {
            btn.addEventListener("click", () => {
                qtyBtns.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                const newPairs = parseInt(btn.dataset.pairs, 10);
                changePairs(newPairs);
            });
        });
        
        if(toggleBtn) {
            toggleBtn.addEventListener("click", () => {
                setAnimationsEnabled(!animationsEnabled);
            });
        }
    }
    
    const themeBtn = document.getElementById("themeAudioBtn");
    if(themeBtn){
        themeBtn.addEventListener("click", function(){
            canvasConfetti({ particleCount: 40, spread: 45, origin: { y: 0.7 } });
        });
    }
    
    updateMinTapsDisplay();
    generateLetterSet();
    createBoard();
    bindEvents();
    setAnimationsEnabled(true);
})();
</script>
</body>
</html>
