<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Memória Oceânica – Alfabeto Marítimo</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Caveat:wght@400;700&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        /* ---------- FUNDO OCEÂNICO COM BOLHAS ---------- */
        body {
            background: linear-gradient(145deg, #022b3a 0%, #015a6e 100%);
            font-family: 'Comic Neue', 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            color: #eef5e6;
            overflow-x: hidden;
        }

        /* bolhas animadas */
        .bubble {
            position: fixed;
            bottom: -50px;
            background: radial-gradient(circle, rgba(255,255,240,0.6), rgba(150,220,255,0.2));
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: riseBubbles linear infinite;
        }
        @keyframes riseBubbles {
            0% { transform: translateY(0) scale(0.3); opacity: 0.6; }
            100% { transform: translateY(-120vh) scale(1.2); opacity: 0; }
        }

        /* container principal com duas colunas (lateral + jogo) */
        .game-container {
            max-width: 1400px;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            align-items: flex-start;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        /* Área do jogo (cartas) com fundo transparente azulado */
        .game-area {
            flex: 3;
            min-width: 280px;
            background: rgba(1, 55, 70, 0.6);
            backdrop-filter: blur(6px);
            border-radius: 48px;
            padding: 24px 20px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,200,0.2);
            border: 1px solid #48cae4;
        }

        /* Painel lateral com estatísticas */
        .side-panel {
            flex: 1;
            min-width: 220px;
            background: rgba(2, 45, 55, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 20px 18px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            border: 1px solid #7fd1e0;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 24px;
            gap: 12px;
        }
        h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #b9f6ff, #6de0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .btn-icon {
            background: #0f5b6e;
            border: none;
            border-radius: 60px;
            padding: 8px 14px;
            color: #f5ffdc;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .btn-icon:active { transform: scale(0.96); }

        /* cartões estatísticos */
        .stat-card {
            background: #043b46;
            border-radius: 28px;
            padding: 15px;
            text-align: center;
            border-left: 6px solid #ffd966;
        }
        .stat-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            color: #cae9ff;
        }
        .stat-value {
            font-size: 2.4rem;
            font-weight: 800;
            line-height: 1;
            color: #ffeaac;
            margin: 8px 0;
        }
        .badge-min {
            font-size: 1rem;
            background: #1b5a6b;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 40px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .control-title {
            font-weight: bold;
            font-size: 1rem;
            border-bottom: 2px solid #ffd966;
            display: inline-block;
            margin-bottom: 8px;
        }
        .mode-buttons, .amount-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .mode-btn, .qty-btn {
            background: #1b6f82;
            border: none;
            padding: 8px 12px;
            border-radius: 40px;
            font-weight: bold;
            color: #f0fafc;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.8rem;
        }
        .mode-btn.active, .qty-btn.active {
            background: #ffcd7e;
            color: #024551;
            box-shadow: 0 0 8px #ffdd99;
        }
        .mode-btn:active, .qty-btn:active { transform: scale(0.96); }

        /* GRADE DAS CARTAS - COR AZUL COM PEIXE AMARELO */
        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            justify-items: center;
            align-items: center;
        }
        @media (max-width: 550px) {
            .game-board { gap: 8px; }
        }

        .memory-card {
            aspect-ratio: 1 / 1.1;
            width: 100%;
            max-width: 110px;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border-radius: 20px;
        }
        .memory-card.flip { transform: rotateY(180deg); }

        .front-face, .back-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            box-shadow: 0 8px 14px rgba(0,0,0,0.3);
        }
        /* FRENTE DA CARTA (LADO DA LETRA) */
        .front-face {
            transform: rotateY(180deg);
            background: #f0f9ff;
            background-image: radial-gradient(circle at 10% 30%, rgba(72,202,228,0.2) 2%, transparent 2.5%);
            background-size: 20px 20px;
            color: #0b6e7a;
            font-size: 2.2rem;
            border: 3px solid #ffd966;
            box-shadow: inset 0 0 5px #48cae4;
        }
        /* VERSO DA CARTA – AZUL ESCURO COM PEIXE AMARELO */
        .back-face {
            background: linear-gradient(135deg, #0c6b7a, #043b46);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ffd966" width="32px" height="32px"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>');
            background-repeat: no-repeat;
            background-position: center 35%;
            background-size: 38px;
            font-size: 2rem;
            border: 2px solid #ffcd7e;
        }
        .back-face::after {
            content: "🐠";
            font-size: 2rem;
            position: absolute;
            bottom: 15%;
            opacity: 0.9;
        }
        /* estilos para letras (cursiva / forma) */
        .cursive-upper .front-face { font-family: 'Dancing Script', cursive; text-transform: uppercase; }
        .cursive-lower .front-face { font-family: 'Caveat', cursive; text-transform: lowercase; }
        .form-upper .front-face { font-family: 'Comic Neue', sans-serif; text-transform: uppercase; font-weight: 700; }
        .form-lower .front-face { font-family: 'Comic Neue', sans-serif; text-transform: lowercase; font-weight: 700; }

        .win-message {
            margin-top: 25px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            background: #1f8a6eaa;
            backdrop-filter: blur(10px);
            padding: 12px;
            border-radius: 40px;
            display: none;
            animation: fadeUp 0.5s;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px);}
            to { opacity: 1; transform: translateY(0);}
        }

        .restart-btn {
            background: #ffcd7e;
            border: none;
            color: #024551;
            font-weight: bold;
            padding: 12px 20px;
            border-radius: 60px;
            width: 100%;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
            margin-top: 10px;
        }
        .restart-btn:active { transform: scale(0.97);}
        footer { font-size: 0.7rem; text-align: center; margin-top: 15px; opacity: 0.8; }

        .trophy-badge {
            font-size: 2rem;
            filter: drop-shadow(0 0 6px gold);
            display: inline-block;
            margin-left: 8px;
        }
        canvas#confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2000;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
</head>
<body>

<!-- bolhas geradas por JS -->
<div id="bubble-container" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1; overflow:hidden;"></div>

<div class="game-container">
    <div class="game-area">
        <div class="game-header">
            <h1>🌊 MEMÓRIA OCEÂNICA 🐠</h1>
            <button class="btn-icon" id="themeAudioBtn">🔊 Sons Ativos</button>
        </div>
        <div class="game-board" id="gameBoard"></div>
        <div class="win-message" id="winMessage"></div>
        <button class="restart-btn" id="restartGameBtn">🐚 NOVA PARTIDA 🐚</button>
        <footer>🐟 toque nas cartas – encontre os pares com o menor número de toques!</footer>
    </div>

    <!-- Painel lateral -->
    <div class="side-panel">
        <div class="stat-card">
            <div class="stat-label">🎯 TOQUES USADOS</div>
            <div class="stat-value" id="tapCounter">0</div>
            <div class="stat-label">⚡ MÍNIMO POSSÍVEL</div>
            <div class="stat-value" id="minTapsDisplay">0</div>
            <div class="badge-min" id="bestHint">✨ desafio: iguale o mínimo!</div>
        </div>

        <div class="control-group">
            <div class="control-title">✍️ ESTILO DAS LETRAS</div>
            <div class="mode-buttons" id="styleButtons">
                <button data-style="form-upper" class="mode-btn active">🔠 MAIÚSCULA (fôrma)</button>
                <button data-style="form-lower" class="mode-btn">🔡 MINÚSCULA (fôrma)</button>
                <button data-style="cursive-upper" class="mode-btn">🖌️ CURSIVA MAIÚSCULA</button>
                <button data-style="cursive-lower" class="mode-btn">✍️ CURSIVA MINÚSCULA</button>
            </div>
        </div>

        <div class="control-group">
            <div class="control-title">🐟 QUANTIDADE DE PARES</div>
            <div class="amount-buttons" id="qtyButtons">
                <button data-pairs="8" class="qty-btn active">16 cartas (8 pares)</button>
                <button data-pairs="10" class="qty-btn">20 cartas (10 pares)</button>
                <button data-pairs="12" class="qty-btn">24 cartas (12 pares)</button>
            </div>
        </div>
        <div class="control-group">
            <div class="control-title">🔊 DICAS</div>
            <p style="font-size: 0.8rem; opacity: 0.9;">⭐ Clique nas cartas → escute a letra<br>🎯 Toque mínimo = 2 x nº de pares</p>
        </div>
    </div>
</div>
<canvas id="confetti-canvas"></canvas>

<script>
    (function(){
        // ---------- CONFIGURAÇÕES INICIAIS (16 cartas padrão) ----------
        let currentPairs = 8;            // 8 pares = 16 cartas (início)
        let currentStyle = "form-upper";  // maiúscula forma
        let totalTaps = 0;                
        let minPossibleTaps = 0;
        let gameActive = true;
        let blockBoard = false;
        let firstCard = null, secondCard = null;
        let matchedPairs = 0;
        let cardsArray = [];         
        let letterList = [];          
        let soundEnabled = true;
        
        // Elementos DOM
        const boardEl = document.getElementById("gameBoard");
        const tapCounterSpan = document.getElementById("tapCounter");
        const minTapsSpan = document.getElementById("minTapsDisplay");
        const winMsgDiv = document.getElementById("winMessage");
        const restartBtn = document.getElementById("restartGameBtn");
        const styleBtns = document.querySelectorAll("[data-style]");
        const qtyBtns = document.querySelectorAll("[data-pairs]");
        const audioToggleBtn = document.getElementById("themeAudioBtn");
        
        // ---------- BOLHAS DE FUNDO (movimento suave) ----------
        function createBubbles() {
            const bubbleContainer = document.getElementById("bubble-container");
            setInterval(() => {
                if (document.hidden) return;
                const bubble = document.createElement("div");
                bubble.classList.add("bubble");
                const size = Math.random() * 40 + 15;
                bubble.style.width = size + "px";
                bubble.style.height = size + "px";
                bubble.style.left = Math.random() * 100 + "%";
                bubble.style.animationDuration = Math.random() * 5 + 4 + "s";
                bubble.style.animationDelay = Math.random() * 2 + "s";
                bubbleContainer.appendChild(bubble);
                setTimeout(() => bubble.remove(), 7000);
            }, 800);
        }
        createBubbles();

        // ---------- SONS (web audio + speech) ----------
        let audioCtx = null;
        function initAudioContext() {
            if (!audioCtx && soundEnabled) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        function playBeep(type) {
            if (!soundEnabled) return;
            try {
                initAudioContext();
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = "sine";
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
                if (type === "match") {
                    osc.frequency.value = 880;
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
                } else if (type === "mismatch") {
                    osc.frequency.value = 440;
                    osc.frequency.exponentialRampToValueAtTime(220, now + 0.3);
                } else if (type === "flip") {
                    osc.frequency.value = 680;
                    osc.frequency.exponentialRampToValueAtTime(520, now + 0.15);
                } else if (type === "win") {
                    osc.frequency.value = 660;
                    osc.frequency.setValueAtTime(880, now+0.1);
                    osc.frequency.setValueAtTime(1046, now+0.25);
                    gain.gain.setValueAtTime(0.25, now);
                }
                osc.start();
                osc.stop(now + 0.4);
            } catch(e) { console.warn("audio error", e); }
        }

        function speakLetter(letter) {
            if (!soundEnabled) return;
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(letter);
            utterance.lang = 'pt-BR';
            utterance.rate = 0.85;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        function playVictoryFanfare() {
            if (!soundEnabled) return;
            try {
                initAudioContext();
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, now + idx*0.12);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + idx*0.12 + 0.6);
                    osc.start(now + idx*0.12);
                    osc.stop(now + idx*0.12 + 0.5);
                });
            } catch(e) {}
        }

        // ---------- LÓGICA DO JOGO ----------
        function updateMinTaps() {
            minPossibleTaps = currentPairs * 2;  
            minTapsSpan.innerText = minPossibleTaps;
        }

        function updateTapCounterUI() {
            tapCounterSpan.innerText = totalTaps;
        }

        function resetAndRestart() {
            if (window._resetTimeout) clearTimeout(window._resetTimeout);
            blockBoard = false;
            gameActive = true;
            matchedPairs = 0;
            totalTaps = 0;
            updateTapCounterUI();
            winMsgDiv.style.display = "none";
            winMsgDiv.innerHTML = "";
            if (firstCard) { 
                if (firstCard && firstCard.classList) firstCard.classList.remove('flip');
                if (secondCard && secondCard.classList) secondCard.classList.remove('flip');
            }
            firstCard = null;
            secondCard = null;
            generateLetterSet();
            createBoard();
        }

        function generateLetterSet() {
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
            letterList = alphabet.slice(0, currentPairs);
        }

        function getDisplayLetter(letter, style) {
            let result = letter;
            if (style === "form-lower") result = letter.toLowerCase();
            else if (style === "cursive-lower") result = letter.toLowerCase();
            else if (style === "form-upper") result = letter.toUpperCase();
            else if (style === "cursive-upper") result = letter.toUpperCase();
            return result;
        }

        function createBoard() {
            boardEl.innerHTML = "";
            let deck = [];
            letterList.forEach((letter, idx) => {
                deck.push({ pairId: idx, letter: letter });
                deck.push({ pairId: idx, letter: letter });
            });
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
            cardsArray = [];
            deck.forEach((item) => {
                const cardDiv = document.createElement("div");
                cardDiv.classList.add("memory-card");
                cardDiv.dataset.letter = item.letter;
                cardDiv.dataset.pairId = item.pairId;
                const displayChar = getDisplayLetter(item.letter, currentStyle);
                cardDiv.innerHTML = `
                    <div class="front-face">${displayChar}</div>
                    <div class="back-face"></div>
                `;
                cardDiv.addEventListener("click", () => onCardClick(cardDiv));
                boardEl.appendChild(cardDiv);
                cardsArray.push({
                    element: cardDiv,
                    letter: item.letter,
                    pairId: item.pairId,
                    matched: false
                });
            });
            boardEl.className = `game-board ${currentStyle}`;
        }

        function onCardClick(card) {
            if (!gameActive) return;
            if (blockBoard) return;
            if (card.classList.contains('flip')) return;
            const cardData = cardsArray.find(c => c.element === card);
            if (cardData.matched) return;

            totalTaps++;
            updateTapCounterUI();
            playBeep("flip");
            speakLetter(getDisplayLetter(cardData.letter, currentStyle));
            
            card.classList.add('flip');
            
            if (firstCard === null) {
                firstCard = card;
                return;
            }
            if (secondCard === null && firstCard !== card) {
                secondCard = card;
                checkMatch();
            }
        }

        function checkMatch() {
            const firstData = cardsArray.find(c => c.element === firstCard);
            const secondData = cardsArray.find(c => c.element === secondCard);
            const isMatch = (firstData.pairId === secondData.pairId);
            
            if (isMatch) {
                playBeep("match");
                firstData.matched = true;
                secondData.matched = true;
                matchedPairs++;
                firstCard.style.pointerEvents = "none";
                secondCard.style.pointerEvents = "none";
                clearSelection();
                if (matchedPairs === currentPairs) {
                    endGameVictory();
                }
            } else {
                playBeep("mismatch");
                blockBoard = true;
                setTimeout(() => {
                    firstCard.classList.remove('flip');
                    secondCard.classList.remove('flip');
                    clearSelection();
                    blockBoard = false;
                }, 700);
            }
        }
        
        function clearSelection() {
            firstCard = null;
            secondCard = null;
        }
        
        function endGameVictory() {
            gameActive = false;
            blockBoard = true;
            const perfectWin = (totalTaps === minPossibleTaps);
            let trophyHtml = "";
            if (perfectWin) {
                trophyHtml = '<span class="trophy-badge">🏆✨ PERFEITO! ✨🏆</span>';
                playVictoryFanfare();
                canvasConfetti({ particleCount: 220, spread: 120, origin: { y: 0.6 }, colors: ['#2ecc71', '#f1c40f', '#48cae4'] });
                canvasConfetti({ particleCount: 120, spread: 80, origin: { y: 0.4, x: 0.3 }, startVelocity: 20 });
                canvasConfetti({ particleCount: 120, spread: 80, origin: { y: 0.4, x: 0.7 }, startVelocity: 20 });
                setTimeout(() => {
                    canvasConfetti({ particleCount: 400, spread: 140, origin: { y: 0.5 }, startVelocity: 25, colors: ['#ffd966', '#ffb347', '#2ecc71'] });
                }, 200);
                speakLetter("Parabéns! Desempenho perfeito! Você é um mestre da memória!");
            } else {
                canvasConfetti({ particleCount: 140, spread: 80, origin: { y: 0.6 }, colors: ['#7fe07f', '#ffd966'] });
                speakLetter("Muito bem! Você completou o jogo!");
                playVictoryFanfare();
            }
            const msg = perfectWin ? 
                `🎉 VITÓRIA PERFEITA! 🎉<br> Você usou ${totalTaps} toques (MÍNIMO = ${minPossibleTaps})! 🌟` : 
                `🐠 Parabéns! Você completou em ${totalTaps} toques.<br> O mínimo possível é ${minPossibleTaps}. Tente superar! 🐟`;
            winMsgDiv.innerHTML = `${msg} ${trophyHtml} <div style="margin-top:8px;">💪 continue treinando!</div>`;
            winMsgDiv.style.display = "block";
        }
        
        // ---------- CONFIGURAÇÕES ----------
        function setPairs(pairs) {
            currentPairs = pairs;
            updateMinTaps();
            resetAndRestart();
        }
        
        function setStyle(style) {
            currentStyle = style;
            boardEl.className = `game-board ${currentStyle}`;
            if (cardsArray.length) {
                cardsArray.forEach(cardData => {
                    if (!cardData.element) return;
                    const frontDiv = cardData.element.querySelector(".front-face");
                    if (frontDiv) {
                        const newDisplay = getDisplayLetter(cardData.letter, currentStyle);
                        frontDiv.innerText = newDisplay;
                    }
                });
            } else {
                resetAndRestart();
            }
        }
        
        function fullReset() {
            resetAndRestart();
        }
        
        function toggleSound() {
            soundEnabled = !soundEnabled;
            audioToggleBtn.innerText = soundEnabled ? "🔊 Sons Ativos" : "🔇 Sons Desligados";
            if (soundEnabled && audioCtx && audioCtx.state === "suspended") {
                audioCtx.resume();
            }
            if (!soundEnabled && audioCtx) {
                audioCtx.suspend();
            }
        }
        
        // ----- EVENTOS -----
        function bindEvents() {
            restartBtn.addEventListener("click", () => fullReset());
            styleBtns.forEach(btn => {
                btn.addEventListener("click", () => {
                    const style = btn.dataset.style;
                    styleBtns.forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    setStyle(style);
                });
            });
            qtyBtns.forEach(btn => {
                btn.addEventListener("click", () => {
                    const pairs = parseInt(btn.dataset.pairs, 10);
                    qtyBtns.forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    setPairs(pairs);
                });
            });
            audioToggleBtn.addEventListener("click", () => {
                toggleSound();
            });
            document.body.addEventListener("click", () => {
                if (soundEnabled && audioCtx && audioCtx.state === "suspended") {
                    audioCtx.resume();
                }
            }, { once: true });
        }
        
        // ---------- INICIALIZAÇÃO (16 cartas / estilo maiúscula forma) ----------
        function init() {
            currentPairs = 8;      // 16 cartas
            currentStyle = "form-upper";
            updateMinTaps();
            generateLetterSet();
            createBoard();
            bindEvents();
            // garantir que o botão ativo seja o de 16 cartas
            document.querySelector("[data-pairs='8']").classList.add("active");
            document.querySelector("[data-style='form-upper']").classList.add("active");
            audioCtx = null;
            soundEnabled = true;
            audioToggleBtn.innerText = "🔊 Sons Ativos";
        }
        
        init();
    })();
</script>
</body>
</html>
