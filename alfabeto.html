<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>🧜‍♀️ Alfabeto do Reino Encantado - Aprenda com a Sereia 🧜‍♂️</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Nunito:wght@400;600;700;800&family=Dancing+Script:wght@700&family=Playwrite+BR:wght@100..400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --primary: #ff6f61;
            --secondary: #ffca28;
            --accent-blue: #42a5f5;
            --accent-green: #66bb6a;
            --accent-purple: #ab47bc;
            --cursive-school: 'Playwrite BR', cursive;
            --print-font: 'Nunito', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* CORREÇÃO TELA CHEIA: touch-action impede o atraso no clique */
        button {
            touch-action: manipulation; 
        }

        html, body {
            width: 100%;
            background: linear-gradient(145deg, #021a2b 0%, #043b5c 40%, #01121f 100%);
        }

        body {
            font-family: 'Nunito', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            /* CORREÇÃO TELA CHEIA: Removido o align-items: center para evitar corte dos botões */
            padding: 16px;
            position: relative;
        }

        .bubble-marine {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle, rgba(200, 240, 255, 0.4), rgba(100, 200, 255, 0.1));
            border-radius: 50%;
            animation: flutuarBolha linear infinite;
        }

        @keyframes flutuarBolha {
            0% { transform: translateY(100vh) scale(0.3); opacity: 0; }
            20% { opacity: 0.5; }
            80% { opacity: 0.4; }
            100% { transform: translateY(-20vh) scale(1); opacity: 0; }
        }

        .app {
            width: 100%;
            max-width: 1000px;
            min-height: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 10;
            /* CORREÇÃO TELA CHEIA: O 'margin: auto' centraliza com segurança sem jogar itens pra fora da tela */
            margin: auto; 
        }

        .card {
            position: relative;
            background: rgba(1, 30, 45, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 22px 20px 32px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,200,0.2);
            border: 2px solid #ffcd7e;
            overflow: hidden;
        }

        .header-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-acao {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #ffcd7e;
            color: #ffeaac;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 40px;
            font-size: 0.8rem;
            transition: all 0.3s;
            font-family: 'Nunito', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-acao:hover {
            transform: scale(1.05);
            background: rgba(255, 205, 126, 0.3);
            box-shadow: 0 0 15px rgba(255,205,126,0.5);
        }

        .btn-dourado {
            background: linear-gradient(135deg, #f5b042, #ffd700, #f5a623);
            border: 2px solid #fff2b5;
            color: #3a2a1a;
            animation: brilhoDourado 1.5s ease-in-out infinite alternate;
        }

        @keyframes brilhoDourado {
            0% { box-shadow: 0 0 5px rgba(255, 215, 0, 0.4); background: linear-gradient(135deg, #f5b042, #ffd700); }
            100% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.8); background: linear-gradient(135deg, #ffcc44, #ffea8c); }
        }

        .modo-selector {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .modo-btn, .game-mode-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #7ec8ff;
            color: #7ec8ff;
            padding: 6px 12px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 40px;
            font-size: 0.7rem;
            transition: all 0.3s;
            font-family: 'Nunito', sans-serif;
        }

        .modo-btn.ativo, .game-mode-btn.ativo {
            background: linear-gradient(135deg, #1e5f8e, #0d3a5c);
            border-color: #ffcd7e;
            color: #ffeaac;
            box-shadow: 0 0 10px rgba(255,205,126,0.4);
        }

        .title {
            font-family: 'Cinzel Decorative', cursive;
            font-size: clamp(20px, 5vw, 28px);
            background: linear-gradient(135deg, #ffdd99, #ffbc6e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 10px rgba(255,200,100,0.3);
            margin-bottom: 8px;
        }

        .subtitle {
            font-family: 'Dancing Script', cursive;
            font-size: 1rem;
            color: #b9e6ff;
            margin-bottom: 20px;
        }

        .stage {
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
        }

        .big-letter {
            font-size: clamp(80px, 20vw, 150px);
            font-weight: 900;
            line-height: 1.2;
            background: linear-gradient(135deg, #ffdd99, #ffaa66);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 5px 15px rgba(0,0,0,0.2);
            opacity: 0;
            transform: scale(0.1) translateY(40px);
            transition: all 0.3s ease;
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .big-letter.flash-in {
            animation: flashIn 0.6s ease-out forwards;
        }

        @keyframes flashIn {
            0% { opacity: 0; transform: scale(0.1) translateY(40px); }
            40% { opacity: 1; transform: scale(1.1) translateY(0); }
            100% { opacity: 1; transform: scale(1); }
        }

        .manual-area {
            margin: 15px 0;
            text-align: center;
        }

        .manual-input {
            font-size: 2rem;
            width: 120px;
            text-align: center;
            padding: 10px;
            border-radius: 60px;
            border: 3px solid #ffcd7e;
            background: rgba(255,255,240,0.9);
            color: #2c1a3a;
            font-weight: bold;
            outline: none;
            font-family: inherit;
        }

        .manual-label {
            font-size: 0.9rem;
            color: #ffeaac;
            display: block;
            margin-bottom: 8px;
        }

        /* CORREÇÃO TECLADO: Substituído Grid por Flexbox para alinhamento perfeito no centro */
        .alphabet-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 15px 0;
        }

        .letter-btn {
            width: 50px;
            height: 50px;
            border-radius: 16px;
            border: none;
            font-size: 1.3rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .letter-btn:active { transform: scale(0.95); }
        
        .letter-btn.completed { opacity: 0.5; filter: grayscale(0.3); cursor: default; transform: none; }

        .c1 { background: linear-gradient(135deg, #ff8a65, #ffb74d); }
        .c2 { background: linear-gradient(135deg, #4fc3f7, #64b5f6); }
        .c3 { background: linear-gradient(135deg, #81c784, #aed581); }
        .c4 { background: linear-gradient(135deg, #ba68c8, #f06292); }

        .progresso {
            margin-top: 15px;
            font-size: 1rem;
            color: #ffeaac;
            font-weight: bold;
        }

        .btn-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .celebration {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #ffd700, #ffaa33);
            color: #2c1a3a;
            padding: 20px 40px;
            border-radius: 60px;
            font-size: 1.5rem;
            font-weight: bold;
            z-index: 200;
            animation: fadeOut 2s ease-out forwards;
            white-space: nowrap;
            box-shadow: 0 0 30px rgba(255,215,0,0.8);
            font-family: 'Cinzel Decorative', cursive;
        }

        @keyframes fadeOut {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.8); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1); visibility: hidden; }
        }

        .error-msg {
            color: #ff8888;
            font-size: 1rem;
            margin-top: 10px;
            animation: fadeOutMsg 1.5s ease-out forwards;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            padding: 10px 20px;
            border-radius: 40px;
            z-index: 200;
        }

        @keyframes fadeOutMsg {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.8); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1); visibility: hidden; }
        }

        footer {
            margin-top: 15px;
            font-size: 0.7rem;
            color: #8ab3cf;
            text-align: center;
        }

        /* ========== ESTILOS DO MODAL DE MÍDIA ========== */
        .media-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            backdrop-filter: blur(10px);
        }
        
        .media-content {
            position: relative;
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
        }
        
        .media-content video, .media-content img {
            width: 100%;
            max-height: 75vh;
            object-fit: contain;
            border: 4px solid #ffcd7e;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(255,205,126,0.5);
            background: #000;
        }
        
        #closeMediaBtn {
            padding: 12px 35px;
            font-size: 1.3rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ff6f61, #d32f2f);
            color: white;
            border: 2px solid #ffcd7e;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255,111,97,0.6);
            font-family: 'Nunito', sans-serif;
            transition: all 0.3s ease;
        }
        
        #closeMediaBtn:hover {
            transform: scale(1.08);
            box-shadow: 0 5px 25px rgba(255,111,97,0.9);
        }

        @media (max-width: 560px) {
            .letter-btn { width: 40px; height: 40px; font-size: 1rem; }
            .btn-acao { padding: 5px 10px; font-size: 0.65rem; }
            .modo-btn, .game-mode-btn { padding: 4px 8px; font-size: 0.6rem; }
            .manual-input { width: 90px; font-size: 1.5rem; }
            .big-letter { min-height: 140px; font-size: clamp(60px, 18vw, 100px); }
        }
    </style>
</head>
<body>

<!-- MODAL DE VÍDEO/IMAGEM -->
<div id="mediaModal" class="media-modal" style="display: none;">
    <div class="media-content">
        <video id="letterVideo" controls autoplay playsinline style="display: none;"></video>
        <img id="letterImg" style="display: none;" />
        <button id="closeMediaBtn" onclick="fecharMidia()">Continuar ➡️</button>
    </div>
</div>

<div class="app">
    <div class="card">
        <div class="header-buttons">
            <button class="btn-acao btn-dourado" id="btnVoltar" onclick="voltarPagina()">⬅️⭐ Voltar</button>
            <button class="btn-acao" id="fullscreenBtn" onclick="toggleFullscreen()">⛶ Tela Cheia</button>
            <button class="btn-acao" id="audioBtn" onclick="toggleAudio()">🔊 Música</button>
        </div>

        <div class="modo-selector">
            <button class="game-mode-btn" data-gamemode="sequencial" onclick="selecionarGameMode('sequencial')">📚 Sequencial</button>
            <button class="game-mode-btn" data-gamemode="aleatorio" onclick="selecionarGameMode('aleatorio')">🎲 Aleatório</button>
            <button class="game-mode-btn" data-gamemode="misterio" onclick="selecionarGameMode('misterio')">❓ Mistério (SOMENTE SOM)</button>
        </div>

        <div class="modo-selector" id="modoSelector">
            <button class="modo-btn" data-modo="print-maius" onclick="selecionarModo('print-maius')">🔠 Fôrma MAIÚSCULA</button>
            <button class="modo-btn" data-modo="print-minus" onclick="selecionarModo('print-minus')">🔡 Fôrma minúscula</button>
            <button class="modo-btn" data-modo="cursive-maius" onclick="selecionarModo('cursive-maius')">✍️ Manuscrito MAIÚSCULO</button>
            <button class="modo-btn" data-modo="cursive-minus" onclick="selecionarModo('cursive-minus')">✍️ Manuscrito minúsculo</button>
        </div>

        <h1 class="title">🧜‍♀️ Alfabeto do Reino Encantado 🧜‍♂️</h1>
        <p class="subtitle">🐚 Ouça a voz da Sereia e digite a letra correta! 🐚</p>

        <div class="stage">
            <div id="bigLetter" class="big-letter"></div>
        </div>

        <div class="manual-area">
            <div class="manual-label">🎤 Digite ou clique na letra que você ouviu:</div>
            <!-- INPUT READONLY PARA NÃO ABRIR O TECLADO DO CELULAR -->
            <input type="text" class="manual-input" id="manualInput" placeholder="?" readonly>
        </div>

        <div class="alphabet-grid" id="alphabetGrid"></div>

        <div class="progresso" id="progresso">✨ Progresso: 0/26 letras ✨</div>

        <div class="btn-row">
            <button class="btn-acao" id="btnRepetir">🔁 Repetir letra</button>
            <button class="btn-acao" id="btnReset">🔄 Recomeçar jogo</button>
        </div>

        <footer>🧜‍♀️ Clique nas letras ou digite no teclado! Cada acerto é uma conquista submarina! 🧜‍♂️</footer>
    </div>
</div>

<audio id="bgMusic" src="ocean_ambience.mp3" loop></audio>
<audio id="sfxCorrect" src="splash.mp3"></audio>
<audio id="sfxApplause" src="aplausos.mp3"></audio>

<script>
    // ==================== CONFIGURAÇÕES INICIAIS ====================
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    let completed = new Array(26).fill(false);
    let currentLetterIndex = 0;
    let currentGameMode = "sequencial";
    let modoAtual = "print-maius";
    let audioEnabled = true;
    let jogoFinalizado = false;
    let currentUtterance = null;
    
    // Para o Modo Mistério: fila de letras (26 letras únicas + repetições de erros)
    let misterioQueue = [];
    let currentMisterioIndex = 0;
    let letrasErradas = [];
    let repeticoesPendentes = [];

    // Tabela de Mídias (Vídeos e Imagens de Suporte)
    const midiasLetras = {
        'A': { video: 'a-abelha.mp4', img: 'letra-a.jpg' },
        'B': { video: 'b-baleia.mp4', img: 'letra-b.jpg' },
        'C': { video: 'c-coroa.mp4', img: 'letra-c.jpg' },
        'D': { video: 'd-dado.mp4', img: 'letra-d.jpg' },
        'E': { video: 'e-elefante.mp4', img: 'letra-e.jpg' },
        'F': { video: 'f-foca.mp4', img: 'letra-f.jpg' },
        'G': { video: 'g-gato.mp4', img: 'letra-g.jpg' },
        'H': { video: 'h-hipopotamo.mp4', img: 'letra-h.jpg' },
        'I': { video: 'i-iguana.mp4', img: 'letra-i.jpg' },
        'J': { video: 'j-joaninha.mp4', img: 'letra-j.jpg' },
        'K': { video: 'k-kiwi.mp4', img: 'letra-k.jpg' },
        'L': { video: 'l-lobo.mp4', img: 'letra-l.jpg' },
        'M': { video: 'm-mao.mp4', img: 'letra-m.jpg' },
        'N': { video: 'n-navio.mp4', img: 'n-navio.jpg' },
        'O': { video: 'o-ovelha.mp4', img: 'letra-o.jpg' },
        'P': { video: 'p-papagaio.mp4', img: 'letra-p.jpg' },
        'Q': { video: 'q-queijo.mp4', img: 'letra-q.jpg' },
        'R': { video: 'r-rato.mp4', img: 'letra-r.jpg' },
        'S': { video: 's-sapo.mp4', img: 'letra-s.jpg' },
        'T': { video: 't-tatu.mp4', img: 'letra-t.jpg' },
        'U': { video: 'u-uva.mp4', img: 'letra-u.jpg' },
        'V': { video: 'v-vaca.mp4', img: 'letra-v.jpg' },
        'W': { video: 'w-wafer.mp4', img: 'letra-w.jpg' },
        'X': { video: 'x-xilofone.mp4', img: 'letra-x.jpg' },
        'Y': { video: 'y-yak.mp4', img: 'letra-y.jpg' },
        'Z': { video: 'z-zebra.mp4', img: 'letra-z.jpg' },
        'CH': { video: 'ch-chocolate.mp4', img: 'letra-ch.jpg' }
    };

    let cbAposMidia = null;

    // Elementos de áudio especiais
    const bgMusic = document.getElementById("bgMusic");
    const sfxCorrect = document.getElementById("sfxCorrect");
    const sfxApplause = document.getElementById("sfxApplause");

    const modoFontes = {
        "print-maius": { transform: (l) => l.toUpperCase(), fontFamily: "'Nunito', sans-serif", label: "Fôrma Maiúscula" },
        "print-minus": { transform: (l) => l.toLowerCase(), fontFamily: "'Nunito', sans-serif", label: "Fôrma Minúscula" },
        "cursive-maius": { transform: (l) => l.toUpperCase(), fontFamily: "'Playwrite BR', cursive", label: "Manuscrito Maiúsculo" },
        "cursive-minus": { transform: (l) => l.toLowerCase(), fontFamily: "'Playwrite BR', cursive", label: "Manuscrito Minúsculo" }
    };

    // MAPA FONÉTICO: grafias ajustadas para o sintetizador (Web Speech API / pt-BR)
    // pronunciar melhor exige "enganar" o motor de TTS com grafias que forcem
    // a vogal tônica correta e evitem que a sílaba final seja engolida.
    // Terminar a grafia em "i" (em vez de "e" mudo) ajuda o motor a manter
    // o som da consoante final bem articulado, deixando a fala menos robótica.
    const pronunciaMap = {
        "A": "á",
        "B": "bê",
        "C": "cê",
        "D": "dê",
        "E": "é",
        "F": "efe",
        "G": "gê",
        "H": "agá",
        "I": "í",
        "J": "jóta",
        "K": "cá",
        "L": "éli",
        "M": "êmi",
        "N": "êni",
        "O": "ó",
        "P": "pê",
        "Q": "quê",
        "R": "érri",
        "S": "éssi",
        "T": "tê",
        "U": "ú",
        "V": "vê",
        "W": "dáblio",
        "X": "xís",
        "Y": "ípsilon",
        "Z": "zê"
    };

    const alphabetGrid = document.getElementById("alphabetGrid");
    const bigLetterEl = document.getElementById("bigLetter");
    const manualInput = document.getElementById("manualInput");
    const progressoEl = document.getElementById("progresso");

    // ==================== FUNÇÕES PRINCIPAIS ====================
    function voltarPagina() {
        if (typeof confetti !== 'undefined') {
            confetti({ particleCount: 60, spread: 60, origin: { y: 0.3 }, colors: ['#ffd700', '#48cae4'], startVelocity: 10 });
        }
        window.location.href = 'https://alfabeto-mu.vercel.app/';
    }

    // CORREÇÃO TELA CHEIA: Adicionados prefixos extras de compatibilidade
    function toggleFullscreen() {
        const elem = document.documentElement;
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(err => console.log(err));
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            }
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        }
    }

    function toggleAudio() {
        audioEnabled = !audioEnabled;
        const btn = document.getElementById("audioBtn");
        if (audioEnabled) {
            bgMusic.play().catch(e => console.log("erro audio"));
            btn.innerHTML = "🔊 Música";
        } else {
            bgMusic.pause();
            btn.innerHTML = "🔇 Música";
        }
    }

    function falar(texto, callback) {
        if (!window.speechSynthesis) { if(callback) callback(); return; }
        if (currentUtterance) window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'pt-BR';
        utterance.rate = 0.85;
        utterance.pitch = 1.1;
        utterance.onend = () => {
            currentUtterance = null;
            if (callback) callback();
        };
        window.speechSynthesis.speak(utterance);
        currentUtterance = utterance;
    }

    // Pronúncia 100% sintetizada (Web Speech API) para todas as letras,
    // incluindo N e S, que antes usavam arquivos de áudio gravados.
    function tocarAudioLetra(letra, callback) {
        const chave = letra.toUpperCase().trim();
        const pronuncia = pronunciaMap[chave];
        if (pronuncia) {
            falar(pronuncia, callback);
        } else {
            falar(chave, callback);
        }
    }

    function falarLetra(letra, callback) {
        tocarAudioLetra(letra, callback);
    }

    function mostrarErro() {
        const msg = document.createElement("div");
        msg.className = "error-msg";
        msg.innerHTML = "❌ Não é esta letra! Vamos tentar de novo! ❌";
        document.body.appendChild(msg);
        setTimeout(() => msg.remove(), 1500);
    }

    function selecionarModo(modo) {
        modoAtual = modo;
        document.querySelectorAll('.modo-btn').forEach(btn => {
            btn.classList.remove('ativo');
            if (btn.getAttribute('data-modo') === modo) btn.classList.add('ativo');
        });
        atualizarInterface();
    }

    function selecionarGameMode(mode) {
        currentGameMode = mode;
        document.querySelectorAll('.game-mode-btn').forEach(btn => {
            btn.classList.remove('ativo');
            if (btn.getAttribute('data-gamemode') === mode) btn.classList.add('ativo');
        });
        resetarJogo();
    }

    function getLetraTransformada(letra) {
        return modoFontes[modoAtual].transform(letra);
    }

    function atualizarInterface() {
        const btns = document.querySelectorAll('.letter-btn');
        letters.forEach((letra, idx) => {
            if (btns[idx]) {
                const letraTransformada = getLetraTransformada(letra);
                btns[idx].textContent = letraTransformada;
                btns[idx].style.fontFamily = modoFontes[modoAtual].fontFamily;
                
                if (completed[idx]) {
                    btns[idx].classList.add('completed');
                } else {
                    btns[idx].classList.remove('completed');
                }
            }
        });
        
        if (!jogoFinalizado) {
            if (currentGameMode === "misterio") {
                bigLetterEl.textContent = "?";
                bigLetterEl.style.fontFamily = "'Cinzel Decorative', cursive";
                bigLetterEl.style.fontSize = "clamp(80px, 20vw, 150px)";
            } else if (currentLetterIndex < 26 && !completed[currentLetterIndex]) {
                const letraAtual = getLetraTransformada(letters[currentLetterIndex]);
                bigLetterEl.textContent = letraAtual;
                bigLetterEl.style.fontFamily = modoFontes[modoAtual].fontFamily;
            }
        }
    }

    // ==================== CONSTRUÇÃO DA FILA DO MODO MISTÉRIO ====================
    function construirFilaMisterio() {
        let todasLetras = [...letters];
        for (let i = todasLetras.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [todasLetras[i], todasLetras[j]] = [todasLetras[j], todasLetras[i]];
        }
        misterioQueue = [...todasLetras];
        letrasErradas = [];
        repeticoesPendentes = [];
        currentMisterioIndex = 0;
    }
    
    function adicionarRepeticaoLetra(letra) {
        const letraIndex = letters.indexOf(letra);
        if (completed[letraIndex]) return;
        
        for (let r = 0; r < 3; r++) {
            const posInsercao = currentMisterioIndex + 1 + Math.floor(Math.random() * (misterioQueue.length - currentMisterioIndex + 1));
            misterioQueue.splice(posInsercao, 0, letra);
        }
    }
    
    function getProximaLetraMisterio() {
        if (currentMisterioIndex >= misterioQueue.length) {
            for (let i = 0; i < 26; i++) {
                if (!completed[i]) return letters[i];
            }
            return -1;
        }
        return misterioQueue[currentMisterioIndex];
    }
    
    function avancarMisterio() {
        currentMisterioIndex++;
    }

    // ==================== CARREGAR PRÓXIMA LETRA ====================
    function carregarProximaLetra() {
        let nextLetter = null;
        let nextIndex = -1;
        
        if (currentGameMode === "sequencial") {
            nextIndex = proximaLetraNaoCompletadaSequencial();
            if (nextIndex !== -1) nextLetter = letters[nextIndex];
        } else if (currentGameMode === "aleatorio") {
            nextIndex = getProximaLetraAleatoria();
            if (nextIndex !== -1) nextLetter = letters[nextIndex];
        } else {
            nextLetter = getProximaLetraMisterio();
            if (nextLetter !== -1) nextIndex = letters.indexOf(nextLetter);
        }
        
        if (nextIndex === -1 || !nextLetter) {
            const todasCompletadas = completed.every(c => c === true);
            if (todasCompletadas) {
                finalizarJogo();
            } else {
                for (let i = 0; i < 26; i++) {
                    if (!completed[i]) {
                        nextIndex = i;
                        nextLetter = letters[i];
                        break;
                    }
                }
                if (nextIndex === -1) {
                    finalizarJogo();
                    return false;
                }
            }
        }
        
        if (nextIndex === -1) {
            finalizarJogo();
            return false;
        }
        
        currentLetterIndex = nextIndex;
        
        if (currentGameMode === "misterio") {
            bigLetterEl.textContent = "?";
            bigLetterEl.style.fontFamily = "'Cinzel Decorative', cursive";
        } else {
            const letraAtual = getLetraTransformada(letters[currentLetterIndex]);
            bigLetterEl.textContent = letraAtual;
            bigLetterEl.style.fontFamily = modoFontes[modoAtual].fontFamily;
        }
        
        bigLetterEl.classList.remove("flash-in");
        setTimeout(() => bigLetterEl.classList.add("flash-in"), 10);
        
        setTimeout(() => {
            if (!jogoFinalizado) falarLetra(letters[currentLetterIndex]);
        }, 300);
        
        return true;
    }

    function proximaLetraNaoCompletadaSequencial() {
        for (let i = 0; i < 26; i++) {
            if (!completed[i]) return i;
        }
        return -1;
    }

    function atualizarLetrasRestantes() {
        let letrasRestantes = [];
        for (let i = 0; i < 26; i++) {
            if (!completed[i]) letrasRestantes.push(i);
        }
        return letrasRestantes;
    }

    function getProximaLetraAleatoria() {
        const restantes = atualizarLetrasRestantes();
        if (restantes.length === 0) return -1;
        const randomIndex = Math.floor(Math.random() * restantes.length);
        return restantes[randomIndex];
    }

    function celebrarAcerto(letra) {
        confetti({ particleCount: 60, spread: 50, origin: { y: 0.5 }, colors: ['#ffd700', '#48cae4', '#ffaa33'] });
        
        if (audioEnabled) {
            sfxCorrect.currentTime = 0;
            sfxCorrect.play().catch(e => console.log("erro som"));
        }
        
        const msg = document.createElement("div");
        msg.className = "celebration";
        msg.innerHTML = `🎉 PARABÉNS! +${getLetraTransformada(letra)} 🎉`;
        document.body.appendChild(msg);
        setTimeout(() => msg.remove(), 1500);
        
        const btn = document.querySelector(`.letter-btn[data-letter="${letra}"]`);
        if (btn) {
            btn.style.transform = "scale(1.1)";
            setTimeout(() => btn.style.transform = "", 300);
        }
    }

    // ==================== ABRIR VÍDEO/IMAGEM ====================
    function abrirMidiaLetra(letra, callback) {
        cbAposMidia = callback;
        const modal = document.getElementById("mediaModal");
        const videoEl = document.getElementById("letterVideo");
        const imgEl = document.getElementById("letterImg");
        
        const dados = midiasLetras[letra.toUpperCase()];
        
        modal.style.display = "flex";
        videoEl.style.display = "none";
        imgEl.style.display = "none";
        
        if (audioEnabled) bgMusic.volume = 0.05;

        if (dados) {
            videoEl.src = dados.video;
            videoEl.style.display = "block";
            
            videoEl.onerror = function() {
                videoEl.style.display = "none";
                imgEl.src = dados.img;
                imgEl.style.display = "block";
            };
            
            videoEl.onended = function() {
                fecharMidia();
            };

            videoEl.play().catch(e => {
                console.log("Auto-play prevenido ou erro de vídeo:", e);
                videoEl.style.display = "none";
                imgEl.src = dados.img;
                imgEl.style.display = "block";
            });

        } else {
            fecharMidia();
        }
    }

    function fecharMidia() {
        const modal = document.getElementById("mediaModal");
        const videoEl = document.getElementById("letterVideo");
        
        videoEl.pause();
        videoEl.src = "";
        modal.style.display = "none";
        
        if (audioEnabled) bgMusic.volume = 0.2;
        
        if (cbAposMidia) {
            const cb = cbAposMidia;
            cbAposMidia = null;
            cb();
        }
    }

    function verificarResposta(resposta) {
        if (jogoFinalizado) return;
        
        const respostaNorm = resposta.trim().toUpperCase();
        const letraCorreta = letters[currentLetterIndex];
        
        if (respostaNorm === letraCorreta && !completed[currentLetterIndex]) {
            completed[currentLetterIndex] = true;
            celebrarAcerto(letraCorreta);
            atualizarInterface();
            atualizarProgresso();
            
            setTimeout(() => {
                abrirMidiaLetra(letraCorreta, () => {
                    if (currentGameMode === "misterio") {
                        avancarMisterio();
                    }
                    
                    const completados = completed.filter(c => c === true).length;
                    if (completados === 26) {
                        finalizarJogo();
                    } else {
                        carregarProximaLetra();
                    }
                });
            }, 1200); 

        } else if (!completed[currentLetterIndex]) {
            mostrarErro();
            
            if (currentGameMode === "misterio") {
                adicionarRepeticaoLetra(letraCorreta);
            }
            falarLetra(letraCorreta);
        }
    }

    function atualizarProgresso() {
        const completados = completed.filter(c => c === true).length;
        let modoTexto = "";
        if (currentGameMode === "sequencial") modoTexto = "📚 Sequencial";
        else if (currentGameMode === "aleatorio") modoTexto = "🎲 Aleatório";
        else modoTexto = "❓ Mistério (Somente Som)";
        
        let infoExtra = "";
        if (currentGameMode === "misterio" && misterioQueue.length > 0) {
            infoExtra = ` | 🎯 ${currentMisterioIndex + 1}/${misterioQueue.length} tentativas`;
        }
        
        progressoEl.innerHTML = `${modoTexto} | ✨ Progresso: ${completados}/26 letras ✨ ${completados === 26 ? "🏆 COMPLETO! 🏆" : ""}${infoExtra}`;
    }

    function finalizarJogo() {
        if (jogoFinalizado) return;
        jogoFinalizado = true;
        
        confetti({ particleCount: 300, spread: 120, origin: { y: 0.5 }, colors: ['#ffd700', '#48cae4', '#ffaa33', '#ff6b6b', '#ff8888'] });
        
        if (audioEnabled) {
            sfxApplause.currentTime = 0;
            sfxApplause.play().catch(e => console.log("erro aplausos"));
        }
        
        for (let i = 0; i < 80; i++) {
            setTimeout(() => {
                const bolha = document.createElement('div');
                bolha.className = 'bubble-marine';
                const tamanho = Math.random() * 25 + 8;
                bolha.style.width = tamanho + 'px';
                bolha.style.height = tamanho + 'px';
                bolha.style.left = Math.random() * 100 + '%';
                bolha.style.animationDuration = Math.random() * 4 + 2 + 's';
                document.body.appendChild(bolha);
                setTimeout(() => bolha.remove(), 5000);
            }, i * 60);
        }
        
        bigLetterEl.textContent = "🏆🏆🏆";
        bigLetterEl.style.fontSize = "100px";
        bigLetterEl.style.fontFamily = "'Cinzel Decorative', cursive";
        
        const msgFinal = document.createElement("div");
        msgFinal.className = "celebration";
        msgFinal.innerHTML = "🧜‍♀️ PARABÉNS! VOCÊ DOMINOU O ALFABETO! 🧜‍♂️<br>✨ Reino Encantado te agradece! ✨";
        msgFinal.style.whiteSpace = "normal";
        msgFinal.style.textAlign = "center";
        msgFinal.style.padding = "25px 40px";
        msgFinal.style.fontSize = "1.3rem";
        document.body.appendChild(msgFinal);
        
        falar("Parabéns! Você completou todo o alfabeto! Você é um rei ou uma rainha do conhecimento!");
        
        setTimeout(() => msgFinal.remove(), 5000);
    }

    function resetarJogo() {
        completed = new Array(26).fill(false);
        jogoFinalizado = false;
        
        if (currentGameMode === "sequencial") {
            currentLetterIndex = 0;
        } else if (currentGameMode === "aleatorio") {
            const restantes = atualizarLetrasRestantes();
            currentLetterIndex = restantes.length > 0 ? restantes[0] : 0;
        } else {
            construirFilaMisterio();
            currentMisterioIndex = 0;
            const primeiraLetra = getProximaLetraMisterio();
            if (primeiraLetra !== -1) currentLetterIndex = letters.indexOf(primeiraLetra);
            else currentLetterIndex = 0;
        }
        
        atualizarProgresso();
        atualizarInterface();
        
        if (currentGameMode === "misterio") {
            bigLetterEl.textContent = "?";
            bigLetterEl.style.fontFamily = "'Cinzel Decorative', cursive";
        } else {
            const letraAtual = getLetraTransformada(letters[currentLetterIndex]);
            bigLetterEl.textContent = letraAtual;
            bigLetterEl.style.fontFamily = modoFontes[modoAtual].fontFamily;
        }
        
        bigLetterEl.classList.remove("flash-in");
        setTimeout(() => bigLetterEl.classList.add("flash-in"), 10);
        
        setTimeout(() => {
            if (!jogoFinalizado) falarLetra(letters[currentLetterIndex]);
        }, 300);
    }

    function repetirLetra() {
        if (!jogoFinalizado && currentLetterIndex < 26 && !completed[currentLetterIndex]) {
            falarLetra(letters[currentLetterIndex]);
            bigLetterEl.classList.remove("flash-in");
            setTimeout(() => bigLetterEl.classList.add("flash-in"), 10);
        }
    }

    function criarGradeLetras() {
        alphabetGrid.innerHTML = "";
        letters.forEach((letra, idx) => {
            const btn = document.createElement("button");
            btn.className = "letter-btn " + ["c1","c2","c3","c4"][idx % 4];
            btn.setAttribute("data-letter", letra);
            btn.textContent = getLetraTransformada(letra);
            btn.style.fontFamily = modoFontes[modoAtual].fontFamily;
            
            btn.onclick = () => {
                if (!jogoFinalizado) {
                    verificarResposta(letra);
                }
            };
            alphabetGrid.appendChild(btn);
        });
    }

    function criarBolhasMarinhas() {
        setInterval(() => {
            const bolha = document.createElement('div');
            bolha.className = 'bubble-marine';
            const tamanho = Math.random() * 20 + 5;
            bolha.style.width = tamanho + 'px';
            bolha.style.height = tamanho + 'px';
            bolha.style.left = Math.random() * 100 + '%';
            bolha.style.animationDuration = Math.random() * 5 + 3 + 's';
            document.body.appendChild(bolha);
            setTimeout(() => bolha.remove(), 8000);
        }, 1500);
    }

    function iniciarJogo() {
        criarGradeLetras();
        
        document.querySelector('.game-mode-btn[data-gamemode="sequencial"]').classList.add('ativo');
        document.querySelector('.modo-btn[data-modo="print-maius"]').classList.add('ativo');
        
        construirFilaMisterio();
        
        atualizarInterface();
        atualizarProgresso();
        
        bigLetterEl.classList.add("flash-in");
        
        setTimeout(() => {
            falarLetra(letters[0]);
        }, 500);
        
        document.addEventListener('keydown', (e) => {
            if (jogoFinalizado) return;
            const key = e.key.toUpperCase();
            if (letters.includes(key)) {
                e.preventDefault();
                verificarResposta(key);
            }
        });
    }

    document.getElementById("btnRepetir").onclick = repetirLetra;
    document.getElementById("btnReset").onclick = resetarJogo;
    document.getElementById("btnVoltar").onclick = voltarPagina;
    document.getElementById("fullscreenBtn").onclick = toggleFullscreen;
    document.getElementById("audioBtn").onclick = toggleAudio;
    
    window.onload = function() {
        criarBolhasMarinhas();
        iniciarJogo();
        bgMusic.volume = 0.2;
        bgMusic.play().catch(e => console.log("autoplay bloqueado"));
    };
</script>
