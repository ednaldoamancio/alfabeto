<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>🧜‍♂️ Chuva de Letras - Reino de Netuno 🧜‍♀️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Nunito:wght@400;600;700;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0; 
            padding: 0; 
            background: #000000;
            color: #eef5ff;
            font-family: 'Nunito', 'Segoe UI', sans-serif;
            overflow: hidden;
            touch-action: none;
            position: relative;
            min-height: 100vh;
        }

        /* Fundo escuro */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #001a2a 0%, #000000 100%);
            z-index: -2;
            pointer-events: none;
        }

        /* Bolhas flutuantes */
        .bubble-marine {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            background: radial-gradient(circle, rgba(100, 200, 255, 0.5), rgba(50, 150, 200, 0.1));
            border-radius: 50%;
            animation: flutuarBolha linear infinite;
        }

        @keyframes flutuarBolha {
            0% { transform: translateY(100vh) scale(0.3); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.5; }
            100% { transform: translateY(-20vh) scale(1); opacity: 0; }
        }

        .concha {
            position: fixed;
            font-size: 24px;
            pointer-events: none;
            z-index: 1;
            animation: flutuarConcha 14s infinite ease-in-out;
            filter: drop-shadow(0 0 5px rgba(255,215,0,0.3));
            opacity: 0.5;
        }

        @keyframes flutuarConcha {
            0%, 100% { transform: translate(0, 0) rotate(0deg); opacity: 0.3; }
            50% { transform: translate(15px, -30px) rotate(8deg); opacity: 0.7; }
        }

        /* Header */
        .real-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid #ffcd7e;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .header-container {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .titulo-reino {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 1rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffdd99, #ffbc6e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .titulo-reino span { font-size: 1.4rem; }

        .botoes-magicos {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn-musica, .btn-fullscreen {
            font-family: 'Nunito', sans-serif;
            padding: 6px 14px;
            border-radius: 40px;
            font-weight: 800;
            font-size: 0.7rem;
            border: 2px solid #ffcd7e;
            background: rgba(255, 205, 126, 0.15);
            color: #ffeaac;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-fullscreen {
            background: rgba(30, 130, 180, 0.4);
            border-color: #7ec8ff;
        }

        .btn-musica:hover, .btn-fullscreen:hover {
            transform: scale(1.03);
            background: rgba(255, 205, 126, 0.4);
            box-shadow: 0 0 15px rgba(255,205,126,0.5);
            color: white;
        }

        .btn-dourado {
            font-family: 'Nunito', sans-serif;
            padding: 6px 14px;
            border-radius: 40px;
            font-weight: 800;
            font-size: 0.75rem;
            background: linear-gradient(135deg, #f5b042, #ffd700, #f5a623);
            border: 2px solid #fff2b5;
            color: #3a2a1a;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            animation: brilhoDourado 1.5s ease-in-out infinite alternate;
            text-shadow: 0 1px 2px rgba(255,255,200,0.5);
        }

        @keyframes brilhoDourado {
            0% { box-shadow: 0 0 5px rgba(255, 215, 0, 0.4); background: linear-gradient(135deg, #f5b042, #ffd700); }
            100% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.8); background: linear-gradient(135deg, #ffcc44, #ffea8c); }
        }

        .btn-dourado:hover {
            transform: scale(1.05);
            animation: none;
            box-shadow: 0 0 30px rgba(255, 215, 0, 1);
        }

        /* HUD */
        .hud {
            position: fixed;
            top: 80px;
            left: 20px;
            z-index: 50;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 30px;
            padding: 12px 20px;
            border: 1px solid #ffcd7e;
        }
        .letra-alvo {
            font-family: 'Dancing Script', cursive;
            font-size: 1rem;
            margin: 0;
            color: #ffeaac;
        }
        #alvo-atual {
            font-size: 3rem;
            font-family: 'Cinzel Decorative', cursive;
            display: block;
            color: #ffdd99;
            text-shadow: 0 0 10px rgba(255,200,100,0.5);
        }
        .hud p { margin: 5px 0; font-weight: bold; }
        #score-text { color: #ffeaac; font-size: 1.3rem; }

        /* BARRA DE PONTUAÇÃO */
        .ranking-lateral {
            position: fixed;
            right: 20px;
            top: 100px;
            bottom: 50px;
            width: 30px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            border: 2px solid #ffcd7e;
            overflow: hidden;
            z-index: 50;
        }
        .ranking-preenchimento {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 0%;
            transition: height 0.3s ease-out;
            background: linear-gradient(180deg, #48cae4, #1e5f8e);
        }

        /* TELAS */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        #tela-inicio { background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(8px); }
        #tela-vitoria { background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(8px); }

        h1 { 
            font-family: 'Cinzel Decorative', cursive;
            font-size: clamp(30px, 6vw, 50px);
            background: linear-gradient(135deg, #ffdd99, #ffbc6e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 20px;
        }
        
        .btn-jogar {
            padding: 15px 40px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.2rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ffd700, #ffaa33);
            color: #2c1a2e;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 8px 0 #b8860b;
            transition: 0.1s;
            margin-top: 20px;
        }
        .btn-jogar:active { transform: translateY(4px); box-shadow: 0 4px 0 #b8860b; }

        .btn-voltar-vitoria {
            padding: 10px 25px;
            font-family: 'Nunito', sans-serif;
            font-size: 0.9rem;
            font-weight: bold;
            background: linear-gradient(135deg, #555, #333);
            color: #ffeaac;
            border: 2px solid #ffcd7e;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
        }
        .btn-voltar-vitoria:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #666, #444);
            box-shadow: 0 0 15px rgba(255,205,126,0.5);
        }

        .subtexto {
            font-family: 'Dancing Script', cursive;
            font-size: 1.2rem;
            color: #7ec8ff;
            margin-top: 15px;
        }

        .letra-chuva {
            position: fixed;
            width: 3.8vw;
            text-align: center;
            font-size: clamp(25px, 4vw, 60px);
            font-weight: bold;
            text-shadow: 0 0 20px currentColor;
            opacity: 0;
            user-select: none;
            z-index: 10;
            font-family: 'Cinzel Decorative', cursive;
            pointer-events: none;
        }
        
        .congelada { opacity: 1 !important; border-bottom: 4px solid currentColor; animation: piscar 0.5s alternate infinite; }
        .perdida { opacity: 0.2 !important; filter: grayscale(100%); }
        
        @keyframes piscar { from { transform: scale(1); } to { transform: scale(1.2); } }
        
        #mobile-input { position: fixed; opacity: 0; pointer-events: none; top: 0; left: 0; }
        .tridente-decor { position: fixed; bottom: 10px; left: 20px; font-size: 40px; opacity: 0.3; z-index: 0; pointer-events: none; filter: drop-shadow(0 0 5px cyan); }

        @media (max-width: 560px) {
            .real-header { padding: 8px 12px; }
            .titulo-reino { font-size: 0.8rem; }
            .titulo-reino span { font-size: 1.2rem; }
            .btn-musica, .btn-fullscreen, .btn-dourado { padding: 4px 10px; font-size: 0.6rem; }
            .hud { top: 70px; left: 10px; padding: 8px 12px; }
            #alvo-atual { font-size: 2rem; }
            .ranking-lateral { width: 25px; right: 10px; top: 80px; }
            .letra-chuva { font-size: clamp(20px, 3.5vw, 45px); }
            .btn-jogar { padding: 10px 25px; font-size: 1rem; }
        }
    </style>
</head>
<body>

<div class="tridente-decor">🔱🐚</div>

<header class="real-header">
    <div class="header-container">
        <div class="titulo-reino">
            <span>🧜‍♂️</span> Chuva de Letras · Reino de Netuno <span>🧜‍♀️</span>
        </div>
        <div class="botoes-magicos">
            <button class="btn-dourado" id="btnVoltarReinos" onclick="voltarParaReinos()">⬅️⭐ Voltar</button>
            <button class="btn-musica" id="musicaBtn" onclick="toggleMusica()">🎵 Música ON</button>
            <button class="btn-fullscreen" id="fullscreenBtn" onclick="toggleFullscreen()">⛶ Tela Cheia</button>
        </div>
    </div>
</header>

<input type="text" id="mobile-input" autocomplete="off" autocapitalize="characters">

<div id="tela-inicio" class="overlay">
    <h1>🌊 CHUVA DE LETRAS 🌊</h1>
    <p class="subtexto">Aprenda o alfabeto no fundo do mar!</p>
    <button class="btn-jogar" id="btn-start">🐟 INICIAR JOGO 🐟</button>
    <p class="subtexto" style="margin-top: 20px; font-size: 0.9rem;">Pressione ENTER ou Toque para começar</p>
</div>

<div id="tela-vitoria" class="overlay" style="display: none;">
    <h1 id="titulo-vitoria">🧜‍♀️ FANTÁSTICO! 🧜‍♂️</h1>
    <div style="font-size: 2.5rem; color: #ffdd99; text-shadow: 0 0 15px rgba(255,200,100,0.5);" id="pontuacao-final">0 PONTOS</div>
    <button class="btn-jogar" onclick="reiniciarJogo()">🐠 JOGAR DE NOVO 🐠</button>
    <button class="btn-voltar-vitoria" id="btnVoltarVitoria" onclick="voltarParaReinos()">🏠 Voltar para os Reinos</button>
</div>

<div class="hud">
    <p class="letra-alvo">PRÓXIMA LETRA:<br><span id="alvo-atual">A</span></p>
    <p>🏆 PONTOS: <span id="score-text">0</span></p>
</div>

<div class="ranking-lateral">
    <div id="barra-energia" class="ranking-preenchimento"></div>
</div>

<script>
    // ==================== FUNÇÃO PARA VOLTAR ====================
    function voltarParaReinos() {
        if (typeof confetti !== 'undefined') {
            confetti({ particleCount: 60, spread: 60, origin: { y: 0.3 }, colors: ['#ffd700', '#48cae4', '#ffaa33'], startVelocity: 10 });
        }
        window.location.href = 'https://letramento-vogais.vercel.app/';
    }

    // ==================== TELA CHEIA ====================
    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => console.log(err));
            document.getElementById('fullscreen-btn').innerHTML = "✖ SAIR TELA";
        } else {
            document.exitFullscreen();
            document.getElementById('fullscreen-btn').innerHTML = "⛶ TELA CHEIA";
        }
    }

    // ==================== MÚSICA (Web Audio API - som ambiente gerado) ====================
    let musicaAtiva = true;
    let audioContext = null;
    let oscillator = null;
    let gainNode = null;
    let musicInterval = null;

    function criarSomAmbiente() {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        
        if (musicInterval) clearInterval(musicInterval);
        
        const playAmbientSound = () => {
            if (!musicaAtiva || !audioContext) return;
            
            const now = audioContext.currentTime;
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            
            osc.type = 'sine';
            osc.frequency.value = 100 + Math.random() * 50;
            gain.gain.value = 0.05;
            
            osc.connect(gain);
            gain.connect(audioContext.destination);
            
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, now + 1.5);
            osc.stop(now + 1.5);
        };
        
        playAmbientSound();
        musicInterval = setInterval(playAmbientSound, 3000);
    }

    function pararSomAmbiente() {
        if (musicInterval) {
            clearInterval(musicInterval);
            musicInterval = null;
        }
    }

    function toggleMusica() {
        const btn = document.getElementById('musicaBtn');
        if (musicaAtiva) {
            musicaAtiva = false;
            pararSomAmbiente();
            btn.innerHTML = "🔇 MÚSICA";
            btn.style.background = "rgba(0,0,0,0.6)";
        } else {
            musicaAtiva = true;
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            audioContext.resume();
            criarSomAmbiente();
            btn.innerHTML = "🎵 MÚSICA ON";
            btn.style.background = "rgba(255, 205, 126, 0.15)";
        }
    }

    // ==================== SONS COM WEB AUDIO API ====================
    let somContext = null;

    function tocarSomAcerto() {
        if (!somContext) somContext = new (window.AudioContext || window.webkitAudioContext)();
        somContext.resume();
        
        const now = somContext.currentTime;
        const osc = somContext.createOscillator();
        const gain = somContext.createGain();
        
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.value = 0.15;
        
        osc.connect(gain);
        gain.connect(somContext.destination);
        
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, now + 0.3);
        osc.stop(now + 0.3);
    }

    function tocarSomErro() {
        if (!somContext) somContext = new (window.AudioContext || window.webkitAudioContext)();
        somContext.resume();
        
        const now = somContext.currentTime;
        const osc = somContext.createOscillator();
        const gain = somContext.createGain();
        
        osc.type = 'sawtooth';
        osc.frequency.value = 220;
        gain.gain.value = 0.2;
        
        osc.connect(gain);
        gain.connect(somContext.destination);
        
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, now + 0.4);
        osc.stop(now + 0.4);
    }

    function tocarSomQueda() {
        if (!somContext) somContext = new (window.AudioContext || window.webkitAudioContext)();
        somContext.resume();
        
        const now = somContext.currentTime;
        const osc = somContext.createOscillator();
        const gain = somContext.createGain();
        
        osc.type = 'triangle';
        osc.frequency.value = 150;
        gain.gain.value = 0.1;
        
        osc.connect(gain);
        gain.connect(somContext.destination);
        
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, now + 0.5);
        osc.stop(now + 0.5);
    }

    function tocarSomVitoria() {
        if (!somContext) somContext = new (window.AudioContext || window.webkitAudioContext)();
        somContext.resume();
        
        const notas = [523.25, 587.33, 659.25, 698.46, 783.99, 880.00];
        notas.forEach((freq, i) => {
            setTimeout(() => {
                const osc = somContext.createOscillator();
                const gain = somContext.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.value = 0.15;
                osc.connect(gain);
                gain.connect(somContext.destination);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, somContext.currentTime + 0.5);
                osc.stop(somContext.currentTime + 0.5);
            }, i * 150);
        });
    }

    // ==================== JOGO PRINCIPAL ====================
    const alfabeto = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    let indexAtual = 0;
    let score = 0;
    let currentUtterance = null;
    const maxScore = 1000;
    const tempoQuedaSegundos = 2.2;
    let letrasEmJogo = [];
    let jogoRodando = false;
    let animationId = null;

    const inputMobile = document.getElementById('mobile-input');
    const btnStart = document.getElementById('btn-start');

    // Função de fala para pronúncia das letras
    function falarLetra(letra) {
        if (currentUtterance) window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(letra);
        utterance.lang = 'pt-BR';
        utterance.rate = 0.9;
        utterance.pitch = 1.1;
        window.speechSynthesis.speak(utterance);
        currentUtterance = utterance;
    }

    // Criar elementos das letras
    for (let i = 0; i < alfabeto.length; i++) {
        const el = document.createElement('div');
        el.className = 'letra-chuva';
        el.innerText = alfabeto[i];
        el.style.color = `hsl(${i * 13 + 180}, 70%, 65%)`;
        el.style.left = (i * 3.5 + 2) + 'vw';
        el.style.top = '-100px';
        document.body.appendChild(el);
        letrasEmJogo.push({ elemento: el, letra: alfabeto[i], y: -100, ativa: false, resolvida: false, startTime: 0 });
    }

    function atualizarEnergia(mudanca) {
        score = Math.max(0, Math.min(maxScore, score + mudanca));
        document.getElementById('score-text').innerText = score;
        
        const barra = document.getElementById('barra-energia');
        const porc = (score / maxScore) * 100;
        barra.style.height = porc + '%';
        
        if (porc < 25) barra.style.background = "linear-gradient(180deg, #ff6b6b, #cc0000)";
        else if (porc < 50) barra.style.background = "linear-gradient(180deg, #ffaa33, #ff6600)";
        else if (porc < 75) barra.style.background = "linear-gradient(180deg, #ffdd66, #ffaa00)";
        else barra.style.background = "linear-gradient(180deg, #48cae4, #1e5f8e)";
    }

    function iniciarLetra(index) {
        if (index >= alfabeto.length) {
            vencerJogo();
            return;
        }
        const obj = letrasEmJogo[index];
        document.getElementById('alvo-atual').innerText = obj.letra;
        document.getElementById('alvo-atual').style.color = obj.elemento.style.color;
        obj.ativa = true;
        obj.resolvida = false;
        obj.startTime = Date.now();
        obj.elemento.style.opacity = '1';
        obj.elemento.classList.remove('congelada', 'perdida');
        falarLetra(obj.letra);
    }

    function loopJogo() {
        if (!jogoRodando) return;
        
        if (indexAtual < alfabeto.length) {
            const obj = letrasEmJogo[indexAtual];
            if (obj && obj.ativa && !obj.resolvida) {
                const alturaChao = window.innerHeight - 80;
                const decorrido = (Date.now() - obj.startTime) / 1000;
                const progresso = decorrido / tempoQuedaSegundos;
                obj.y = -100 + (progresso * (alturaChao + 100));
                
                if (progresso >= 1.0) {
                    obj.y = alturaChao;
                    obj.resolvida = true;
                    obj.elemento.classList.add('perdida');
                    tocarSomQueda();
                    atualizarEnergia(-30);
                    indexAtual++;
                    iniciarLetra(indexAtual);
                }
                obj.elemento.style.top = obj.y + 'px';
            }
        }
        
        animationId = requestAnimationFrame(loopJogo);
    }

    function processarTecla(tecla) {
        if (!jogoRodando || indexAtual >= alfabeto.length) return;
        const letraDigitada = tecla.toUpperCase();
        const objAtual = letrasEmJogo[indexAtual];
        
        if (letraDigitada === objAtual.letra) {
            tocarSomAcerto();
            const progresso = (Date.now() - objAtual.startTime) / (tempoQuedaSegundos * 1000);
            const pontosGanhos = Math.max(15, Math.floor(50 * (1 - progresso)));
            atualizarEnergia(pontosGanhos);
            objAtual.resolvida = true;
            objAtual.elemento.classList.add('congelada');
            
            confetti({ particleCount: 15, spread: 30, origin: { y: 0.7 }, colors: ['#ffd700', '#48cae4'] });
            
            indexAtual++;
            iniciarLetra(indexAtual);
        } else {
            tocarSomErro();
            atualizarEnergia(-15);
            document.body.animate([{ opacity: 0.7 }, { opacity: 1 }], 100);
            falarLetra(objAtual.letra);
        }
    }

    function iniciarJogo() {
        if (jogoRodando) return;
        document.getElementById('tela-inicio').style.display = 'none';
        if (musicaAtiva) {
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            audioContext.resume();
            criarSomAmbiente();
        }
        inputMobile.focus();
        
        indexAtual = 0;
        score = 0;
        atualizarEnergia(0);
        
        for (let i = 0; i < letrasEmJogo.length; i++) {
            letrasEmJogo[i].ativa = false;
            letrasEmJogo[i].resolvida = false;
            letrasEmJogo[i].y = -100;
            letrasEmJogo[i].elemento.style.top = '-100px';
            letrasEmJogo[i].elemento.style.opacity = '0';
            letrasEmJogo[i].elemento.classList.remove('congelada', 'perdida');
        }
        
        setTimeout(() => {
            jogoRodando = true;
            iniciarLetra(0);
            loopJogo();
        }, 500);
    }

    function reiniciarJogo() {
        document.getElementById('tela-vitoria').style.display = 'none';
        iniciarJogo();
    }

    function vencerJogo() {
        jogoRodando = false;
        if (animationId) cancelAnimationFrame(animationId);
        pararSomAmbiente();
        tocarSomVitoria();
        
        confetti({ particleCount: 200, spread: 100, origin: { y: 0.5 }, colors: ['#ffd700', '#48cae4', '#ffaa33'] });
        
        document.getElementById('tela-vitoria').style.display = 'flex';
        document.getElementById('pontuacao-final').innerHTML = score + " PONTOS";
        
        for (let i = 0; i < 50; i++) {
            setTimeout(() => {
                const bolha = document.createElement('div');
                bolha.className = 'bubble-marine';
                const tamanho = Math.random() * 20 + 5;
                bolha.style.width = tamanho + 'px';
                bolha.style.height = tamanho + 'px';
                bolha.style.left = Math.random() * 100 + '%';
                bolha.style.animationDuration = Math.random() * 3 + 2 + 's';
                document.body.appendChild(bolha);
                setTimeout(() => bolha.remove(), 4000);
            }, i * 50);
        }
    }

    // Eventos
    btnStart.addEventListener('click', iniciarJogo);
    window.addEventListener('keydown', (e) => {
        if (e.key === "Enter" && !jogoRodando && document.getElementById('tela-inicio').style.display !== 'none') {
            iniciarJogo();
        }
        if (jogoRodando && /^[a-zA-Z]$/.test(e.key)) {
            processarTecla(e.key);
        }
    });
    
    inputMobile.addEventListener('input', (e) => {
        const val = e.target.value;
        if (val.length > 0 && jogoRodando) {
            processarTecla(val.charAt(val.length - 1));
            e.target.value = '';
        }
    });
    
    document.addEventListener('touchstart', () => {
        if (jogoRodando) inputMobile.focus();
    });
    
    document.addEventListener('click', () => {
        if (jogoRodando) inputMobile.focus();
    });
    
    // ==================== DECORAÇÕES ====================
    function criarBolhasMarinhas() {
        setInterval(() => {
            const bolha = document.createElement('div');
            bolha.className = 'bubble-marine';
            const tamanho = Math.random() * 25 + 5;
            bolha.style.width = tamanho + 'px';
            bolha.style.height = tamanho + 'px';
            bolha.style.left = Math.random() * 100 + '%';
            bolha.style.animationDuration = Math.random() * 5 + 3 + 's';
            bolha.style.opacity = Math.random() * 0.5 + 0.2;
            document.body.appendChild(bolha);
            setTimeout(() => bolha.remove(), 8000);
        }, 1200);
    }
    
    function criarConchasFlutuantes() {
        const conchasSimbolos = ['🐚', '⭐', '🌟', '🐟', '🧜‍♀️', '🔱', '🌊', '🐠', '🐙', '🪸', '🐡', '🐬'];
        setInterval(() => {
            if (document.body) {
                const concha = document.createElement('div');
                concha.className = 'concha';
                concha.innerText = conchasSimbolos[Math.floor(Math.random() * conchasSimbolos.length)];
                concha.style.left = Math.random() * 100 + '%';
                concha.style.top = '-30px';
                concha.style.fontSize = Math.random() * 24 + 16 + 'px';
                concha.style.animationDuration = Math.random() * 12 + 8 + 's';
                document.body.appendChild(concha);
                setTimeout(() => concha.remove(), 13000);
            }
        }, 7000);
    }
    
    criarBolhasMarinhas();
    criarConchasFlutuantes();
    
    // Boas-vindas
    setTimeout(() => {
        const msgDiv = document.createElement('div');
        msgDiv.style.position = 'fixed';
        msgDiv.style.bottom = '20px';
        msgDiv.style.left = '50%';
        msgDiv.style.transform = 'translateX(-50%)';
        msgDiv.style.background = 'rgba(0,0,0,0.8)';
        msgDiv.style.color = '#ffeaac';
        msgDiv.style.padding = '8px 20px';
        msgDiv.style.borderRadius = '40px';
        msgDiv.style.fontSize = '0.8rem';
        msgDiv.style.zIndex = '1000';
        msgDiv.style.fontFamily = "'Dancing Script', cursive";
        msgDiv.innerHTML = "🧜‍♀️ Bem-vindo ao Reino de Netuno! Digite as letras no teclado! 🧜‍♂️";
        document.body.appendChild(msgDiv);
        setTimeout(() => msgDiv.remove(), 4000);
    }, 500);
    
    document.documentElement.requestFullscreen().catch(e => console.log("fullscreen não permitido"));
</script>
</body>
</html>
